# c2pool-btc -- example settings file (TOML), checked against release 0.2.12.1
#
# WHAT THIS IS
#   Launch settings for the c2pool-btc node (Bitcoin, SHA256d). The upper part
#   sets the keys this binary applies from a file. The REFERENCE block at the
#   end lists the keys the file loader accepts but this release does not apply
#   (use their CLI flags instead).
#
# WHERE TO PUT IT
#   Either name it on the command line:
#     c2pool-btc --settings /etc/c2pool/c2pool-btc.toml
#   or copy it to <data-dir>/c2pool.toml (data dir default: ~/.c2pool, or the
#   one given with --data-dir); that file is loaded when --settings is absent.
#   An explicit --settings path that does not exist is fatal (exit 78).
#   Run the binary from the unpacked release directory: its dashboard serves
#   ./web-static relative to the working directory. Do not launch through
#   start.sh: it adds --coin-p2p-discover --stratum 9332 --http 8080 on the
#   command line, and command-line flags override this file.
#
# PRECEDENCE
#   compiled defaults  <  this file  <  command-line flags
#   A flag on the command line always wins over the same key in this file.
#
# CHECK IT BEFORE YOU RUN
#   c2pool-btc --settings c2pool-btc.toml --dump-resolved-config
#   prints "key=value source=compiled|file|cli" for each resolved key and
#   exits 0 without starting the node (no coin source needed for the dump).
#   A key left at its compiled default is usually not printed. "source=file"
#   proves the file was read, not that the key is used: keys from the
#   REFERENCE block also print as source=file.
#
# MONEY GATE
#   Keys marked [money] (fees, donation, payout addresses, network identity)
#   are never accepted from a file without your explicit acknowledgement:
#     1. uncomment the key(s) and enter your own value(s);
#     2. run  c2pool-btc --settings c2pool-btc.toml --ack-money-settings
#        it exits 0; the last line of its output is the hash (64 hex chars);
#     3. put that hash in [gate] money_ack_hash at the end of this file;
#     4. run --dump-resolved-config again: exit 0, money keys show source=file.
#   Without a matching hash the node refuses to start, names the money keys
#   and exits 78. Changing, adding or removing any money key changes the hash:
#   repeat steps 2 and 3. The same values given as CLI flags need no hash.
#
# FORMAT
#   Keys live in [btc.<section>] tables. A misspelled key in a [btc.*] table
#   is fatal (exit 78). Tables for other coins are ignored by this binary, but
#   use one file per binary all the same: [gate] holds a single money_ack_hash.
#
# POSTURE
#   Daemonless: coin_p2p.discover = true finds Bitcoin network peers by itself
#   (DNS, fixed and HTTP seeds), so no bitcoind is needed. Leave the
#   [btc.daemon_rpc] keys commented out for that. With this file the node
#   starts with no further flags:  c2pool-btc --settings c2pool-btc.toml
#   Without discover = true and without daemon_rpc.endpoint the binary prints
#   its usage and exits 1.
#
# PORTS (one host running ltc, dash, btc, dgb and bch from these examples)
#   btc: sharechain 9333, Stratum 9334, web 8083
#   ltc 9326/9327/8080, dash 8999/7903/8082, dgb 5024/9434/8084,
#   bch 9349/9534/8085 (sharechain/Stratum/web)

[btc.coin_p2p]
discover = true             # daemonless Bitcoin peer discovery; default false. Must be exactly true (lower case)

[btc.sharechain]
listen = "0.0.0.0:9333"     # sharechain (pool P2P) listener; default port 9333. Only the PORT part is used
# network_id = "<hex, up to 8 bytes>"   # [money] private sharechain identifier; default empty = public BTC sharechain
# prefix = "<hex>"                      # [money] private sharechain prefix; default empty = compiled prefix; ignored without network_id

[btc.stratum]
bind = "0.0.0.0:9334"       # Stratum (miner) listener [HOST:]PORT; default off (port 0)

[btc.web]
port = 8083                 # dashboard TCP port, bound on 0.0.0.0; default 0 (off). For a loopback-only bind use the CLI: --http 127.0.0.1:8083

[btc.daemon_rpc]
# Leave these commented out for the daemonless posture.
# endpoint = "127.0.0.1:8333"                  # bitcoind P2P endpoint HOST:PORT (CLI --bitcoind, despite the section name); default none
# submit_endpoint = "127.0.0.1:8332"           # bitcoind RPC endpoint for the submitblock backup (CLI --coin-rpc); default none
# auth_file = "/home/<user>/.bitcoin/bitcoin.conf"   # file holding rpcuser/rpcpassword for that RPC (CLI --coin-rpc-auth); default ~/.bitcoin/bitcoin.conf

[btc.money]
# give_author_pct = 0.1                        # [money] author donation, percent 0-100; default 0.1
# node_owner_fee_pct = 1.0                     # [money] node-owner fee, percent 0-100; default 0 (off); needs node_owner_address
# node_owner_address = "<your-BTC-address>"    # [money] where the node-owner fee is paid (P2PKH/P2SH/P2WPKH); default none

[gate]
# money_ack_hash = "<64-hex output of: c2pool-btc --settings THIS_FILE --ack-money-settings>"   # needed only when a [money] key is uncommented

# ---------------------------------------------------------------------------
# REFERENCE: keys the loader ACCEPTS but c2pool-btc 0.2.12.1 does NOT apply
# ---------------------------------------------------------------------------
# The loader knows these keys (so they are not refused as typos) and
# --dump-resolved-config shows them as source=file when set, but this release
# copies only the keys above into the running node. Setting one of these here
# has no effect: use the CLI flag shown. A [money] key still trips the money
# gate. Defaults are not repeated here; see "Per-binary launch reference" in
# README.md. Form:  key [money] -- meaning (CLI flag)
# [btc.meta]
#   data_dir -- data directory; cannot work from a file, the file itself is found through the data dir (CLI: --data-dir)
# [btc.network]
#   testnet [money] -- testnet network identity (CLI: --testnet)
#   regtest [money] -- regtest network identity (CLI: --regtest)
#   testnet4 [money] -- testnet4 network identity (CLI: --testnet4)
# [btc.sharechain]
#   addnodes -- persistent outbound sharechain peers (CLI: --sharechain-addnode)
#   legacy_peer -- legacy single sharechain peer (CLI: --p2pool)
# [btc.merged]
#   spec -- merged-mining spec SYMBOL:CHAIN:HOST:PORT:USER:PASS (CLI: --merged)
