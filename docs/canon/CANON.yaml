  - id: C43
    title: fork choice, rewind, joiner
    statement: 'Best chain = the fully verified carrier chain with the greatest cumulative carrier difficulty, ties by lower tip id; receipts never count; no consensus reorg depth limit; the journal depth is node policy, at least J_0 and never in a lane digest; a switch deeper than the journal, or a failed load of the stored lane state, takes the joiner path: the activation record is re-seeded by the joiner row (epoch_cur, p0 - 1, rules_cur), p0 - 1 = the position of the adopted state, and holds no row below it; a restore below p0 - 1 is refused (fail closed); headers first; a joiner verifies carrier PoW over the span [x0, L], x0 = min(L - 1175, the first x with H(x) > H(L) - F - fresh_max), at least max(J_0, ceil((F + fresh_max) x 120 / T) + seal_depth) = 1176 positions, J_0 = max(ceil(3 h x 3600 / T), ceil(F x 120 / T) + seal_depth) = 1152, with retarget_span headers before the span and sealed bins as buckets with MMR proofs; the positions before x1, the first x with H(x) >= H(x0 - 1) + F + fresh_max, by PoW, hashes and roots only; no older history.'
