  - id: C37
    title: payout from pre-block state
    statement: 'The coinbase a receipt commits is the canonical coinbase of (tip, v, prev_id, R): at hf 16 the full reward R split exactly over window(tip, v) by work (floor, largest remainder, ties by payee identity), one output per window payee, no separate fee output, an empty window pays R to the receipt payee; amounts per (tip, v, R), output keys per (tip, prev_id); output order hf 16 by payee identity ascending, hf 17 by one-time key ascending, strict; every node checks it for every receipt at admission before RandomX, refuses a mismatch it computed itself and bans the sender; a node-internal failure of that check is a local alarm and DEFER, with no strike token; at hf >= 17 the receipt is refused with no token, no ban and no RandomX; payee_ref and owner_ref identities equal the side-data payee and owner identities, checked before any fetch, STRIKE otherwise; tx_extra = PBX1, no clear-text pool tag, merge-mining depth 0; payees are standard addresses.'
