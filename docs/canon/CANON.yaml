  - id: C22
    title: legally dead by chain data
    statement: 'LEGALLY DEAD is decided by chain data only, never by a clock or an arrival time (ties C03 and C08): the template height is non-decreasing along the carrier chain, and a receipt is dead when the placing chain had recorded a newer Monero height by the receipt''s own position + 2 (own position = position of its tip + 1; judged no later than the carrier before the one that places it), so work for a Monero height the chain has passed earns nothing, a same-height race stays live, and useful work carried late stays live. Stated, not prevented: a stale template one height behind keeps about 8-15 % of its work before the chain records the new height (two heights behind about 3 %), and deliberate stale work is block withholding, priced as such.'
    source: 'PATH-B.md ledger-free rules (LEGALLY DEAD); docs/c2pool-v37-the-temporal-levels.md section 2; ~/v37-work/mrrpathb/DESIGN.md section 2.3 and section 7 item 3; fverify/VERIFY.md section 2 (stale ride lag 1 0.148, lag 2 0.029, hub model 0.077); docs/canon/COMMITMENTS.md note (a)'
    ruling: 'operator 2026-10-04 11:22 +04 (Path B, LEGALLY DEAD by chain data); 2026-10-04 21:07-22:12 +04 (R1: liveness at the work''s own position + 2)'
    scope: [src/c2pool/v37/xmr/relay/, src/impl/xmr/receipt/]
    checks:
      - name: legally-dead-kat
        type: required_kat
        kats: [xmr_receipt_legally_dead_kat]
      - name: no-grace-timer
        type: forbidden
        pattern: '\bgrace_ms\b'
        scope: xmr_lane_code
        code_only: true
        note: 'Today the receipt ingest closes a bin after a wall-clock grace period (grace_ms), so lateness depends on arrival time.'
    status_now: fail
    deviation: [D1, D3]

