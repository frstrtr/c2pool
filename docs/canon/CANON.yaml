  # ---------------------------------------------------------------------------
  # Public commitments of the reply to the external review (gist 636eca0b,
  # comment 6406130, 2026-10-04) and the Path B rulings of 2026-10-04 and
  # 2026-10-05 (added 2026-10-05 on operator request "add provable work fees
  # and other from my Schernykh gist reply in full to canon"). The register of
  # the commitments, with the rulings and their evidence, is
  # docs/canon/COMMITMENTS.md.
