  - id: C23
    title: rules ratchet
    statement: 'A rule change is an epoch appended on the carrier chain; the genesis rules are epoch 0; pool genesis = sha256d("V37GEN" || monero_block_hash(H) || u8 len || headline), H at least 60 Monero blocks deep; pool_id derived from the pool genesis = sha256d("V37PID" || u8 network || u32 chain_id || pool_genesis); the raw form only on regtest and test networks; every receipt carries rules_epoch and a ballot under its own PoW; vote windows are one global grid of L = 34881 positions from lane genesis; a deployment locks in over a window when 4 x yes work >= 3 x all window work; activation at lock-in + GRACE, GRACE = 120960 positions; TIMEOUT 941760 positions: STARTED spans exactly the 26 whole windows inside it, yes ballots are written only while the attempt is open (STARTED, or LOCKED_IN before its timeout; LOCKED_IN takes precedence over STARTED), and without a lock-in the attempt is FAILED, final, at start + 26 L (after its timeout an attempt never re-opens or re-locks), and the epoch number may be re-proposed with a start at or after timeout + GRACE of every earlier attempt, timeout = start + 26 L, which the re-proposing release carries in its compiled table and checks at start-up, refusing to start otherwise; every node term is evaluated at the position being judged or built, from the committed state the carrier there commits, and an attempt is locked in up to and including its own activation position; at most one deployment is open at a time; every carrier commits the ratchet state (rs_root, folded into receipts_root), which every node recomputes for each carrier and a joiner adopts by PoW; upgraded software ballots yes by default, an operator opts out; a node implements the rules in force iff its compiled digest for the epoch in force equals the committed rules digest, and the open epoch iff its own attempt is open or locked in; E_impl is the prefix maximum, the same for followers and joiners; a node HOLDs at once when E_impl is below the epoch in force or its digest for the epoch in force differs from the committed one, and otherwise at lock-in + GRACE - 1 when a kept window of the committed state shows ballots above E_impl with 3/4 of all window work, with no descriptor of that epoch and no peer; from lock-in + GRACE it defers frames it cannot judge in a capped store, drops the rest, and never strikes or bans for them; any other mismatching rules_epoch is refused, never a HOLD; a carried receipt whose tip branch runs more than GRACE positions past its fork point with the best chain is deferred on every node and dropped when its bin seals; the activation record is persistent per chain, never pruned with the journal.'
    source: 'ref: the:C23'
    ruling: 'ref: the:C23'
    scope: [src/c2pool/v37/xmr/, src/c2pool/v37/main_v37_xmr.cpp]
    checks:
      - name: headline-genesis
        type: required
        pattern: '"V37GEN"'
        scope: xmr_lane_code
        code_only: false
      - name: ratchet-kats
        type: required_kat
        kats: [v37_xmr_epoch_kat, v37_xmr_ballot_kat, xmr_epoch_tally_kat]
      - name: vote-window
        type: constant
        pattern: '\bkVoteWindowPositions\s*=\s*([0-9]+)'
        scope: xmr_lane_code
        min: 34881
        max: 34881
      - name: grace
        type: constant
        pattern: '\bkGracePositions\s*=\s*([0-9]+)'
        scope: xmr_lane_code
        min: 120960
        max: 120960
      - name: timeout
        type: constant
        pattern: '\bkTimeoutPositions\s*=\s*([0-9]+)'
        scope: xmr_lane_code
        min: 941760
        max: 941760
      - name: no-second-clause
        type: forbidden
        pattern: '\b(?:kVoteFloorNum|kVoteFloorDen|kLaneBlocksK|kVoteStreak)\b'
        scope: xmr_lane_code
        code_only: true
    status_now: fail
    deviation: [D11, D36, D39]

