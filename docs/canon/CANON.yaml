# Lane constants: the consensus lane constants of the XMR lane (C46). Fields:
# id, name, value, kind (chain, target or ruling), state (ruled or proposed),
# ref. No check reads this section.
# Not in the list: K12, K13 (C34 is proposed); K14 (C18 open_items); K19, K26, K27 (node policy, C46); K28 (C42).
lane_constants:
  - id: K01
    name: carrier interval T
    value: '10 s'
    kind: target
    state: ruled
    ref: 'the:K01'
  - id: K02
    name: d_min
    value: '18180'
    kind: target
    state: ruled
    ref: 'the:K02'
  - id: K03
    name: retarget
    value: 'N_rt = 2160 carriers; m_rt = 9; g* = 1.01; formula as C11; no per-step bound'
    kind: target
    state: ruled
    ref: 'the:K03'
  - id: K04
    name: open bins F
    value: '96 Monero heights'
    kind: target
    state: ruled
    ref: 'the:K04'
  - id: K05
    name: liveness delta
    value: '1'
    kind: target
    state: ruled
    ref: 'the:K05'
  - id: K06
    name: seal depth
    value: '0: the bin seals at its fold carrier'
    kind: ruling
    state: ruled
    ref: 'the:K06'
  - id: K07
    name: tip freshness
    value: '0 <= h(r) - h(tip) <= 2'
    kind: target
    state: ruled
    ref: 'the:K07'
  - id: K08
    name: R_MAX
    value: '16 receipts per carrier; 1 + R_MAX = 17 receipt bodies per frame'
    kind: target
    state: ruled
    ref: 'the:K08'
  - id: K09
    name: COVERAGE
    value: '2'
    kind: target
    state: ruled
    ref: 'the:K09'
  - id: K10
    name: N rule
    value: 'max(1, floor((Z - 2 x OVH(hf)) / (2 x OUT(hf)))); hf >= 17: min(., FCMP_PLUS_PLUS_MAX_MINER_OUTPUTS); 3747 at hf 16, Z 300000 (tail emission); >= 1595 for every hf, base reward and Z >= zone(hf)'
    kind: chain
    state: ruled
    ref: 'the:K10'
  - id: K11
    name: window bound and merge-back
    value: '(W + w_b) x f_spend <= B(A_t) x min(d_min_so_far, d_min(b)), d_min over receipt entries; merge-back when w x B(A_t) < W x f_spend; sealed-bin rows (miner, owner, w_miner, w_owner, w_author)'
    kind: chain
    state: ruled
    ref: 'the:K11'
  - id: K15
    name: owner fee
    value: 'weight share floor(work x p / 10000), p 0..10000 bp, p + give_author_bp <= 10000 (STRIKE; 10000 valid), no cap'
    kind: ruling
    state: ruled
    ref: 'the:K15'
  - id: K16
    name: author donation
    value: 'give_author_bp 0..10000; default 10 bp; the author identity; p + give_author_bp <= 10000 (STRIKE; 10000 valid)'
    kind: ruling
    state: ruled
    ref: 'the:K16'
  - id: K17
    name: payment groups
    value: '1'
    kind: ruling
    state: ruled
    ref: 'the:K17'
  - id: K18
    name: receipt size rule and caps
    value: 'body = 465 + 32 x D (399 + 32 x D at p = 0); D == floor(log2(n_tx + 1 + X(hf))); n_tx <= floor(2 x Z(P_r) / w_min); blob_len <= 78; RECEIPT_CAP(hf, P_r) = 465 + 32 x D_max(hf, P_r); FRAME_CAP = FH + 2 + (1 + R_MAX) x RECEIPT_CAP, FH = 6'
    kind: chain
    state: ruled
    ref: 'the:K18'
  - id: K20
    name: monero_rules_digest
    value: 'sha256d("c2pool-v37-xmr-monero-rules-v1" || TLV), 30-byte domain, no terminator; TLV entries u8 id | u8 len | value, ids from 1, strictly ascending; 26 entries; TLV 287 B, preimage 317 B; golden 61affbea4c4ab212b9fbfd8b3a9ae6954840660890df6fca9d8027b8f09738f4 on all four networks'
    kind: chain
    state: ruled
    ref: 'the:K20'
  - id: K21
    name: receipt side data
    value: 'side_data_v3, 241 bytes; payee kind XMR_STD only; receipt id = keccak256(hashing_blob); the pool identity is not in the rules TLV (HELLO head)'
    kind: ruling
    state: ruled
    ref: 'the:K21'
  - id: K22
    name: Path B rules codec
    value: '2'
    kind: ruling
    state: ruled
    ref: 'the:K22'
  - id: K23
    name: carrier chains
