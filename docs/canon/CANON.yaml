# The c2pool v37 design canon: machine-readable rules.
#
# Each rule gives an id, a short title, a one-line statement with its values,
# the code it governs and the checks a machine runs. source and ruling hold an
# opaque reference (ref: the:Cnn) to the full text, which is kept outside this
# repository. tools/canon/canon_check.py runs the checks (in CI on every pull
# request and push to master, and daily from cron) and fails on any NEW
# violation: a failing rule with no open deviation in DEVIATIONS.md, a check
# that passed in baseline.json and fails now, a forbidden count above the
# baseline, a required KAT that disappeared, or a pull request without a
# required body line.
#
# A rule is changed only in a pull request whose body names it ("Canon: C03").
#
# Check types:
#   required_kat  each named ctest must be registered in CMake, built by the CI
#                 build.yml --target lists, and (when a ctest junit is given)
#                 pass.
#   constant      regex with one capture group; every captured integer must lie
#                 in [min, max]; absent_ok allows the constant to be gone.
#   forbidden     regex that must not match in the scope, minus an allowlist
#                 (path, count, reason); the remaining count may never grow
#                 over baseline.json.
#   required      regex that must match at least min_count times in the scope.
#   pr_body       a pull request touching the paths carries a body line:
#                 "Canon: C03, C07" (line: Canon, rule C10), "KAT: <ctest
#                 names>" or "KAT: none (reason)" (line: KAT, rule C31),
#                 "Design: <URL or path>" or "Design: none (reason)" (line:
#                 Design, rule C40), or "Conformance: the:INV-nn, ...;
#                 departures: none | Dnn, ..." (line: Conformance, rule C47).
#   register      every failing rule maps to an open deviation (rule C09).
#
# in_force: true (on a required check): the rule's subject is in the running
# node. A deviation is closable only when every rule it maps to passes,
# in_force checks included, and not on KAT presence alone.
#
# open_items (optional, per rule): open spec items; no check reads them.
#
# Rule states:
#   ruled         (default) failing it without an open deviation is a NEW
#                 violation.
#   proposed      evaluated and reported, never fails a run, has no deviation;
#                 waits_for names what it waits for.
#
# Syntax: the YAML subset read by canon_check.py (no tabs, no block scalars,
# no anchors, no flow mappings). Regexes are single-quoted (backslash literal).

version: 1
register: DEVIATIONS.md
baseline: baseline.json

scopes:
  xmr_lane_code:
    include:
      - src/c2pool/v37/xmr/**
      - src/impl/xmr/**
      - src/c2pool/v37/main_v37_xmr.cpp
    exclude:
      - '**/test/**'
      - '**/tests/**'
      - src/impl/xmr/third_party/**
      - src/impl/xmr/coin/vendor/**
      - src/impl/xmr/coin/compat/**
      - src/impl/xmr/settle/_compile_check/**
    extensions: [.hpp, .cpp, .h, .cc, .ipp, .inc]
  xmr_lane_and_engine_code:
    include:
      - src/c2pool/v37/xmr/**
      - src/impl/xmr/**
      - src/c2pool/v37/main_v37_xmr.cpp
      - src/sharechain/v37/**
    exclude:
      - '**/test/**'
      - '**/tests/**'
      - src/impl/xmr/third_party/**
      - src/impl/xmr/coin/vendor/**
      - src/impl/xmr/coin/compat/**
      - src/impl/xmr/settle/_compile_check/**
    extensions: [.hpp, .cpp, .h, .cc, .ipp, .inc]
  xmr_lane_licence:
    include:
      - src/c2pool/v37/xmr/**
      - src/impl/xmr/**
      - src/c2pool/v37/main_v37_xmr.cpp
      - src/c2pool/v37/test/*xmr*
      - src/sharechain/v37/v37_descriptor_xmr*
      - src/sharechain/v37/test/*xmr*
    exclude:
      - src/impl/xmr/third_party/**
      - src/impl/xmr/coin/vendor/**
    extensions: [.hpp, .cpp, .h, .c, .cc, .ipp, .inc, .py, .cmake, .txt]
  xmr_consensus_core:
    include:
      - src/impl/xmr/receipt/**
      - src/impl/xmr/settle/**
      - src/impl/xmr/native/consensus/**
      - src/impl/xmr/pow/randomx_verify.hpp
      - src/c2pool/v37/xmr/relay/xmr_order_rule.hpp
      - src/c2pool/v37/xmr/relay/xmr_share_verdict.hpp
      - src/c2pool/v37/xmr/relay/xmr_receipt_mint.hpp
      - src/c2pool/v37/xmr/relay/xmr_rbind_registry.hpp
      - src/c2pool/v37/xmr/xmr_lane_rules.hpp
      - src/c2pool/v37/xmr/xmr_lane_rules_build.hpp
      - src/c2pool/v37/xmr/xmr_credit_cut.hpp
      - src/c2pool/v37/xmr/xmr_cut_payees.hpp
      - src/c2pool/v37/xmr/xmr_coinbase_authority.hpp
      - src/c2pool/v37/xmr/xmr_coinbase_recompute.hpp
      - src/c2pool/v37/xmr/xmr_settlement_coinbase_shape.hpp
      - src/c2pool/v37/xmr/xmr_paynow.hpp
      - src/c2pool/v37/xmr/xmr_fee_model.hpp
      - src/c2pool/v37/xmr/xmr_pool_tag.hpp
      - src/c2pool/v37/xmr/xmr_drops_wiring.hpp
      - src/sharechain/v37/**
    exclude:
      - '**/test/**'
      - src/impl/xmr/settle/_compile_check/**
    extensions: [.hpp, .cpp, .h, .cc, .ipp, .inc]

rules:
  - id: C01
    title: carrier sharechain
    statement: 'XMR lane carriers are shares of a sharechain with a parent link and a fork choice; receipts carry the credited work.'
    source: 'ref: the:C01'
    ruling: 'ref: the:C01'
    scope: [src/c2pool/v37/xmr/, src/impl/xmr/]
    checks:
      - name: carrier-sharechain-kat
        type: required_kat
        kats: [xmr_carrier_sharechain_kat]
      - name: pathb-in-force
        type: required
        in_force: true
        pattern: '^[ \t]*#[ \t]*include[ \t]*[<"][^>"\n]*impl/xmr/pathb/'
        paths: [src/c2pool/v37/main_v37_xmr.cpp]
        code_only: false
    status_now: fail
    deviation: [D1, D39]

  - id: C02
    title: no previous-share binding; replay guard by PoW id
    statement: 'A receipt carries no previous-share binding; replay is closed by deduplication by PoW id in the window (a re-placed id is credited once) and by the tip committed under the PoW; carriage is open (C36).'
    source: 'ref: the:C02'
    ruling: 'ref: the:C02'
    scope: [src/impl/xmr/receipt/, src/c2pool/v37/xmr/relay/]
    checks:
      - name: no-prev-own-share
        type: forbidden
        pattern: '\bprev_own_share\b'
        scope: xmr_lane_code
        code_only: true
      - name: receipt-id-dedup-kat
        type: required_kat
        kats: [v37_xmr_receipt_id_kat]
    status_now: fail
    deviation: [D2]

  - id: C03
    title: open origin bin, F = 96
    statement: 'A receipt is admissible in carrier c iff its origin bin is open at the parent of c on c''s own chain: H(pos(c) - 1) < h(r) + F, F = 96 Monero heights, H(x) = the maximum template height over carriers at positions <= x; liveness judged at min(q - 1, own position), delta = 1 (own position = tip position + 1, q = the placing carrier position); no hop bound; tip freshness 0 <= h(r) - h(tip) <= 2 for every receipt, refused at admission otherwise; a receipt carried in carrier c also needs h(r) <= h(c) + fresh_max, fresh_max = 2, STRIKE otherwise; no late tail.'
    source: 'ref: the:C03'
    ruling: 'ref: the:C03'
    scope: [src/c2pool/v37/xmr/relay/, src/impl/xmr/receipt/, src/sharechain/v37/, src/c2pool/v37/w2_receipt.hpp]
    checks:
      - name: late-tail-bins
        type: constant
        pattern: '\bkLateTailBins\s*=\s*([0-9]+)'
        paths: [src/c2pool/v37/xmr/**]
        extensions: [.hpp, .cpp, .h]
        min: 0
        max: 2
        absent_ok: true
      - name: carriage-window-f
        type: constant
        pattern: '\bkOpenBins\s*=\s*([0-9]+)'
        scope: xmr_lane_code
        min: 96
        max: 96
      - name: liveness-delta
        type: constant
        pattern: '\bkLivenessDelta\s*=\s*([0-9]+)'
        scope: xmr_lane_code
        min: 1
        max: 1
      - name: fresh-max
        type: constant
        pattern: '\bkFreshMax\s*=\s*([0-9]+)'
        scope: xmr_lane_code
        min: 2
        max: 2
      - name: engine-n-ctx-bins
        type: constant
        pattern: '\bN_CTX_BINS\s*=\s*([0-9]+)'
        paths: [src/sharechain/v37/nr_ladder.hpp]
        min: 0
        max: 2
        note: 'Generic v37 engine (other lanes).'
      - name: w2-n-ctx
        type: constant
        pattern: '\bW2_N_CTX\s*=\s*([0-9]+)'
        paths: [src/c2pool/v37/w2_receipt.hpp]
        min: 0
        max: 2
        note: 'Generic v37 engine (other lanes).'
      - name: no-hop-bound
        type: forbidden
        pattern: '\b(?:R_HOPS|r_hops|kRHops|kMaxHops|max_hops)\b'
        scope: xmr_lane_code
        code_only: true
      - name: legally-dead-kat
        type: required_kat
        kats: [xmr_receipt_legally_dead_kat]
      - name: freshness-kat
        type: required_kat
        kats: [xmr_receipt_freshness_kat]
    status_now: fail
    deviation: [D3, D18]

  - id: C04
    title: no owed ledger
    statement: 'The XMR payout path holds no owed ledger, no allocate_exact_sum owed and dust passes and no drain rule; each pool block pays its window split in its own coinbase.'
    source: 'ref: the:C04'
    ruling: 'ref: the:C04'
    scope: [src/c2pool/v37/xmr/, src/impl/xmr/, src/c2pool/v37/main_v37_xmr.cpp]
    checks:
      - name: owed-ledger-symbols
        type: forbidden
        pattern: '\b(?:OwedLedger|allocate_exact_sum|drain_delta|drain_rule_refusal|drain_reward_fixpoint|kDrainRefCadence|kDrainRuleVersion|kDrainFixpointPasses)\b'
        scope: xmr_lane_code
        code_only: true
    status_now: fail
    deviation: [D4, D36]

  - id: C05
    title: no uncles
    statement: 'XMR lane consensus code has no uncles; a share that lost the ordering race is carried as a receipt and credited in full.'
    source: 'ref: the:C05'
    ruling: 'ref: the:C05'
    scope: [src/c2pool/v37/xmr/, src/impl/xmr/, src/sharechain/v37/]
    checks:
      - name: no-uncle-code
        type: forbidden
        pattern: '(?i)uncle'
        scope: xmr_lane_and_engine_code
        code_only: true
    status_now: pass
    deviation: [D5]

  - id: C06
    title: credit = work(T_origin)
    statement: 'A receipt is credited work(T_origin); T_origin equals the consensus target of its origin bin (R-1); achieved difficulty does not set the credit.'
    source: 'ref: the:C06'
    ruling: 'ref: the:C06'
    scope: [src/impl/xmr/receipt/, src/c2pool/v37/xmr/relay/, src/c2pool/v37/w2_receipt.hpp]
    checks:
      - name: credit-kats
        type: required_kat
        kats: [xmr_receipt_kat, xmr_receipt_bind_v2_kat, v37_w2_ingestion_test]
      - name: r1-stage-admission
        type: required
        pattern: 'AdmitStage::R1Target'
        paths: [src/impl/xmr/receipt/xmr_admission.hpp]
        code_only: true
        min_count: 2
      - name: r1-stage-relay
        type: required
        pattern: '\bCheckStage::R1\b'
        paths: [src/c2pool/v37/xmr/relay/xmr_receipt_mint.hpp]
        code_only: true
        min_count: 1
      - name: no-credit-from-achieved
        type: forbidden
        pattern: '\b(?:w_raw|weight|credit|work)\w*\s*\+?=\s*[^;]*\bachieved\w*'
        scope: xmr_lane_and_engine_code
        code_only: true
    status_now: pass
    deviation: []

  - id: C07
    title: exact-sum coinbase
    statement: 'Each pool block coinbase: sum of outputs = block reward + fees, to the piconero; every payee of the window split; no lottery.'
    source: 'ref: the:C07'
    ruling: 'ref: the:C07'
    scope: [src/impl/xmr/settle/, src/c2pool/v37/xmr/]
    checks:
      - name: exact-sum-kats
        type: required_kat
        kats: [xmr_coinbase_kat, xmr_e2e_kat]
      - name: pathb-exact-sum-kat
        type: required_kat
        kats: [v37_xmr_pathb_e2e_kat]
    status_now: pass
    deviation: []

  - id: C08
    title: no wall clock in consensus
    statement: 'No wall-clock read decides XMR lane consensus; consensus time is the origin bin (the mainchain height in the preimage).'
    source: 'ref: the:C08'
    ruling: 'ref: the:C08'
    scope: [src/c2pool/v37/xmr/, src/impl/xmr/, src/c2pool/v37/main_v37_xmr.cpp, src/sharechain/v37/]
    checks:
      - name: no-clock-in-consensus-core
        type: forbidden
        pattern: '\b\w+::now\s*\(|\b(?:gettimeofday|clock_gettime|localtime_r|localtime|gmtime_r|gmtime|timespec_get|now_unix|seconds_since_epoch|wall_now_s|wall_seconds)\s*\(|\bstd::time\s*\(|(?<![\w:.>])time\s*\(\s*(?:nullptr|NULL|0)?\s*\)'
        scope: xmr_consensus_core
        code_only: true
      - name: clock-reads-outside-allowlist
        type: forbidden
        pattern: '\b\w+::now\s*\(|\b(?:gettimeofday|clock_gettime|localtime_r|localtime|gmtime_r|gmtime|timespec_get|now_unix|seconds_since_epoch|wall_now_s|wall_seconds)\s*\(|\bstd::time\s*\(|(?<![\w:.>])time\s*\(\s*(?:nullptr|NULL|0)?\s*\)'
        scope: xmr_lane_code
        code_only: true
        allowlist: allowlist/C08-clock.txt
    status_now: fail
    deviation: [D1, D4]

  - id: C09
    title: register consistency
    statement: 'Every failing ruled rule maps to an open deviation; register and canon name each other.'
    source: 'ref: the:C09'
    ruling: 'ref: the:C09'
    scope: [docs/canon/]
    checks:
      - name: register-consistency
        type: register
    status_now: pass
    deviation: []

  - id: C10
    title: Canon line
    statement: 'A pull request touching the listed paths carries a "Canon: Cnn, ..." or "Canon: none (reason)" body line.'
    source: 'ref: the:C10'
    ruling: 'ref: the:C10'
    scope: [src/c2pool/v37/xmr/, src/impl/xmr/, src/sharechain/v37/, src/c2pool/v37/main_v37_xmr.cpp, docs/canon/, tools/canon/]
    checks:
      - name: pr-canon-line
        type: pr_body
        paths:
          - src/c2pool/v37/xmr/**
          - src/impl/xmr/**
          - src/sharechain/v37/**
          - src/c2pool/v37/main_v37_xmr.cpp
          - docs/canon/**
          - tools/canon/**
          - .github/workflows/canon-check.yml
    status_now: pass
    deviation: []

  - id: C11
    title: share-difficulty retarget, T = 10 s, d_min = 18180, no step bound
    statement: 'XMR lane share difficulty retargets from chain data (Monero heights) toward T = 10 s with floor d_min = 18180: for position k >= 1, d_at(k) = min(2^64 - 1, max(d_min, floor((W x T) / (120 x max(dh, m_rt))))) over the carriers lo .. k - 1, lo = max(1, k - N_rt), N_rt = 2160, W = the sum of their difficulties, dh = H(k - 1) - H(lo), m_rt = 9; an empty window gives d_min; no per-step bound.'
    source: 'ref: the:C11'
    ruling: 'ref: the:C11'
    scope: [src/c2pool/v37/xmr/, src/impl/xmr/, src/c2pool/v37/main_v37_xmr.cpp]
    checks:
      - name: retarget-kat
        type: required_kat
        kats: [xmr_share_retarget_kat]
      - name: no-fixed-share-diff-refusal
        type: forbidden
        pattern: 'needs a fixed --share-diff'
        paths: [src/c2pool/v37/main_v37_xmr.cpp]
        code_only: false
      - name: d-min
        type: constant
        pattern: '\bkDMin\s*=\s*([0-9]+)'
        scope: xmr_lane_code
        min: 18180
        max: 18180
      - name: retarget-span
        type: constant
        pattern: '\bkRetargetSpan\s*=\s*([0-9]+)'
        scope: xmr_lane_code
        min: 2160
        max: 2160
      - name: retarget-min-dh
        type: constant
        pattern: '\bkRetargetMinDh\s*=\s*([0-9]+)'
        scope: xmr_lane_code
        min: 9
        max: 9
      - name: no-retarget-step-clamp
        type: forbidden
        pattern: '\b(?:kRetargetClampNum|kRetargetClampDen|kRetargetMaxStep|kRetargetMinStep)\b'
        scope: xmr_lane_code
        code_only: true
      - name: no-old-d-min
        type: forbidden
        pattern: '\b(?:d_min|kDMin|share_diff_min|kShareDiffMin)\w*\s*=\s*20000\b'
        scope: xmr_lane_code
        code_only: true
    status_now: fail
    deviation: [D6]

  - id: C12
    title: roundabout assignment by PoW hash bits
    state: proposed
    statement: 'PROPOSED: with more than one roundabout chain, a share is assigned to a roundabout only by low bits of its PoW hash, after it is found; the template commits a tips root of every roundabout.'
    source: 'ref: the:C12'
    waits_for: 'operator ruling (ref: the:C12)'
    scope: [src/c2pool/v37/xmr/, src/impl/xmr/]
    checks:
      - name: hashbits-kat
        type: required_kat
        kats: [xmr_roundabout_hashbits_kat]
    status_now: fail
    deviation: []

  - id: C13
    title: K = 1 and the N rule
    statement: 'v1: one carrier chain, K = 1 payment group; the window holds at most N(B) = max(1, floor((Z - 2 x OVH(hf)) / (2 x OUT(hf)))) distinct payees (hf >= 17: at most FCMP_PLUS_PLUS_MAX_MINER_OUTPUTS), counting an identity whose weight after shares is > 0, Z = the Monero effective median at the window read point (C41), OVH(16) = 89, OVH(17) = 61, OUT(hf) = 34 (hf 16) or 84 (hf 17) + the varint length of the base reward; whole oldest bins leave the window while payees exceed N(B), then the last bin is cut by carrier position: its entries in the order q descending (q = the position of the carrier that placed the entry), then id ascending, kept while payees <= N(B) (the one exception to "in any order" of C25); when the newest bin alone fails W_max (C38) the same order keeps its entries while W_kept x f_spend <= B(A_t) x d_min(kept); R goes to the receipt payee alone only when the window holds no entry (C37); M(A_t) for f_spend = min(Z, the long-term effective median) (C38); every window payee gets an output in every block; coinbase weight <= Z / 2 plus the varint excess of outputs of at least 2^42 piconero; no prev_id group draw; K > 1 only by ratchet vote (C23).'
    source: 'ref: the:C13'
    ruling: 'ref: the:C13'
    scope: [src/impl/xmr/settle/, src/c2pool/v37/xmr/]
    checks:
      - name: output-gate-kat
        type: required_kat
        kats: [xmr_coinbase_output_gate_kat]
      - name: reserve-kat
        type: required_kat
        kats: [v37_xmr_coinbase_reserve_kat]
      - name: no-literal-n-param
        type: forbidden
        pattern: '\b(?:2676|3568|1248|1665|N_param|kNParam|kOutputWireCap|output_cap_ceiling)\b'
        scope: xmr_consensus_core
        code_only: true
      - name: no-literal-out-size
        type: forbidden
        pattern: '\b(?:kOutSize|out_size|kOutputBytes)\s*=\s*(?:42|90)\b'
        scope: xmr_consensus_core
        code_only: true
      - name: no-overhead-literal
        type: forbidden
        pattern: '\b(?:COINBASE_FIXED|kCoinbaseFixed)\s*=\s*128\b'
        scope: xmr_consensus_core
        code_only: true
      - name: no-reserve-quantile
        type: forbidden
        pattern: '\b(?:kReserveNum|kReserveDen|kReserveWindow|ReserveState)\b'
        scope: xmr_consensus_core
        code_only: true
    status_now: fail
    deviation: [D7]

  - id: C14
    title: no whale rule, no identity map
    statement: 'The XMR lane has no whale rule and no identity-keyed roundabout map.'
    source: 'ref: the:C14'
    ruling: 'ref: the:C14'
    scope: [src/c2pool/v37/xmr/, src/impl/xmr/, src/sharechain/v37/]
    checks:
      - name: no-whale-rule
        type: forbidden
        pattern: '(?i)whale'
        scope: xmr_lane_and_engine_code
        code_only: true
      - name: no-identity-roundabout-map
        type: forbidden
        pattern: '#\s*include\s*[<"][^>"]*roundabout/rb_(?:map|stripe)\.hpp'
        scope: xmr_lane_code
        code_only: false
    status_now: pass
    deviation: []

  - id: C15
    title: one security domain
    statement: 'The 51 % threshold is pool-wide; no per-roundabout security floor or partition.'
    source: 'ref: the:C15'
    ruling: 'ref: the:C15'
    scope: [src/c2pool/v37/xmr/, src/impl/xmr/]
    checks:
      - name: no-per-roundabout-security-gate
        type: forbidden
        pattern: '#\s*include\s*[<"][^>"]*roundabout/rb_(?:gate|admission)\.hpp|(?i:\bsecurity_floor\b)'
        scope: xmr_lane_code
        code_only: false
    status_now: pass
    deviation: []

  - id: C16
    title: split and merge gates from chain data or a ratchet vote
    statement: 'Every split and merge gate is a function of Monero chain data or a ratchet vote (C23); v1: K = 1.'
    source: 'ref: the:C16'
    ruling: 'ref: the:C16'
    scope: [src/c2pool/v37/roundabout/, src/c2pool/v37/xmr/]
    checks:
      - name: no-clock-in-gates
        type: forbidden
        pattern: '\b\w+::now\s*\(|\b(?:gettimeofday|clock_gettime|localtime_r|localtime|gmtime_r|gmtime|timespec_get|now_unix|seconds_since_epoch|wall_now_s|wall_seconds)\s*\(|\bstd::time\s*\(|(?<![\w:.>])time\s*\(\s*(?:nullptr|NULL|0)?\s*\)'
        paths: [src/c2pool/v37/roundabout/**, src/c2pool/v37/xmr/**/*split*, src/c2pool/v37/xmr/**/*merge*, src/c2pool/v37/xmr/**/*arc*, src/impl/xmr/settle/**]
        exclude: ['**/test/**']
        extensions: [.hpp, .cpp, .h]
        code_only: true
    status_now: pass
    deviation: []

  - id: C17
    title: merge window bound
    state: proposed
    statement: 'PROPOSED: a merged chain starts with window bound N1 + N2, minus one per new share down to N; merge gate without per-epoch summary decay (M >= 3 blockless epochs, median of 3 summaries or band [0.75, 2.5] H_ref).'
    source: 'ref: the:C17'
    waits_for: 'operator ruling (ref: the:C17)'
    scope: [src/c2pool/v37/xmr/]
    checks:
      - name: merge-bound-kat
        type: required_kat
        kats: [xmr_merge_window_bound_kat]
    status_now: fail
    deviation: []

  - id: C18
    title: raindrops, first upgrade epoch
    statement: 'Raindrops are not part of the genesis rules; they ship as the first upgrade epoch (C23); every entry keeps the credit fixed by the rules in force at its own position; until that epoch the raindrop wiring is off in every default build.'
    source: 'ref: the:C18'
    ruling: 'ref: the:C18'
