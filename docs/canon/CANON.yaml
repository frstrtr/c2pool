  - id: C36
    title: open carriage
    statement: 'Any carrier may carry live receipts it has seen, of any miner, while their origin bin is open (C03); the selection is canonical: pending receipts ordered by origin bin ascending, then by sha256d(id || parent id), the first R_MAX taken, so a builder cannot bias it; R_MAX = 16 is a lane rule (HELLO and pool_tag, C27), derived from the target "an attacker below 51 % gains nothing, within the confidence interval, at any window of 1.2 h or longer", 16 being the smallest value that meets it; carrying is expected, not required (a node that carries nothing harms only the orphaned miners and is visible); a receipt is credited at its origin bin whoever carries it, so the honest shares a selfish miner orphans come back at full credit and selfish share mining stops paying; receipts still commit prev_own_share against replay (C02 stays).'
    source: '~/v37-work/mrrpathb/DESIGN.md section 2.5 (proposed C36) and "Operator rulings" R2; section 7 item 6 (self-carriage is a regressive transfer, open carriage 1.000 +- 0.01 in every class); fflood/FLOOD.md section 11 (R_MAX 16); fverify/VERIFY.md finding FV-D; the public reply of 2026-10-04 (docs/canon/COMMITMENTS.md rows A8, A12, B4)'
    ruling: 'operator 2026-10-04 21:07-22:12 +04 (R2: open carriage, canonical selection, expected not required, prev_own_share kept; C02 modified, new C36); 2026-10-05 13:23 +04 (R_MAX = 16, a lane rule derived from target; supersedes R_MAX 8 of R2 and the hold of 07:55 +04)'
    scope: [src/impl/xmr/receipt/, src/impl/xmr/wire/, src/c2pool/v37/xmr/relay/, src/c2pool/v37/xmr/]
    checks:
      - name: carriage-kat
        type: required_kat
        kats: [xmr_receipt_carriage_kat]
        note: 'Slice S2 creates this KAT: a receipt of another miner is accepted, a receipt of a sealed bin is refused, a non-canonical selection is refused, R_MAX + 1 receipts are refused, and a receipt is credited at its origin bin whoever carries it.'
      - name: r-max-lane-rule
        type: constant
        pattern: '\bR_MAX_XMR\s*=\s*([0-9]+)'
        paths: [src/impl/xmr/**]
        exclude: ['**/test/**', 'src/impl/xmr/settle/_compile_check/**']
        extensions: [.hpp, .cpp, .h]
        min: 16
        max: 16
        note: 'Today the receipt codec holds R_MAX_XMR = 2 (src/impl/xmr/receipt/xmr_receipt.hpp:278), re-exported by the carrier wire and the DoS budget: a carriage-refusing attacker at a = 0.45 gets 1.137 at R_MAX 2. Evidence for 16 (FLOOD.md section 11, selfish + refusal at a = 0.45 over windows of 24 h down to 1.2 h): R_MAX 8 1.004 to 1.032, 12 1.002 to 1.009, 16 0.998 to 1.001; no other cell worse; burst +0.0026 at most and still <= 0.936; saturation 16/17 = 94 % analytic. Owed before the pool exceeds about 5.5 % of Monero (windows below 1.2 h): those windows and the saturation sweep at R_MAX 16. Ruled codec change 2 -> 16, PER_LANE_BUDGET 16 x 768 B.'
    status_now: fail
    deviation: [D19]

  - id: C37
    title: payout from pre-block state, checked for every receipt
    statement: 'Each pool block pays from state fixed before the block: the coinbase a receipt commits is split_reward(R, window(tip)) of the receipt''s own tip (the carrier it was built on), never of a lagged anchor; every node checks this for EVERY receipt (carrier, carried or raindrop) at admission, in the cheap stages before RandomX, and refuses a mismatch and bans its sender. The canonical coinbase is computed once per tip (deterministic tx key from the tip). Without the check a solo leech earns a(2 - a); tickets that can never be valid blocks (an overclaimed total, bad transactions) are block withholding, which no pool prevents, priced at (1 - a), and stated.'
    source: '~/v37-work/mrrpathb/DESIGN.md sections 2.4 and 2.7 (the window is read at the block''s own position, never at an anchor; the h-61 anchor reproduces the reviewer hopper lever, P2-anchor61 hopper 1.207, own position 1.000); fverify/VERIFY.md finding FV-6; docs/canon/COMMITMENTS.md (ruling 4; rows A3 and B3)'
    ruling: 'operator public reply of 2026-10-04 (each pool block pays its own window from state fixed before the block; the anchor 61 heights back named as drift); 2026-10-05 08:27 +04 (ruling 4: coinbase = split_reward(R, window(tip)) for every receipt, carrier, carried and raindrop, refused at admission before RandomX, and a ban)'
    scope: [src/impl/xmr/receipt/, src/impl/xmr/settle/, src/impl/xmr/native/relay/, src/c2pool/v37/xmr/]
    checks:
      - name: solo-leech-kat
        type: required_kat
        kats: [xmr_receipt_solo_leech_kat]
        note: 'Slice S2 creates this KAT: a carrier, a carried receipt and a raindrop whose coinbase is not split_reward(R, window(tip)) of its own tip are each refused at admission before RandomX and the sender banned; a receipt paying the window of another tip or of a lagged anchor is refused; the canonical coinbase is computed once per tip.'
      - name: receipt-admission-coinbase-check
        type: required
        pattern: '\bcanonical_coinbase_matches\s*\('
        paths: [src/impl/xmr/receipt/**]
        exclude: ['**/test/**']
        code_only: true
        min_count: 1
        note: 'Master fact (ruling 4): canonical_coinbase_matches (src/impl/xmr/settle/xmr_coinbase.hpp:485) gates only found-block RELAY (src/impl/xmr/native/relay/xmr_found_block_carrier.hpp:28-47: whether a non-canonical coinbase is admissible to the LANE is unwired, #1551); receipt admission (src/impl/xmr/receipt/xmr_admission.hpp:233) opens the coinbase only for T_origin and the bindings. The settlement provider pays from its ledger with the finalize cursor at T - 1 - D_conf (src/c2pool/v37/xmr/xmr_o2_settlement_provider.hpp:198-205; D_conf = 60, the h-61 anchor), which goes with the ledger (slice S4). A slice that names the per-receipt check differently changes this pattern in the same pull request.'
    open_items:
      - 'OPEN S0 item, not ruled: which Monero branch D_net(h) and R(h) come from. DESIGN.md section 2.7 says only "the Monero header at h"; during a Monero race honest nodes could compute different windows, and C37 bans on a coinbase mismatch. Candidate for S0: take them from the branch of the receipt''s own prev_id, which is deterministic; a node that lacks that branch defers and never bans (the existing "we cannot judge this right now: defer, never ban" rule, src/impl/xmr/native/relay/xmr_found_block_carrier.hpp:39-43). Source: ~/v37-work/constants/sweep/CONSTANTS-SWEEP.md item A-3 (X-3).'
      - 'OPEN S0 item, not ruled: coinbase output order. Carrot (Monero v17) requires coinbase outputs sorted by one-time output key (check_transaction_output_pubkeys_order), which conflicts with DESIGN.md section 2.7 "payee key ascending"; the canonical coinbase must follow the Monero output ordering rule of the block version. Source: ~/v37-work/constants/sweep/CONSTANTS-SWEEP.md item A-9 (X-16).'
    status_now: fail
    deviation: [D20]

  - id: C38
    title: payout window by work, no output below its spend cost
    statement: 'The payout window is measured in WORK and never holds work whose share is worth less than the cost to spend it: window(tip) = whole origin bins back from the tip until the raw work reaches min(COVERAGE x D_net, R x d / f_spend) with COVERAGE = 2 (about two expected Monero blocks of pool work), then the N rule (C13); weight = work(T_origin) with NO decay (bins keep time for LEGALLY DEAD, the fold and MMR storage, never payout weight); W_max = R x d / f_spend in work, with f_spend the Monero minimum fee to spend one input, from chain data (spend_floor: input weight x 0.95 x R x 3000 / M^2), so no payee output falls below f_spend (entries bound R / f_spend, about 47,800 at a 300 kB median; binds below about 0.05 % of Monero, about 5.5 days of window for a small pool). How the bound treats entries of a smaller d than the tip (hashrate growth) and raindrop entries (d/64) is specified per payee weight or per minimum entry in slice S0, so that no PAYEE output falls below f_spend.'
    source: '~/v37-work/mrrpathb/DESIGN.md section 2.7, "Operator rulings" R3/R4 and section 7 items 5 and 9; fverify/VERIFY.md findings FV-3 and FV-4 (fwmax: capped windows exact, every class 1.000); src/impl/xmr/settle/xmr_coinbase.cpp:171 (spend_floor); docs/canon/COMMITMENTS.md (rulings R3/R4 and 5; rows A2 and A5)'
    ruling: 'operator 2026-10-04 21:07-22:12 +04 (R3/R4: the payout window is measured in work, COVERAGE x D_net, with no decay; a ruled deviation of the design text, D22); 2026-10-05 13:23 +04 (ruling 5: W_max = R x d / f_spend in work replaces the 7-day bound; the dust statement folds into it)'
    scope: [src/impl/xmr/settle/, src/c2pool/v37/xmr/, src/sharechain/v37/]
    checks:
      - name: window-kats
        type: required_kat
        kats: [xmr_window_kat, xmr_window_spend_floor_kat]
        note: 'Slice S3 creates these KATs. xmr_window_kat: whole bins back to COVERAGE x D_net of work at the tip, no decay, the window of the own tip, the N rule after the work bound. xmr_window_spend_floor_kat: W_max = R x d / f_spend with f_spend from spend_floor, no payee output below f_spend, including entries of a smaller d than the tip and raindrop entries.'
    status_now: fail
    deviation: [D21, D22]

