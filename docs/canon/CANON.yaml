  - id: C36
    title: open carriage, R_MAX = 16
    statement: 'Any carrier may carry live receipts of any miner while their origin bin is open (C03); the carried list is in canonical order (origin bin ascending, then sha256d(id || parent id), strictly increasing), at most R_MAX = 16, a lane rule (C27); omitting a known receipt is relay policy, never a refusal; a frame carries at most 1 + R_MAX receipt bodies; credit at the origin bin whoever carries; carried_root = the untagged sha256d Merkle root over the carried ids in canonical order, an odd level promotes its last node unchanged, one id gives that id, none gives zero.'
