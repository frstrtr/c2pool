  - id: C19
    title: node-owner fee as a weight split checkable from the receipt
    statement: 'The node-owner fee is a weight split checkable from the receipt itself: of each receipt work the owner is credited floor(work x p / 10000) and the miner the rest (the give-author mechanism); the rate p (basis points) and the owner address are inside the receipt PoW preimage, set at node start (--node-owner-fee-pct, --node-owner-address), default 0, disclosed, and may differ per node; every node recomputes the split, so no node takes more than the rate its miners hashed and no miner dodges it except by discarding its work. There is NO protocol cap: the rate is visible and checkable, and the miner chooses the node.'
    source: 'SCHERNYKH-ALIGNMENT.md row 09 (2); ~/v37-work/mrrpathb/DESIGN.md section 2.11 (variant B) and "Operator rulings" R7; PATH-B.md later rulings; the public reply of 2026-10-04 (docs/canon/COMMITMENTS.md row A11)'
