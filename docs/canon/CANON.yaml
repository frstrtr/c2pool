  - id: C33
    title: dual hardened timestamp server
    statement: 'Consensus time comes from two proof-of-work chains that check each other, never from a clock: the Monero chain, whose heights are the origin bins (bin(x) = the mainchain height committed in x preimage), and the carrier sharechain, which records the order in which the pool saw Monero tips; the Monero template height is non-decreasing along the carrier chain (a carrier below its parent template height is invalid, a same-height Monero race stays valid on both sides), LEGALLY DEAD means the placing chain had recorded a newer Monero height by the receipt''s own position + 2 (C22), the share-difficulty retarget measures time as the Monero height span of its window, and wall-clock timestamps (miner-set receipt and Monero header times) serve only as sanity bounds (see C03, C08, C11, C22).'
    source: 'Work Receipts paper sections 3 and 4; the: docs/c2pool-v37-the-temporal-levels.md section 2 (the consensus clock); PATH-B.md ledger-free rules (Satoshi timestamp server anchored to Monero); ledger-free DESIGN.md section 4 (order-based vs clock-based)'
    ruling: 'temporal levels v1.0 ratified 2026-06-12 (T-OQ1, bin = mainchain height); operator 2026-10-04 11:22 +04 (Path B, correction 15:00 +04) and 18:15 +04 (explicit canon rule); 2026-10-04 21:07-22:12 +04 (R1: liveness at own position + 2)'
