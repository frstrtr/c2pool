\* TLC config for SettlementCanon.tla -- exhaustive on a small finite model.
\* Mutation = "none" is the rule as master implements it; check-settlement-canon.sh
\* reruns this file with each negative control and each reachability witness.
SPECIFICATION Spec

CONSTANTS
    Miners = {m1, m2}
    Reward = 2
    SeedMax = 1
    Cap = 1
    OwedCap = 1
    FINALITY_DEPTH = 1
    MaxChainLen = 3
    Mutation = "none"

INVARIANT TypeOK
INVARIANT Conservation
INVARIANT NonCanonicalEarnsNothing
INVARIANT UnpaidKeyNeverNegative
INVARIANT HonestIsCanonical
INVARIANT UndecidableHeld

PROPERTY NoAdvance
PROPERTY CanonicalNeverNegative

CHECK_DEADLOCK FALSE
