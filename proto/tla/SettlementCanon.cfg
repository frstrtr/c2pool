\* TLC config for SettlementCanon.tla -- exhaustive on a small finite model.
\* Mutation = "none" is the rule master implements, with the redistribution ruling of
\* 2026-10-02; check-settlement-canon.sh reruns this file with each negative control and
\* each reachability witness.
SPECIFICATION Spec

CONSTANTS
    Miners = {m1, m2}
    Reward = 2
    SeedMax = 1
    Cap = 1
    OwedCap = 1
    FINALITY_DEPTH = 1
    MaxChainLen = 3
    Mutation = "none"

INVARIANT TypeOK
INVARIANT Conservation
INVARIANT NonCanonicalEarnsNothing
INVARIANT UnpaidKeyNeverNegative
INVARIANT RedistributionNeutral
INVARIANT LedgerWithinFloat
INVARIANT NoClaimWithoutCash
INVARIANT HonestIsCanonical
INVARIANT UndecidableHeld

PROPERTY NoAdvance
PROPERTY CanonicalNeverNegative

CHECK_DEADLOCK FALSE
