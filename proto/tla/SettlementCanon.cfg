\* TLC config for SettlementCanon.tla -- exhaustive on a small finite model.
\* Mutation = "none" is the drain rule of the operator rulings of 2026-10-02 (pay-now
\* first, Delta per Monero height, slots follow cash, no DEBT FIRST) on top of the
\* recompute and the redistribution ruling; check-settlement-canon.sh reruns this file
\* with each negative control and each reachability witness.
\* Reward = 4, DrainQ = 4, HCap = 2: Delta = min(F, dh) for dh in 1..2 (R/4 per height
\* counted, at most R/2 per block; the lane: R/256, at most R/4). One slot: the owed pass
\* and the window contest it (K_o = 1 = Cap, so nobody admitted is reachable here).
SPECIFICATION Spec

CONSTANTS
    Miners = {m1, m2}
    Reward = 4
    SeedMax = 2
    Cap = 1
    OwedCap = 1
    FINALITY_DEPTH = 1
    MaxChainLen = 2
    DrainQ = 4
    HCap = 2
    Mutation = "none"

INVARIANT TypeOK
INVARIANT Conservation
INVARIANT NonCanonicalEarnsNothing
INVARIANT UnpaidKeyNeverNegative
INVARIANT WindowPaidKeyNeverNegative
INVARIANT RedistributionNeutral
INVARIANT LedgerWithinFloat
INVARIANT NoClaimWithoutCash
INVARIANT HonestIsCanonical
INVARIANT UndecidableHeld
INVARIANT NoNewOwed
INVARIANT PayNowWithinWindow

PROPERTY NoAdvance
PROPERTY CanonicalNeverNegative
PROPERTY FloatNonIncreasing
PROPERTY DrainBound
PROPERTY SlotShare
PROPERTY SomeoneAdmitted
PROPERTY MasterWhenNoFloat

CHECK_DEADLOCK FALSE
