\* TLC config for SettlementCanon.tla -- MASTER: the allocation before the drain rule
\* (DrainQ = 0; the lane rules drain_q = drain_h_cap = drain_rule_version = 0). The owed
\* pass draws on the whole block with no K_o, the window is credited at the whole Reward
\* and DEBT FIRST pays the admitted payees' balances out of the cash the split leaves.
\* Two payee slots, one owed key per block and a 3-unit block: a payee whose balance the
\* owed pass left unpaid takes the free slot, and the cash the pay-now split leaves pays
\* that balance before anything is redistributed (wit-debt-first). The invariants are the
\* ones master satisfies; NoNewOwed is not among them (wit-master-new-owed: master's short
\* pool leaves a window payee a new balance).
SPECIFICATION Spec

CONSTANTS
    Miners = {m1, m2}
    Reward = 3
    SeedMax = 1
    Cap = 2
    OwedCap = 1
    FINALITY_DEPTH = 1
    MaxChainLen = 2
    DrainQ = 0
    HCap = 1
    Mutation = "none"

INVARIANT TypeOK
INVARIANT Conservation
INVARIANT NonCanonicalEarnsNothing
INVARIANT UnpaidKeyNeverNegative
INVARIANT RedistributionNeutral
INVARIANT LedgerWithinFloat
INVARIANT NoClaimWithoutCash
INVARIANT HonestIsCanonical
INVARIANT UndecidableHeld
INVARIANT PayNowWithinWindow

PROPERTY NoAdvance
PROPERTY CanonicalNeverNegative

CHECK_DEADLOCK FALSE
