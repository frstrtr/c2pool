\* TLC config for SettlementCanon.tla -- the degenerate case: no slot for any payee.
\* Nobody is admitted and there is no owed output, so the moved cash has nowhere to go:
\* the waiting payees' credit comes off and the cash stays in the residual. With no slot
\* the owed pass takes nothing either, so no balance is drained (Delta is unused).
SPECIFICATION Spec

CONSTANTS
    Miners = {m1, m2}
    Reward = 2
    SeedMax = 1
    Cap = 0
    OwedCap = 1
    FINALITY_DEPTH = 1
    MaxChainLen = 2
    DrainQ = 4
    HCap = 2
    Mutation = "none"

INVARIANT TypeOK
INVARIANT Conservation
INVARIANT NonCanonicalEarnsNothing
INVARIANT UnpaidKeyNeverNegative
INVARIANT WindowPaidKeyNeverNegative
INVARIANT RedistributionNeutral
INVARIANT LedgerWithinFloat
INVARIANT NoClaimWithoutCash
INVARIANT HonestIsCanonical
INVARIANT UndecidableHeld
INVARIANT NoNewOwed
INVARIANT PayNowWithinWindow

PROPERTY NoAdvance
PROPERTY CanonicalNeverNegative
PROPERTY FloatNonIncreasing
PROPERTY DrainBound
PROPERTY SlotShare
PROPERTY SomeoneAdmitted
PROPERTY MasterWhenNoFloat

CHECK_DEADLOCK FALSE
