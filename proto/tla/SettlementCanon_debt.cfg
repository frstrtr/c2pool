\* TLC config for SettlementCanon.tla -- the debt-first branch of the allocation.
\* Two payee slots, one owed key per block and a 3-unit block: a payee whose balance the
\* owed pass left unpaid takes the free slot, and the cash the pay-now split leaves pays
\* that balance before anything is redistributed. (SettlementCanon.cfg has one slot: it
\* reaches the waiting payee and the redistribution, but never this branch.)
SPECIFICATION Spec

CONSTANTS
    Miners = {m1, m2}
    Reward = 3
    SeedMax = 1
    Cap = 2
    OwedCap = 1
    FINALITY_DEPTH = 1
    MaxChainLen = 2
    Mutation = "none"

INVARIANT TypeOK
INVARIANT Conservation
INVARIANT NonCanonicalEarnsNothing
INVARIANT UnpaidKeyNeverNegative
INVARIANT HonestIsCanonical
INVARIANT UndecidableHeld

PROPERTY NoAdvance
PROPERTY CanonicalNeverNegative

CHECK_DEADLOCK FALSE
