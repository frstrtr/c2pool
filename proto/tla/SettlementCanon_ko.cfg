\* TLC config for SettlementCanon.tla -- the contested-slot branch (K_o; R1, B5).
\* Three keys, two slots, two owed keys: with Delta = min(F, dh) <= 2 = R/2 the first owed
\* pass can fill both slots; K_o = max(1, 2 * owed_paid_1 div 4) = 1 leaves one slot to
\* the window, so a key with E_b > 0 is always admitted. Mutation "no_ko" makes "nobody
\* admitted" reachable (SomeoneAdmitted) and breaks the slot share (SlotShare); raising
\* HCap to DrainQ (Delta up to R, mut-hcap-full) makes it reachable with K_o in force.
SPECIFICATION Spec

CONSTANTS
    Miners = {m1, m2, m3}
    Reward = 4
    SeedMax = 1
    Cap = 2
    OwedCap = 2
    FINALITY_DEPTH = 1
    MaxChainLen = 1
    DrainQ = 4
    HCap = 2
    Mutation = "none"

INVARIANT TypeOK
INVARIANT Conservation
INVARIANT NonCanonicalEarnsNothing
INVARIANT UnpaidKeyNeverNegative
INVARIANT RedistributionNeutral
INVARIANT LedgerWithinFloat
INVARIANT NoClaimWithoutCash
INVARIANT HonestIsCanonical
INVARIANT UndecidableHeld
INVARIANT NoNewOwed
INVARIANT PayNowWithinWindow

PROPERTY NoAdvance
PROPERTY CanonicalNeverNegative
PROPERTY FloatNonIncreasing
PROPERTY DrainBound
PROPERTY SlotShare
PROPERTY SomeoneAdmitted
PROPERTY MasterWhenNoFloat

CHECK_DEADLOCK FALSE
