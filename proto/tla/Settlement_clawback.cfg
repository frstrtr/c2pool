\* NEGATIVE CONTROL (Settlement.tla revision 2): a clawback action (a settled payout
\* shrinks for a negative key) is switched ON. Expected: NoClawback VIOLATED.
SPECIFICATION Spec

CONSTANTS
    Miners = {m1, m2}
    MaxReward = 1
    MaxDelta = 2
    FINALITY_DEPTH = 1
    MaxChainLen = 3
    MaxIds = 4
    MaxDeepOrphans = 1
    C4Bound = TRUE
    DeltaMassRule = TRUE
    AllowClawback = TRUE

CONSTRAINT StateConstraint

INVARIANT TypeOK
PROPERTY NoClawback
