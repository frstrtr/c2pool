\* TLC config for SettlementCanon.tla -- the drain rule over three lane blocks.
\* With FINALITY_DEPTH = 1 the third block is booked on a FINALIZED first block and a
\* pending second one (SettlementCanon.cfg, two blocks, never finalizes before a
\* booking). Reward 3, DrainQ 3, HCap 2: Delta = min(F, dh) for dh in 1..2 (R/3 per
\* height counted, at most 2R/3 < R). One slot, as in SettlementCanon.cfg.
SPECIFICATION Spec

CONSTANTS
    Miners = {m1, m2}
    Reward = 3
    SeedMax = 1
    Cap = 1
    OwedCap = 1
    FINALITY_DEPTH = 1
    MaxChainLen = 3
    DrainQ = 3
    HCap = 2
    Mutation = "none"

INVARIANT TypeOK
INVARIANT Conservation
INVARIANT NonCanonicalEarnsNothing
INVARIANT UnpaidKeyNeverNegative
INVARIANT RedistributionNeutral
INVARIANT LedgerWithinFloat
INVARIANT NoClaimWithoutCash
INVARIANT HonestIsCanonical
INVARIANT UndecidableHeld
INVARIANT NoNewOwed
INVARIANT PayNowWithinWindow

PROPERTY NoAdvance
PROPERTY CanonicalNeverNegative
PROPERTY FloatNonIncreasing
PROPERTY DrainBound
PROPERTY SlotShare
PROPERTY SomeoneAdmitted
PROPERTY MasterWhenNoFloat

CHECK_DEADLOCK FALSE
