name: heavy-leg-lock
description: >-
  Acquire a per-host slotted flock semaphore (reap-guard) governing a RAM- or
  disk-heavy CI leg. Holds a disowned slot that auto-frees when the runner-worker
  dies at job end; stale holders from dead jobs are reaped at acquire. Every
  heavy-leg lock in build.yml and codeql-analysis.yml goes through this action;
  callers that must lock before their full checkout sparse-check-out
  .github/actions/heavy-leg-lock first.
inputs:
  lock-file:
    description: Base path of the per-slot lock files.
    default: /tmp/c2pool-heavy-leg.lock
  holder-file:
    description: Base path of the per-slot holder markers.
    default: /tmp/c2pool-heavy-leg.holder
  slots:
    description: >-
      Number of concurrent slots on the host. A runner host may override it for
      one lock with a positive integer (1-8) in
      $HOME/.config/c2pool-ci/<basename of lock-file>.slots; with no such file
      (the default everywhere) this input is used unchanged, and an invalid
      value falls back to it with a warning.
    default: "2"
  mem-gb-per-slot:
    description: >-
      Host-RAM clamp: cap slots at (host MemTotal GB / this value), minimum 1,
      applied after any host override. "0" (the default) disables it. The RAM
      lock uses "20" (one ASan/CodeQL leg's budget).
    default: "0"
  wait:
    description: Max seconds to wait for a free slot before failing.
    default: "5400"
  ttl:
    description: Holder ceiling in seconds (worker-death frees earlier).
    default: "14400"
  holder-env:
    description: Name of the env var to export the holder pid into (for release).
    default: HEAVY_LEG_LOCK_HOLDER
runs:
  using: composite
  steps:
    - shell: bash
      env:
        HEAVY_LEG_LOCK: ${{ inputs.lock-file }}
        HEAVY_LEG_HOLDERFILE: ${{ inputs.holder-file }}
        HEAVY_LEG_SLOTS: ${{ inputs.slots }}
        HEAVY_LEG_MEM_GB_PER_SLOT: ${{ inputs.mem-gb-per-slot }}
        HEAVY_LEG_WAIT: ${{ inputs.wait }}
        HEAVY_LEG_TTL: ${{ inputs.ttl }}
        HEAVY_LEG_HOLDER_ENV: ${{ inputs.holder-env }}
      run: bash "$GITHUB_ACTION_PATH/acquire.sh"
