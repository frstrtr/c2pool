name: attribution-gate

# Standing rule: ZERO AI or tool attribution anywhere. This required check
# fails a pull request when a commit message in its range, its title or body,
# its branch name, or any line it adds to a tracked file matches a marker in
# ci/attribution-patterns.txt (scripts/ci/attribution_gate.sh). The same check
# runs locally from scripts/ci/hooks/commit-msg and scripts/ci/hooks/pre-push.
# Server-side backstop so no clone or worktree can reintroduce it.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

env:
  # Fail-fast on a stalled git HTTP transfer instead of hanging to the job
  # timeout. Our WAN uplink stalls ~12% of codeload fetches (they neither
  # finish nor error out); aborting a sub-1000 B/s transfer after 20s lets
  # actions/checkout built-in 3-attempt fetch retry recover in ~1 min.
  GIT_HTTP_LOW_SPEED_LIMIT: '1000'
  GIT_HTTP_LOW_SPEED_TIME: '20'

jobs:
  attribution-gate:
    name: attribution-gate
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","c2pool-build"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout PR commit range (bounded fetch)
        uses: actions/checkout@v4
        with:
          # Attribution scan only reads BASE_SHA..HEAD_SHA and the diff of the
          # PR merge commit against its first parent (the base). A whole-repo
          # unshallow (fetch-depth: 0) is the single most fragile checkout we
          # run and reds clean PRs when a runner link drops packets. Bound the
          # fetch to the PR own commits. GitHub Actions expressions have NO
          # arithmetic operators (commits + 1 is a compile-time startup
          # failure), so we deepen by one commit below to reach the merge base;
          # the scan step keeps its git log -50 HEAD fallback if unreachable.
          fetch-depth: ${{ github.event.pull_request.commits || 50 }}

      - name: Deepen one commit to reach the PR merge base
        run: git fetch --deepen=1 || true

      - name: Scan commits, PR metadata and added lines for AI attribution
        env:
          PR_BODY:  ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Commit messages: the PR range, or the last 50 commits of the head
          # when the base is not reachable in the bounded fetch.
          if git rev-list --count "${BASE_SHA}..${HEAD_SHA}" >/dev/null 2>&1; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="-50 ${HEAD_SHA}"
          fi
          # Added lines: the checked-out PR merge commit against its first
          # parent, the base it merges into.
          merge=$(git rev-parse HEAD)
          if ! git cat-file -e "${merge}^1" 2>/dev/null; then
            git fetch --deepen=1 || true
          fi
          diff=""
          if git cat-file -e "${merge}^1" 2>/dev/null; then
            diff="${merge}^1 ${merge}"
          else
            echo "::error::attribution gate: the base of the PR merge commit is not in the checkout"
            exit 2
          fi
          GATE_RANGE="$range" GATE_DIFF="$diff" BRANCH="$HEAD_REF" \
            bash scripts/ci/attribution_gate.sh

      # Steady-state disk hygiene on the VM905 self-hosted runners: drop the
      # checkout payload and _temp, keep _actions/_tool/_update. Always runs.
      - name: Prune runner workspace
        if: always()
        uses: ./.github/actions/prune-runner-workspace
