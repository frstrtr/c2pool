  # ════════════════════════════════════════════════════════════════════════════
  # Web-static JS verify (typecheck + build + tests + bundle-size gate)
  # Covers web-static/sharechain-explorer/: the Explorer + PPLNS View
  # bundles + Plugin SDK. Fast job (< 1 min); runs regardless of path so
  # it also catches changes that land via package.json or test fixtures.
  # ════════════════════════════════════════════════════════════════════════════
  web-static:
    name: Web-static verify
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || github.event_name != 'pull_request' }}
    # Route to self-hosted for trusted events; fork PRs fall back to
    # GitHub-hosted ubuntu-24.04 (never run untrusted fork code self-hosted).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","c2pool-build"]') || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: web-static/sharechain-explorer
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          # Node 22 — node --test supports glob expansion natively
          # (Node 20 requires the shell to pre-expand the quoted glob,
          # which fails on CI's bash + JSON-quoted package.json script).
          node-version: '22'
          cache: npm
          cache-dependency-path: web-static/sharechain-explorer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + build + test + manifest + size)
        run: npm run verify

      - name: Install Chrome for pixel-regression harness
        # Fast-fail cap: the warm-cache path is seconds and a cold fetch of
        # the ~135MB Chrome-for-Testing zip is minutes even on VM905's
        # throttled egress. Bound the step so a stalled CDN download surfaces
        # a retryable red in minutes instead of wedging the runner >40min with
        # no output (run 33317959171). This caps ONLY the browser provision;
        # the "Visual pixel-diff harness" step below stays uncapped and fully
        # gating (no continue-on-error anywhere near the diff).
        timeout-minutes: 15
        run: |
          # GitHub-hosted: apt google-chrome/chromium is a real .deb and launches.
          # Self-hosted VM905 only offers snap chromium, which refuses to launch
          # under the runner systemd cgroup ("not a snap cgroup for tag
          # snap.chromium.chromium"). Provision a real Chrome-for-Testing build
          # via @puppeteer/browsers (a puppeteer-core dep, present after npm ci);
          # it unpacks under ~/.cache/puppeteer with no snap confinement. The
          # harness already launches with --no-sandbox (tests/visual/capture.mjs).
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            flock /tmp/c2pool-apt.lock bash -e -c '
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends google-chrome-stable || \
              sudo apt-get install -y --no-install-recommends chromium-browser
            '
            for bin in /usr/bin/google-chrome-stable /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
              if [ -x "$bin" ]; then echo "CHROME_BIN=$bin" >> "$GITHUB_ENV"; break; fi
            done
          else
            # Self-hosted: REUSE a Chrome-for-Testing already unpacked under
            # ~/.cache/puppeteer if present (VM905 persists it across jobs) so
            # the warm path touches NO network. Only on a cold cache do we
            # fetch from Google's CDN, and then with bounded retries — a
            # single-attempt download false-reds the whole gate on a transient
            # outbound blip (ENETUNREACH/ETIMEDOUT, run 29675949544), failing
            # PRs that never touch web/.
            # Pin the Chrome-for-Testing build to the EXACT revision that the
            # installed puppeteer-core is tested against (read from its own
            # revisions.js), NOT chrome@stable. chrome@stable floats to the
            # newest major and can outrun the puppeteer-core CDP client ->
            # TargetCloseError "Protocol error (Page.navigate): Target closed"
            # (Chrome 151 vs puppeteer-core 23.x, run 31565849067). Keying both
            # the warm-cache reuse and the cold fetch to $PIN makes the browser
            # and client move together whenever the puppeteer-core lock is
            # bumped, so this skew class cannot silently recur.
            PIN="$(sed -nE "s/.*chrome: *.([0-9.]+).*/\\1/p" node_modules/puppeteer-core/lib/puppeteer/revisions.js | head -1)"
            test -n "$PIN" || { echo "could not read pinned Chrome revision from puppeteer-core"; exit 1; }
            echo "puppeteer-core pins Chrome-for-Testing $PIN"
            # PRIMARY extraction fix is the yauzl devDependency of
            # sharechain-explorer (installed by npm ci above): @puppeteer/browsers
            # discovers it via require() and unpacks the Chrome zip IN-PROCESS,
            # so extraction NEVER depends on a system unzip binary. Before yauzl,
            # a runner without unzip (VM905 has none) hit "no zip archiver is
            # available", and the retry loop then re-downloaded 135MB per attempt
            # → a >40min wedge (run 33317959171). The two lines below are a
            # belt-and-suspenders ONLY: keep /usr/bin on PATH so a present unzip
            # is found, and best-effort provision one — both fully guarded so a
            # missing/locked apt can never fail the job. yauzl remains the fix.
            case ":$PATH:" in *:/usr/bin:*) ;; *) export PATH="/usr/bin:$PATH" ;; esac
            command -v unzip >/dev/null 2>&1 || flock /tmp/c2pool-apt.lock \
              sudo -n apt-get install -y --no-install-recommends unzip >/dev/null 2>&1 || true
            CHROME_BIN="$(ls -1 "$HOME"/.cache/puppeteer/chrome/*"$PIN"/chrome-linux64/chrome ./chrome/*"$PIN"/chrome-linux64/chrome 2>/dev/null | tail -1 || true)"
            if [ ! -x "$CHROME_BIN" ]; then
              # Cold cache: serialize the fetch across the runners that share
              # this $HOME (VM905 hosts actions-runner-2..8 on one home dir), so
              # concurrent web-static jobs don't race the same 135MB download
              # into the same versioned dir. Hold the lock on its own fd for the
              # whole cold path; mirror the existing /tmp/c2pool-apt.lock idiom.
              CACHE_DIR="$HOME/.cache/puppeteer"
              exec 9>/tmp/c2pool-puppeteer.lock
              flock 9
              # Re-check the warm cache now that we hold the lock — a concurrent
              # job may have finished the download while we waited on flock.
              CHROME_BIN="$(ls -1 "$CACHE_DIR"/chrome/*"$PIN"/chrome-linux64/chrome 2>/dev/null | tail -1 || true)"
              if [ ! -x "$CHROME_BIN" ]; then
                # Partial-cache guard: an interrupted prior download can leave
                # the versioned dir present with NO chrome-linux64/chrome binary.
                # @puppeteer/browsers treats "dir exists" as installed and refuses
                # to re-fetch, so every retry short-circuits to the same broken
                # path and the gate false-reds (linux-151.0.7922.77 on
                # actions-runner-8, run 31607961557). Purge BOTH the persistent
                # cache root and any legacy CWD ./chrome/*"$PIN" (older runs
                # installed with no --path, e.g. run 31685136400) for this PIN
                # before AND between fetch attempts so the download re-runs
                # regardless of which layout holds the stale dir.
                purge_partial() {
                  for d in "$CACHE_DIR"/chrome/*"$PIN" ./chrome/*"$PIN"; do
                    [ -d "$d" ] && [ ! -x "$d/chrome-linux64/chrome" ] && rm -rf "$d"
                  done
                  return 0
                }
                purge_partial
                for attempt in 1 2 3; do
                  # --path pins the download into the PERSISTENT per-host cache
                  # (survives the "Prune runner workspace" step, which only drops
                  # the CWD checkout) so a warm run touches NO network and every
                  # runner sharing this $HOME reuses one fill. Extraction is
                  # in-process via the yauzl devDependency — no system unzip.
                  CHROME_BIN="$(npx --yes @puppeteer/browsers install "chrome@$PIN" --path "$CACHE_DIR" | tail -1 | awk '{print $NF}')" \
                    && [ -x "$CHROME_BIN" ] && break
                  echo "chrome-for-testing fetch attempt $attempt failed; retrying in $((attempt*10))s"
                  purge_partial
                  sleep $((attempt*10))
                done
              fi
              flock -u 9
            fi
            test -x "$CHROME_BIN" || { echo "puppeteer chrome install failed after retries"; exit 1; }
            echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          fi

      - name: Visual pixel-diff harness
        run: npm run visual

      - name: Upload visual diff artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff-out
          path: web-static/sharechain-explorer/tests/visual/out/
          retention-days: 7

      # Steady-state disk hygiene on the VM905 self-hosted runners: drop the
      # checkout payload and _temp, keep _actions/_tool/_update. Always runs.
      - name: Prune runner workspace
        if: always()
        uses: ./.github/actions/prune-runner-workspace

  # ════════════════════════════════════════════════════════════════════════════
  # c2pool-qt leak-regression harness (Qt hybrid step 14, delta v1 §E.2)
  # Builds ui/c2pool-qt/ with C2POOL_QT_BUILD_TESTS=ON and runs the
  # mount/destroy × 100 harness under xvfb.
  #
  # PARTIAL COVERAGE. Configure + build are gating: API breakage in
  # PageEmbedded::destroyView or its Qt dependencies will fail compile
  # and block merge. That alone catches the most common class of
  # regression (a refactor renaming/removing a destroyView hook).
  #
  # The runtime mount/destroy × 100 step is `continue-on-error: true`
  # because QtWebEngine 6.4.2 (Ubuntu 24.04 apt package) segfaults
  # inside Chromium's child-process init on GitHub's GPU-less runners
  # regardless of software-GL / headless / sandbox flags — tried
  # LIBGL_ALWAYS_SOFTWARE, QT_OPENGL=software, --use-gl=swiftshader,
  # --disable-gpu, --headless=new, xvfb-run with GLX,
  # QTWEBENGINE_DISABLE_SANDBOX. All produce the same 2-second-after-
  # banner SIGSEGV. The lifecycle logic is code-verified against
  # PageEmbedded::destroyView + Qt parent/child semantics; the harness
  # is expected to pass on any non-Wayland dev box or a self-hosted CI
  # runner with working QtWebEngine headless support.
  #
  # To flip the runtime step back to gating, remove `continue-on-error: true`
  # once one of:
  #   - Ubuntu PPA ships QtWebEngine ≥ 6.6 with better headless
  #   - Self-hosted runner with a working Qt6 WebEngine is available
  #   - Alternative harness drops QWebEngineView mount (mocks the
  #     Chromium init) while still exercising destroyView lifecycle
  # ════════════════════════════════════════════════════════════════════════════
  qt-webengine:
    name: Qt WebEngine leak gate
    needs: changes
    if: ${{ needs.changes.outputs.qt == 'true' || github.event_name != 'pull_request' }}
    # Pinned to draft-release (persistent 145/198/905 pool: NOPASSWD sudo +
    # Qt6/xvfb). Excludes transient c2pool-heavy hosts (oplex7020) that lack
    # Qt6 and NOPASSWD sudo. #1122 routing fix.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","draft-release"]') || 'ubuntu-24.04' }}
    # Hard ceiling: orphaned QtWebEngine/Chromium helper children survive
    # the inner `timeout 180`, holding the xvfb pipe open and hanging the
    # job to the 360-min runner default. Cap it so a hung leak gate is
    # force-killed (with its whole process tree) in minutes, not hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6 + WebEngine + xvfb
        run: |
          flock /tmp/c2pool-apt.lock bash -e -c '
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              cmake g++ ccache \
              qt6-base-dev qt6-webengine-dev qt6-webchannel-dev \
              qt6-tools-dev \
              libgl1-mesa-dev libegl1-mesa-dev \
              libxkbcommon-dev libnss3 libxcomposite1 libxdamage1 \
              libxrandr2 libxtst6 libatk1.0-0 libatk-bridge2.0-0 \
              libasound2t64 libdrm2 libgbm1 \
              xvfb
          '

      - name: Configure
        run: cmake -S ui/c2pool-qt -B build-qt -DC2POOL_QT_BUILD_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build leak harness
        run: cmake --build build-qt --target c2pool-qt_test_embedded_leak -j8

      # ── Reward-safety + address-registry gates (Qt-free / Qt-Core; no display) ─
      # These prove the per-coin argv is reward-safe (no silent embedded arm, no
      # forced --give-author 0, only catalog-valid flags per binary) and that the
      # payout-address check matches the node registry. They were ctest-registered
      # but never built/run in CI before — build + run them here.
      - name: Build + run reward-safe launch and address-validator gates
        run: |
          cmake --build build-qt \
            --target c2pool-qt_test_reward_safe_launch c2pool-qt_test_address_validator -j8
          ./build-qt/c2pool-qt_test_reward_safe_launch
          ./build-qt/c2pool-qt_test_address_validator

      - name: Run leak harness under xvfb
        continue-on-error: true
        env:
          QTWEBENGINE_DISABLE_SANDBOX: '1'
          # Force software GL throughout — the GitHub Ubuntu runner
          # has no GPU, so QtWebEngine's default `use-gl desktop` fails
          # as soon as Chromium tries to get an OpenGL context. Mesa
          # swrast serves as a CPU fallback.
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_OPENGL: software
          QT_QUICK_BACKEND: software
          # --disable-software-rasterizer contradicted --use-gl=swiftshader
          # in the previous attempt (banner showed "GL Type: disabled" then
          # Chromium helper still died). Drop it; let swiftshader handle
          # raster. Add --headless for the Chromium-side headless mode.
          QTWEBENGINE_CHROMIUM_FLAGS: >-
            --no-sandbox
            --disable-gpu
            --disable-dev-shm-usage
            --use-gl=swiftshader
            --headless=new
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24 +extension GLX +render -noreset" \
            timeout 180 ./build-qt/c2pool-qt_test_embedded_leak

      # Steady-state disk hygiene on the VM905 self-hosted runners: drop the
      # checkout payload and _temp, keep _actions/_tool/_update. Always runs.
      - name: Prune runner workspace
        if: always()
        uses: ./.github/actions/prune-runner-workspace

  # ════════════════════════════════════════════════════════════════════════════
  # BTC embedded smoke — RETIRED 2026-06-17 (ci-steward/retire-btc-linux).
  # Superseded by the coin-matrix.yml `btc` cell ("btc smoke (Linux x86_64)",
  # a required check on master). The old btc-linux job was gated solely to
  # btc-embedded branch involvement and never fired on master, so removing it
  # changes no live coverage.
  #
  # Deferred btc test wiring (owned by the btc-heap-opt arc):
  #   - src/impl/btc/test/share_test.cpp — NOW WIRED as the btc_share_test target
  #     (F11 value-invariance KAT); uniquely named to avoid CMP0002 vs ltc share_test.
  #   - src/impl/btc/test/template_parity_test.cpp — standalone consensus
  #     oracle harness; needs proper CMake target wiring (nlohmann_json,
  #     leveldb_store, core/log) to be CI-reliable.
  # ════════════════════════════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════════════════════════════
  # macOS (matrix). Both arches self-hosted on push/internal-branch PRs, with
  # GitHub-hosted fork fallback: arm64 -> Mac-mini-Alonso-227 (c2pool-mac-arm)
  # else macos-14; x86_64 -> macpro-intel-204 (c2pool-mac-intel). Resolves the
  # macOS x86_64 CI starvation (#42). sccache caches across self-hosted runs.
  # ════════════════════════════════════════════════════════════════════════════
  # A paused leg is SKIPPED, never silently green — see mac-x86_64-coverage.
  # Makes PR platform coverage VISIBLE. Dropping legs for speed is fine; a green
  # rollup that silently means less than it did yesterday is not. This job always
  # runs, costs nothing, and states exactly which platforms this run covered.
  ci-platform-coverage:
    name: PR platform coverage status
    runs-on: ubuntu-24.04
    steps:
      - name: Report platform coverage
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ vars.PR_LINUX_ONLY }}" = "true" ]; then
            echo "::warning title=PR is LINUX-ONLY::macOS and Windows are NOT built on this PR (PR_LINUX_ONLY=true). The full architecture sweep runs at RELEASE time only. A green rollup here does NOT mean macOS/Windows compile."
            {
              echo "### PR platform coverage"
              echo "- Linux x86_64 (incl. AsAN/UBSan, per-coin gates): **covered**"
              echo "- macOS arm64 / x86_64: **NOT covered on PRs** — deferred to release.yml"
              echo "- Windows x86_64: **NOT covered on PRs** — deferred to release.yml"
              echo ""
              echo "Restore full PR coverage: \`gh variable delete PR_LINUX_ONLY --repo frstrtr/c2pool\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "${{ vars.MAC_INTEL_PAUSED }}" = "true" ]; then
              echo "::warning title=macOS x86_64 NOT COVERED::The macOS x86_64 leg is PAUSED (MAC_INTEL_PAUSED=true). This run does NOT test x86_64."
              echo "- macOS x86_64: **PAUSED — NOT covered**" >> "$GITHUB_STEP_SUMMARY"
            elif [ "${{ vars.MAC_INTEL_OFFLINE }}" = "true" ]; then
              echo "::warning title=macOS x86_64 cross-built::x86_64 was CROSS-BUILT on the ARM M4. Any tests ran under Rosetta 2 — weaker evidence than native Intel silicon."
              echo "- macOS x86_64: cross-built on ARM M4 (Rosetta)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- macOS x86_64: covered natively" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "- Linux + Windows: covered" >> "$GITHUB_STEP_SUMMARY"
          fi
  macos:
    name: macOS ${{ matrix.arch }}
    # dash-slice campaign: skip macOS for PRs carrying the dash-linux-only label (re-enabled at block-viable gate, ~07-01)
    # PR_LINUX_ONLY=true drops macOS from PR CI entirely (speed). The FULL
    # architecture sweep — macOS arm64 + x86_64 + universal, and Windows — still
    # runs in release.yml at tag time, so this DEFERS detection rather than
    # losing it. See the ci-platform-coverage job for the visible statement.
    if: ${{ !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'dash-linux-only')) && !(github.event_name == 'pull_request' && vars.PR_LINUX_ONLY == 'true') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","c2pool-mac-arm"]') || 'macos-14' }}
          # macpro-intel-204 taken offline by operator 2026-07-28 (AFK several hours).
          # While away, cross-build the x86_64 slice on our own Apple-Silicon M4
          # (Mac-mini-Alonso-227 / c2pool-mac-arm) via CMAKE_OSX_ARCHITECTURES, the
          # same way release.yml lipo-ships the universal package. Keeps the work on
          # our build factory, spends no hosted-runner minutes, keeps sccache warm.
          # Default (no var) = self-hosted macpro-intel-204, the normal steady state.
          # COVERAGE NOTE: while offline this leg is BUILD-ONLY unless Rosetta 2 is
          # present on the ARM runner (x86_64 binaries execute only under Rosetta) --
          # a green here is weaker evidence than a native-Intel green. See Verify.
          #   ENABLE  offline mode : gh variable set    MAC_INTEL_OFFLINE --body true --repo frstrtr/c2pool
          #   DISABLE (machine back): gh variable delete MAC_INTEL_OFFLINE            --repo frstrtr/c2pool
          # MAC_INTEL_PAUSED=true DROPS this leg entirely — for when the Intel
          # machine is physically away and the ARM M4 cannot cross-build it
          # (no x86_64 Homebrew under /usr/local). This is a REAL COVERAGE GAP,
          # not a pass: the mac-x86_64-coverage job below turns it into a
          # visible warning so a green rollup cannot be mistaken for "x86_64 is
          # tested". Prefer MAC_INTEL_OFFLINE (reroute to the M4) whenever the
          # M4 has an x86_64 Homebrew; only pause when neither host can build.
          #   PAUSE   : gh variable set    MAC_INTEL_PAUSED --body true --repo frstrtr/c2pool
          #   RESUME  : gh variable delete MAC_INTEL_PAUSED            --repo frstrtr/c2pool
          - arch: x86_64
            runner: ${{ vars.MAC_INTEL_OFFLINE == 'true' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","c2pool-mac-arm"]') || 'macos-14') || fromJSON('["self-hosted","macOS","X64","c2pool-mac-intel"]') }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Homebrew PATH
        # Self-hosted Intel runner (macpro-intel-204) launches the Actions
        # service from launchd, whose PATH omits Homebrew's /usr/local/bin
        # (#100: brew exit 127). GitHub-hosted arm64 keeps /opt/homebrew on PATH.
        # Append whichever prefix actually has brew so every later step
        # (cmake, brew --prefix) inherits it via $GITHUB_PATH.
        run: |
          if [ -x /opt/homebrew/bin/brew ]; then
            echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          elif [ -x /usr/local/bin/brew ]; then
            echo "/usr/local/bin" >> "$GITHUB_PATH"
          else
            echo "::error::Homebrew not found at /opt/homebrew or /usr/local on ${RUNNER_NAME:-runner}" >&2
            exit 1
          fi

      - name: Resolve target toolchain (arch-aware)
        id: tc
        # macpro-intel-204 offline fallback: the x86_64 leg runs on the Apple
        # Silicon M4, so it must link x86_64 deps from the SEPARATE x86_64
        # Homebrew rooted at /usr/local -- not the arm64 /opt/homebrew. Native
        # legs (arm64 here, or x86_64 on macpro-intel-204 when the var is unset)
        # use whichever brew "Set up Homebrew PATH" put on PATH. Fail loudly if
        # x86_64 brew is absent rather than silently linking arm64 into an
        # x86_64 target (a mis-linked binary that "builds" is worse than a red).
        run: |
          HOST="$(uname -m)"; TARGET="${{ matrix.arch }}"
          if [ "$TARGET" = "x86_64" ] && [ "$HOST" = "arm64" ]; then
            if [ ! -x /usr/local/bin/brew ]; then
              echo "::error::x86_64 Homebrew (/usr/local/bin/brew) not found on ${RUNNER_NAME:-runner}; cannot cross-build the x86_64 slice. Install x86_64 Homebrew on Mac-mini-Alonso-227, or bring macpro-intel-204 back (gh variable delete MAC_INTEL_OFFLINE)." >&2
              exit 1
            fi
            echo "brew=arch -x86_64 /usr/local/bin/brew" >> "$GITHUB_OUTPUT"
            echo "prefix=/usr/local" >> "$GITHUB_OUTPUT"
            echo "cross=1" >> "$GITHUB_OUTPUT"
          else
            echo "brew=brew" >> "$GITHUB_OUTPUT"
            echo "prefix=$(brew --prefix)" >> "$GITHUB_OUTPUT"
            echo "cross=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: ${{ steps.tc.outputs.brew }} install cmake boost leveldb secp256k1 nlohmann-json yaml-cpp sccache

      - name: Configure
        # Drive the target arch explicitly (sibling of release.yml universal) and
        # point find_package at the matching Homebrew prefix so the x86_64 cross
        # leg links x86_64 libs, not arm64 ones.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_PREFIX_PATH=${{ steps.tc.outputs.prefix }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build --target c2pool -j$(sysctl -n hw.ncpu)

      - name: Verify binary
        # `file` inspects the Mach-O without executing. The --help smoke actually
        # runs the binary; for x86_64 cross-built on Apple Silicon that needs
        # Rosetta 2. Probe for it -- run the smoke under Rosetta if present, else
        # emit a BUILD-ONLY warning (not a failure). Native legs always smoke.
        run: |
          file build/src/c2pool/c2pool
          if [ "${{ steps.tc.outputs.cross }}" = "1" ]; then
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              arch -x86_64 build/src/c2pool/c2pool --help 2>&1 | head -3
            else
              echo "::warning::x86_64 --help smoke skipped -- Rosetta 2 absent on ${RUNNER_NAME:-runner}; this leg is BUILD-ONLY while macpro-intel-204 is offline (MAC_INTEL_OFFLINE)."
            fi
          else
            build/src/c2pool/c2pool --help 2>&1 | head -3
          fi

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="c2pool-${VERSION}-macos-${{ matrix.arch }}"
          BREW="$(brew --prefix)"
          mkdir -p "${PKG}/lib" "${PKG}/config" "${PKG}/web-static" "${PKG}/explorer"
          cp build/src/c2pool/c2pool "${PKG}/"
          strip "${PKG}/c2pool"
          for dylib in $(otool -L "${PKG}/c2pool" | grep "${BREW}" | awk '{print $1}'); do
            base=$(basename "$dylib")
            cp "$dylib" "${PKG}/lib/${base}"
            install_name_tool -change "$dylib" "@executable_path/lib/${base}" "${PKG}/c2pool"
          done
          for lib in "${PKG}"/lib/*.dylib; do
            for ref in $(otool -L "$lib" | grep "${BREW}" | awk '{print $1}'); do
              base=$(basename "$ref")
              [ -f "${PKG}/lib/${base}" ] && install_name_tool -change "$ref" "@executable_path/lib/${base}" "$lib"
            done
            install_name_tool -id "@executable_path/lib/$(basename $lib)" "$lib"
          done
          cp start.sh "${PKG}/" && chmod +x "${PKG}/start.sh"
          cp config/c2pool_mainnet.yaml "${PKG}/config/c2pool_mainnet.yaml.example" || true
          cp -r web-static/* "${PKG}/web-static/"
          cp explorer/explorer.py "${PKG}/explorer/"
          zip -r "${PKG}.zip" "${PKG}/"
          shasum -a 256 "${PKG}.zip" > "${PKG}.zip.sha256"

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: c2pool-*-macos-${{ matrix.arch }}.zip*

  # ════════════════════════════════════════════════════════════════════════════
  # Windows (MSVC 2022, Conan)
  # ════════════════════════════════════════════════════════════════════════════
  windows:
    name: Windows x86_64
    # dash-slice campaign: skip Windows for PRs carrying the dash-linux-only label (re-enabled at block-viable gate, ~07-01)
    if: ${{ !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'dash-linux-only')) && !(github.event_name == 'pull_request' && vars.PR_LINUX_ONLY == 'true') }}
    # Internal PRs / pushes -> self-hosted c2pool-windows-217 (VM217): toolchain
    # probe run 28679257030 green (Python 3.12, Conan 2, CMake, Git, MSVC/VS 2022
    # C++ build tools all provisioned). Fork PRs fall back to GitHub-hosted
    # windows-2022 (ships cmake + MSVC/VS 2022 + SDK). Completes the #439
    # self-hosted migration -- Windows was the last GitHub-hosted C++ lane.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Windows","X64","c2pool-build"]') || 'windows-2022' }}
    defaults:
      run:
        # VM217 Windows PowerShell runs at ExecutionPolicy=Restricted, so the
        # runner cannot source its temp .ps1 command files (PSSecurityException
        # / UnauthorizedAccess). Bypass shell proven green by probe 28679257030.
        # Applies to every PowerShell run step below; cmd steps override locally.
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v6

      # Per-job Conan home under $RUNNER_TEMP so concurrent jobs never tear each
      # other's cache. Export via $GITHUB_ENV (job-level env fails to parse).
      # PowerShell form (inherits the job's ExecutionPolicy-Bypass shell).
      - name: Set per-job Conan home
        run: echo "CONAN_HOME=$env:RUNNER_TEMP/conan2" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-python@v6
        if: ${{ runner.environment == 'github-hosted' }}
        with: { python-version: '3.12' }

      - name: Install Conan 2
        # VM217 self-hosted has no bash on the runner-service PATH (git.exe is
        # present but Git-bash is not) -> shell:bash gave "bash: command not
        # found". Conan 2 is pip-installed here (VM217 does not expose it on
        # PowerShell works on both lanes (VM217 has Windows PowerShell; the
        # fork-fallback windows-2022 has it too). Inherits the job-level
        # ExecutionPolicy-Bypass shell (see defaults above).
        run: |
          # VM217 runner-service PATH exposes neither conan nor a bare python:
          # setup-python is gated off for self-hosted, so resolve an interpreter
          # ourselves. The Windows py launcher (C:\Windows, on PATH for all
          # users) is the reliable entry point; fall back py -> python3 -> python
          # and dump where.exe diagnostics if none resolve. Then pip-install conan
          # and export its Scripts dir(s) via GITHUB_PATH for later steps.
          $py = $null
          foreach ($cand in @('py','python3','python')) {
            if (Get-Command $cand -ErrorAction SilentlyContinue) { $py = $cand; break }
          }
          if (-not $py) {
            Write-Host "No Python interpreter on PATH. Diagnostics:"
            & where.exe python 2>&1; & where.exe py 2>&1; & where.exe python3 2>&1
            Write-Host "PATH=$env:PATH"
            throw "VM217 has no Python interpreter on the runner-service PATH"
          }
          Write-Host "Using interpreter: $py"
          & $py -m pip install "conan>=2.0,<3.0"
          $scripts = & $py -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $userScripts = & $py -c "import sysconfig; print(sysconfig.get_path('scripts','nt_user'))"
          $env:PATH = "$scripts;$userScripts;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $scripts
          Add-Content -Path $env:GITHUB_PATH -Value $userScripts
          conan --version

      - name: Detect Conan profile
        run: |
          conan profile detect --force
          $profile = conan profile path default
          (Get-Content $profile) -replace 'compiler.cppstd=14','compiler.cppstd=20' | Set-Content $profile

      - name: Restore Conan cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/conan2
          key: conan2-windows-msvc194-${{ hashFiles('conanfile.txt') }}

      - name: Conan install
        run: conan install . --build=missing --output-folder=build_ci

      - name: Build secp256k1
        run: |
          # Bounded retry + shallow: survive a stalled fetch on the lossy
          # WAN uplink (GIT_HTTP_LOW_SPEED_* aborts the stall in ~20s).
          for ($i = 1; $i -le 3; $i++) {
            git clone --depth 1 https://github.com/bitcoin-core/secp256k1 secp256k1-src
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { Write-Host "::error::secp256k1 clone failed after 3 attempts"; exit 1 }
            Write-Host "::warning::secp256k1 clone attempt $i/3 stalled; retrying"
            Remove-Item -Recurse -Force secp256k1-src -ErrorAction SilentlyContinue
            Start-Sleep -Seconds ($i * 5)
          }
          # -DSECP256K1_ENABLE_MODULE_RECOVERY=ON: upstream defaults this module
          # OFF, and with it off the recovery header (secp256k1_recovery.h) is
          # NOT installed and the recovery symbols are NOT compiled. Linux/macOS
          # get it from their distro packages (libsecp256k1-dev / brew secp256k1);
          # this source build must enable it explicitly so spork.hpp's
          # <secp256k1_recovery.h> resolves and secp256k1_ecdsa_recover* link.
          cmake -B secp256k1-src/build -S secp256k1-src -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${env:GITHUB_WORKSPACE}/secp256k1" -DSECP256K1_ENABLE_MODULE_RECOVERY=ON -DSECP256K1_BUILD_TESTS=OFF -DSECP256K1_BUILD_EXHAUSTIVE_TESTS=OFF -DSECP256K1_BUILD_BENCHMARK=OFF -DSECP256K1_BUILD_EXAMPLES=OFF
          cmake --build secp256k1-src/build --config Release
          cmake --install secp256k1-src/build --config Release

      - name: Configure
        shell: cmd
        run: cmake -S . -B build_ci -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=build_ci/conan_toolchain.cmake -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%/secp256k1" -DCMAKE_CXX_FLAGS="/D_WIN32_WINNT=0x0A00"

      - name: Build
        shell: cmd
        run: cmake --build build_ci --target c2pool --config Release -j %NUMBER_OF_PROCESSORS%

      - name: Verify binary
        run: |
          # SONAME-agnostic glob: upstream bumps libsecp256k1-N.dll (6->7 etc). Do NOT re-pin a number.
          Copy-Item "${env:GITHUB_WORKSPACE}/secp256k1/bin/libsecp256k1-*.dll" build_ci/src/c2pool/Release/
          # Run the binary to completion and capture its output BEFORE slicing.
          # Piping straight into `Select-Object -First 3` closes the pipe after 3
          # lines while c2pool.exe is still writing its banner, so the next stdout
          # write hits a broken pipe and the process aborts with a non-zero exit
          # (a race that flakes red under CI load). Capture-then-slice avoids that,
          # and we smoke-test on "did it print output", not the binary's own exit code.
          $out = & "build_ci/src/c2pool/Release/c2pool.exe" --help 2>&1 | Out-String
          $out -split "`n" | Select-Object -First 3
          if ([string]::IsNullOrWhiteSpace($out)) { Write-Error "binary produced no output"; exit 1 }
          exit 0

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          $PKG = "c2pool-${VERSION}-windows-x86_64"
          New-Item -ItemType Directory -Path "${PKG}/lib","${PKG}/config","${PKG}/web-static","${PKG}/explorer" -Force
          Copy-Item build_ci/src/c2pool/Release/c2pool.exe "${PKG}/"
          # DLL must be next to exe for Windows DLL search path (portable ZIP)
          # Also copy to lib/ for Inno Setup installer compatibility
          # SONAME-agnostic glob: upstream bumps libsecp256k1-N.dll (6->7 etc). Do NOT re-pin a number.
          Copy-Item "${env:GITHUB_WORKSPACE}/secp256k1/bin/libsecp256k1-*.dll" "${PKG}/"
          Copy-Item "${env:GITHUB_WORKSPACE}/secp256k1/bin/libsecp256k1-*.dll" "${PKG}/lib/"
          Copy-Item start.bat "${PKG}/"
          Copy-Item -Recurse web-static/* "${PKG}/web-static/"
          Copy-Item explorer/explorer.py "${PKG}/explorer/"
          Copy-Item config/c2pool_mainnet.yaml "${PKG}/config/c2pool_mainnet.yaml.example"
          Copy-Item config/c2pool_testnet.yaml "${PKG}/config/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "${PKG}" -DestinationPath "${PKG}.zip"
          (Get-FileHash "${PKG}.zip" -Algorithm SHA256).Hash + "  ${PKG}.zip" | Out-File "${PKG}.zip.sha256" -Encoding ascii

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: c2pool-*-windows-x86_64.zip*

  # ════════════════════════════════════════════════════════════════════════════
  # COIN_DGB + AUX_DOGE=ON (dual-parent stretch seam, phase DA) — keeps the
  # opt-in seam landed in #310 from rotting dark: a configure flag with no CI
  # coverage drifts silently. This arm configures c2pool-dgb with the flag ON
  # so the node.hpp #ifdef AUX_DOGE seam is compiled on every PR. Default build
  # (flag OFF) is unchanged and still covered by the linux + dgb-smoke jobs.
  # ════════════════════════════════════════════════════════════════════════════
  coin-dgb-auxdoge:
    name: COIN_DGB +AUX_DOGE Linux x86_64
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","c2pool-build"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6

      # Per-job Conan home under $RUNNER_TEMP so concurrent jobs on the shared
      # self-hosted host never tear each other's cache (root of the boost
      # torn-cache reds). Export via $GITHUB_ENV -- a job-level `env: runner.temp`
      # fails to parse.
      - name: Set per-job Conan home
        run: echo "CONAN_HOME=$RUNNER_TEMP/conan2" >> "$GITHUB_ENV"

      - name: Install system dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ ccache cmake make libleveldb-dev libsecp256k1-dev

      - uses: actions/setup-python@v6
        with: { python-version: 3.12 }

      - name: Install Conan 2
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            pip install "conan>=2.0,<3.0"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            conan --version   # pre-provisioned at /usr/local/bin on self-hosted
          fi

      # Prefer the LAN Conan mirror when it answers the probe; conancenter stays
      # as the fallback and is never removed, so an unreachable mirror is a
      # no-op. Cuts a fresh runner's cold bootstrap from a measured 1554 s
      # (170.7 MB Boost tarball over the WAN + from-source build) to ~2 s.
      - name: Prefer LAN Conan remote
        run: bash ci/conan/lan-remote.sh

      - name: Detect Conan profile
        run: |
          conan profile detect --force
          sed -i 's/compiler.cppstd=.*/compiler.cppstd=20/' "$(conan profile path default)"

      - name: Restore Conan cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/conan2
          key: conan2-ubuntu24-gcc13-dgb-auxdoge-${{ hashFiles('conanfile.txt') }}

      # Self-hosted runners reuse the workspace across runs; a stale build_dgb_auxdoge/
      # leaves gtest_discover_tests POST_BUILD artifacts that ctest then
      # includes as empty/placeholder files ("Unknown CMake command
      # gtest_discover_tests_impl", ctest exit 8). Wipe it for a clean
      # configure+discovery. ccache (in ~/.cache/ccache) keeps recompiles fast.
      - name: Clean stale build dir (self-hosted workspace is reused)
        if: runner.environment != 'github-hosted'
        run: rm -rf build_dgb_auxdoge

      # Conan prime: only conancenter egress; the install below runs --no-remote.
      - name: Conan prime (only conancenter egress)
        run: |
          for attempt in 1 2 3; do
            if conan install . --build=missing --output-folder=build_dgb_auxdoge --settings=build_type=Release; then exit 0; fi
            echo "conan prime failed (attempt $attempt/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "conan prime failed after 3 attempts" >&2
          exit 1

      - name: Conan install (offline; --no-remote)
        run: conan install . --build=missing --output-folder=build_dgb_auxdoge --settings=build_type=Release -nr

      - name: Configure (-DCOIN_DGB=ON -DAUX_DOGE=ON)
        run: cmake -S . -B build_dgb_auxdoge -DCMAKE_TOOLCHAIN_FILE=build_dgb_auxdoge/conan_toolchain.cmake -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DCOIN_DGB=ON -DAUX_DOGE=ON

      - name: Build c2pool-dgb binary (AUX_DOGE seam ON)
        run: cmake --build build_dgb_auxdoge --target c2pool-dgb -j8

      # Link-level companion to the compile-time aux_doge_isolation_guard.hpp:
      # fail the build if the DGB parent (AUX_DOGE seam ON) ODR-uses any LTC
      # per-coin consensus symbol (make_ltc_chain_params / ltc::coin::HeaderChain
      # / ltc::coin::ChainParams). Positive control asserts dgb::coin:: present.
      - name: Link-isolation guard (no LTC consensus surface in DGB parent)
        run: bash scripts/ci/dgb_aux_doge_link_isolation_guard.sh build_dgb_auxdoge/src/c2pool/c2pool-dgb

      - name: Smoke test (--help)
        run: |
          BIN=build_dgb_auxdoge/src/c2pool/c2pool-dgb
          file "$BIN"
          "$BIN" --help 2>&1 | head -5 || true

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coin-dgb-auxdoge-fail
          path: |
            build_dgb_auxdoge/CMakeFiles/CMakeOutput.log
            build_dgb_auxdoge/CMakeFiles/CMakeError.log
          retention-days: 7
          if-no-files-found: ignore

      # Steady-state disk hygiene on the VM905 self-hosted runners: drop the
      # checkout payload and _temp, keep _actions/_tool/_update. Always runs.
      - name: Prune runner workspace
        if: always()
        uses: ./.github/actions/prune-runner-workspace

  # ════════════════════════════════════════════════════════════════════════════
  # DASH with the REAL BLS backend linked (C2POOL_DASH_BLS=ON)
  #
  # Every other lane builds DASH with the option OFF, where dash_bls_verify is a
  # fail-closed stub: correct, but it can never serve a real type-6 quorum
  # commitment. This job is the one that compiles + exercises the actual
  # BLS12-381 path, and it is the CI mirror of what the release DASH package now
  # ships.
  #
  # NON-HOLLOW BY CONSTRUCTION — three independent legs, because "the flag was
  # passed" is not evidence:
  #   1. cmake FATAL_ERRORs if dashbls is missing (root CMakeLists), so this job
  #      cannot go green on a silently degraded configure;
  #   2. scripts/ci/dash_bls_linked_guard.sh inspects the produced c2pool-dash
  #      binary for dashbls rodata + symbols;
  #   3. the six BLS-crypto KATs are named EXPLICITLY below and each must
  #      REPORT AS RUN — they live behind #ifdef C2POOL_DASH_BLS, so a stub
  #      build makes them vanish rather than fail, which is exactly the
  #      "silently Not Run" shape that has bitten this repo before.
  #
  # DASH-ONLY: nothing here touches the shared core the Windows/LTC launcher
  # builds; no other job's flags change.
  # ════════════════════════════════════════════════════════════════════════════
  linux-dash-bls:
    name: DASH + real BLS (Linux x86_64)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","c2pool-build"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set per-job Conan home
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            echo "CONAN_HOME=$RUNNER_TEMP/conan2" >> "$GITHUB_ENV"
          else
            echo "CONAN_HOME=$HOME/.conan2-ci/$RUNNER_NAME" >> "$GITHUB_ENV"
          fi

      - name: Install system dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ ccache cmake make libleveldb-dev libsecp256k1-dev

      - uses: actions/setup-python@v6
        if: ${{ runner.environment == 'github-hosted' }}
        with: { python-version: '3.12' }

      - name: Install Conan 2
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            pip install "conan>=2.0,<3.0"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            conan --version   # pre-provisioned at /usr/local/bin on self-hosted
          fi

      # Prefer the LAN Conan mirror when it answers the probe; conancenter stays
      # as the fallback and is never removed, so an unreachable mirror is a
      # no-op. Cuts a fresh runner's cold bootstrap from a measured 1554 s
      # (170.7 MB Boost tarball over the WAN + from-source build) to ~2 s.
      - name: Prefer LAN Conan remote
        run: bash ci/conan/lan-remote.sh

      - name: Restore Conan cache (github-hosted only)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/conan2
          key: conan2-ubuntu24-gcc13-${{ hashFiles('conanfile.txt', 'ci/conan/linux-gcc13.profile') }}

      - name: Clean stale build dir (self-hosted workspace is reused)
        if: runner.environment != 'github-hosted'
        run: rm -rf build_dash_bls

      - name: Conan install
        run: |
          for attempt in 1 2 3; do
            if conan install . -pr:a=ci/conan/linux-gcc13.profile --build=missing --output-folder=build_dash_bls; then exit 0; fi
            echo "conan install failed (attempt $attempt/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "conan install failed after 3 attempts" >&2
          exit 1

      # Builds dash's own src/dashbls subtree at the pinned tag once per runner
      # and exports DASHBLS_ROOT. Fails loudly if it cannot produce the prefix.
      - name: Provision dashbls
        uses: ./.github/actions/provision-dashbls

      # LEG 1: a missing dashbls is a configure-time FATAL_ERROR, not a warning.
      - name: Configure (C2POOL_DASH_BLS=ON)
        run: |
          cmake -S . -B build_dash_bls \
            -DCMAKE_TOOLCHAIN_FILE=build_dash_bls/conan_toolchain.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DC2POOL_DASH_BLS=ON -DDASHBLS_ROOT="$DASHBLS_ROOT"

      - name: Build c2pool-dash + BLS KATs
        run: |
          cmake --build build_dash_bls \
            --target c2pool-dash \
                     test_dash_bls_verify test_dash_quorum_members \
                     test_dash_quorum_member_source test_dash_govvote_bls \
                     test_dash_chainlock_verify test_dash_isdlock test_dash_dstx \
            -j8

      # LEG 2: the artefact itself carries the dashbls backend.
      - name: BLS link guard (binary carries dashbls)
        run: bash scripts/ci/dash_bls_linked_guard.sh build_dash_bls/src/c2pool/c2pool-dash

      - name: Run BLS KATs
        working-directory: build_dash_bls
        # --no-tests=error: per-binary zero-test floor. These KATs live behind
        # #ifdef C2POOL_DASH_BLS, so a stub build makes the selector match zero
        # -- RED here, belt to the explicit per-name assertion in the next step.
        run: ctest --output-on-failure --no-tests=error -j8 -R 'DashBlsVerify|DashQuorumMembers|DashQuorumMemberSource|DashGovVoteBLS|DashChainLockVerify|DashIsdlockBls'

      # LEG 3: the BLS-ONLY cases actually ran. Each of these is inside
      # #ifdef C2POOL_DASH_BLS, so on a stub build they do not fail -- they
      # cease to exist, and a bare ctest invocation reports green over an empty
      # set. Requiring each name to appear as a PASSED line closes that.
      - name: Assert the BLS-only KATs reported as run
        working-directory: build_dash_bls
        run: |
          # `|| true`: pass/fail is already gated by the ctest step above. Here
          # the only question is which cases EXIST, so a non-zero exit must not
          # abort before the per-case report below is printed.
          ./test/test_dash_bls_verify        > bls_kat.log 2>&1 || true
          ./test/test_dash_quorum_members    >> bls_kat.log 2>&1 || true
          ./test/test_dash_chainlock_verify  >> bls_kat.log 2>&1 || true
          ./test/test_dash_isdlock           >> bls_kat.log 2>&1 || true
          ./test/test_dash_dstx              >> bls_kat.log 2>&1 || true
          log="$(cat bls_kat.log)"
          missing=0
          for t in \
            DashBlsVerify.RealQuorumSigAcceptsAndTamperRejects \
            DashBlsVerify.BlsSmokeSignVerify \
            DashBlsVerify.VerifyFinalCommitmentSyntheticRoundTrip \
            DashQuorumMembers.RealCommitmentVerifiesWithComputedMembers \
            DashQuorumMembers.RealPlatformCommitmentVerifiesWithEvoOnlyMembers \
            DashQuorumMembers.PartialSignersAndValidMembers \
            DashChainLockVerify.RealChainLockVerifies \
            DashChainLockVerify.TamperedSignatureIsRejected \
            DashChainLockVerify.ForgedSignatureIsRejected \
            DashChainLockVerify.InternallyValidSignatureFromWrongQuorumIsRejected \
            DashChainLockVerify.WrongQuorumKeyIsRejected \
            DashChainLockVerify.RejectedWhenSigningQuorumIsMissingFromTheSet \
            DashIsdlockBls.RealSignatureVerifiesEndToEnd \
            DashIsdlockBls.TamperedSignatureIsRejectedAndNeverReachesMempool \
            DashDstxFailClosed.BadBlsSignatureIsRejected
          do
            # Pure-shell match, not `grep -q` in a pipeline: under pipefail a
            # `grep -q` that matches SIGPIPEs its producer and the pipeline
            # reports failure ON SUCCESS. That exact bug turned an earlier draft
            # of this guard into a false-negative machine.
            case "$log" in
              *"OK ] $t"*) echo "  ok   $t" ;;
              *) echo "  MISS $t did not report as run"; missing=1 ;;
            esac
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::BLS-only KATs did not run -- the build is BLS-dark despite C2POOL_DASH_BLS=ON"
            exit 1
          fi

      - name: Upload real-BLS binary (deployable candidate)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: c2pool-dash-linux-x64-realbls
          path: build_dash_bls/src/c2pool/c2pool-dash
          retention-days: 3
          overwrite: true
          if-no-files-found: error

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-dash-bls-fail
          path: |
            build_dash_bls/CMakeFiles/CMakeOutput.log
            build_dash_bls/CMakeFiles/CMakeError.log
            build_dash_bls/bls_kat.log
          retention-days: 7
          if-no-files-found: ignore

      # Steady-state disk hygiene on the VM905 self-hosted runners: drop the
      # checkout payload and _temp, keep _actions/_tool/_update. Always runs.
      - name: Prune runner workspace
        if: always()
        uses: ./.github/actions/prune-runner-workspace

  # Releases are built and published manually (not via CI).
  # See installer/ for packaging scripts (DMG, ZIP, Inno Setup).
