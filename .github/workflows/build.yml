name: CI

on:
  push:
    branches: [master, btc-embedded, dash-spv-embedded, dgb/**, windows-build, service-update]
    tags: ['v*']
  pull_request:
    branches: [master, btc-embedded, dash-spv-embedded, dgb/**]

# Concurrency: a newer run on the same ref cancels the stale in-progress
# one, cutting concurrent load on the shared self-hosted pool (the OOM/
# oversubscription root cause, not just queue depth). Per-ref group so
# distinct PRs/branches never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs; NEVER cancel a push (master/release/tag)
  # run - back-to-back merges to master share this ref-group, so cancel-on-push
  # would kill a merged SHA in-flight rollup before it verifies green (#626
  # bit the #617 web-static lane exactly this way). PR churn still de-dupes.
  cancel-in-progress: ${{ github.event_name != 'push' }}


env:
  # Fail-fast on a stalled git HTTP transfer instead of hanging to the job
  # timeout. Our WAN uplink stalls ~12% of codeload fetches (they neither
  # finish nor error out); aborting a sub-1000 B/s transfer after 20s lets
  # actions/checkout built-in 3-attempt fetch retry recover in ~1 min.
  GIT_HTTP_LOW_SPEED_LIMIT: '1000'
  GIT_HTTP_LOW_SPEED_TIME: '20'

jobs:
  # ------------------------------------------------------------------------
  # PR job-selection filter. On pull_request, skip expensive jobs whose
  # inputs did not change; on push/tag/dispatch this filter is BYPASSED and
  # every job runs (the master rollup and release builds stay authoritative).
  # NONE of the jobs gated here are branch-protection required checks, so a
  # skip reports as "Skipped" (never a false-green on a required gate) and
  # nothing needs: them, so no downstream cascade. Required coin/consensus
  # gates are deliberately NOT filtered here (tracked in ci-steward card).
  # ------------------------------------------------------------------------
  changes:
    name: PR path filter
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","c2pool-build"]') || 'ubuntu-24.04' }}
    outputs:
      web: ${{ steps.filter.outputs.web }}
      qt: ${{ steps.filter.outputs.qt }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web-static/**'
              - '.github/workflows/build.yml'
            qt:
              - 'ui/**'
              - 'src/**'
              - 'CMakeLists.txt'
              - 'conanfile*'
              - 'cmake/**'
              - '.github/workflows/build.yml'
  # ════════════════════════════════════════════════════════════════════════════
  # Test-allowlist drift-guard (fast, no build): every per-coin test executable
  # declared in src/impl/<coin>/test/CMakeLists.txt must appear in a build.yml
  # --target list, else it becomes a NOT_BUILT CTest sentinel that silently
  # passes (the DGB #137 / test_dgb_subsidy class that red'd master).
  # ════════════════════════════════════════════════════════════════════════════
  test-allowlist-guard:
    name: Test allowlist drift-guard
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","c2pool-build"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check coin test targets vs build.yml --target allowlist
        run: python3 tools/ci/check_test_target_allowlist.py

      # Steady-state disk hygiene on the VM905 self-hosted runners: drop the
      # checkout payload and _temp, keep _actions/_tool/_update. Always runs.
      - name: Prune runner workspace
        if: always()
        uses: ./.github/actions/prune-runner-workspace
  # ════════════════════════════════════════════════════════════════════════════
  # Linux (Ubuntu 24.04, GCC 13, Conan)
  # ════════════════════════════════════════════════════════════════════════════
  linux:
    name: Linux x86_64
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","c2pool-build"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6

      # Private per-job Conan home: each job builds Boost into an ISOLATED cache,
      # so concurrent jobs can never tear each other's ~/.conan2 (root cause of the
      # 1.90.0 torn-header flakes). RUNNER_TEMP is only valid at step scope, so
      # export it via $GITHUB_ENV -- a job-level `env: runner.temp` fails to parse.
      - name: Set per-job Conan home
        run: |
          # github-hosted: ephemeral per-job home, warmed by actions/cache below.
          # self-hosted:   PERSISTENT home keyed on the runner instance. A runner
          # executes one job at a time, so this home is never contended (no
          # sqlite "failed to acquire database lock in 20s") while still keeping
          # the per-job isolation of #704/#710 -- no two concurrent jobs share it.
          # Being persistent, it also takes the GH cache-service restore off the
          # hot path: that restore times out on VM905 ("Failed to restore: The
          # operation cannot be completed in timeout") and its miss cascaded into
          # a cold from-source Boost rebuild on all 8 runners at once.
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            echo "CONAN_HOME=$RUNNER_TEMP/conan2" >> "$GITHUB_ENV"
          else
            echo "CONAN_HOME=$HOME/.conan2-ci/$RUNNER_NAME" >> "$GITHUB_ENV"
          fi

      - name: Install system dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ ccache cmake make libleveldb-dev libsecp256k1-dev

      # Python is pre-provisioned on VM217; only provision on GitHub-hosted forks.
      - uses: actions/setup-python@v6
        if: ${{ runner.environment == 'github-hosted' }}
        with: { python-version: '3.12' }

      - name: Install Conan 2
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            pip install "conan>=2.0,<3.0"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            conan --version   # pre-provisioned at /usr/local/bin on self-hosted
          fi

      # Prefer the LAN Conan mirror when it answers the probe; conancenter stays
      # as the fallback and is never removed, so an unreachable mirror is a
      # no-op. Cuts a fresh runner's cold bootstrap from a measured 1554 s
      # (170.7 MB Boost tarball over the WAN + from-source build) to ~2 s.
      - name: Prefer LAN Conan remote
        run: bash ci/conan/lan-remote.sh

      - name: Show committed Conan profile
        run: conan profile show -pr:a=ci/conan/linux-gcc13.profile

      - name: Restore Conan cache (github-hosted only)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/conan2
          key: conan2-ubuntu24-gcc13-${{ hashFiles('conanfile.txt', 'ci/conan/linux-gcc13.profile') }}

      # Self-hosted runners reuse the workspace across runs; a stale build_ci/
      # leaves gtest_discover_tests POST_BUILD artifacts that ctest then
      # includes as empty/placeholder files ("Unknown CMake command
      # gtest_discover_tests_impl", ctest exit 8). Wipe it for a clean
      # configure+discovery. ccache (in ~/.cache/ccache) keeps recompiles fast.
      - name: Clean stale build dir (self-hosted workspace is reused)
        if: runner.environment != 'github-hosted'
        run: rm -rf build_ci

      # Conan prime: the ONLY step here that reaches out to conancenter. A
      # bounded retry+backoff absorbs a transient DNS/CDN blip and populates the
      # local cache for any genuinely-new or cache-evicted dep. Every step below
      # runs --no-remote (-nr) and cannot be reddened by a conancenter outage
      # once the cache is primed.
      - name: Conan prime (only conancenter egress)
        run: |
          for attempt in 1 2 3; do
            if conan install . -pr:a=ci/conan/linux-gcc13.profile --build=missing --output-folder=build_ci; then exit 0; fi
            echo "conan prime failed (attempt $attempt/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "conan prime failed after 3 attempts" >&2
          exit 1

      - name: Conan install (offline; --no-remote)
        run: conan install . -pr:a=ci/conan/linux-gcc13.profile --build=missing --output-folder=build_ci -nr

      - name: Configure
        # -DXMR_BUILD_RANDOMX=ON: build librandomx.a from the vendored
        # tevador/RandomX source (third_party/randomx, consensus pin 12f2c2ff)
        # and the xmr_randomx_verify_kat target. Non-sanitizer leg ONLY — the
        # RandomX JIT/asm + intentional unaligned reads do not survive
        # -fsanitize, so the ASAN leg deliberately leaves it OFF. Light mode:
        # the KAT never allocates the 2 GiB dataset (256 MiB cache only).
        run: cmake -S . -B build_ci -DCMAKE_TOOLCHAIN_FILE=build_ci/conan_toolchain.cmake -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DCOIN_DGB=ON -DXMR_BUILD_RANDOMX=ON

      # Boost header-integrity + version gate: a torn/mixed Boost tree or apt-Boost
      # fallback fails HERE (fast, one TU), not deep in the coin build.
      - name: Boost sentinel
        run: |
          cmake --build build_ci --target boost_sentinel -j8
          # --no-tests=error: the sentinel must actually RUN; if the target
          # ever fails to register, an empty selection cannot pass as green.
          ctest --test-dir build_ci -R '^boost_sentinel$' --output-on-failure --no-tests=error

      - name: Build
        # shell: bash => bash -o pipefail. WITHOUT it the default shell is
        # `bash -e {0}` (no pipefail), so `cmake ... | tee` would report TEE's
        # exit status — a FAILING build would go green. Every teed step below
        # needs this for the same reason.
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
          cmake --build build_ci --target c2pool -j8 2>&1 | tee "${GITHUB_WORKSPACE}/ci-logs/build.log"

      - name: Build tests
        shell: bash          # pipefail: see the Build step note above
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
          cmake --build build_ci \
            --target coin_peer_rearm_kat test_hardening test_share_messages test_coin_broadcaster \
                    test_redistribute_address test_redistribute test_auto_ratchet \
                    test_stratum_extensions test_stratum_hotel_interim test_btc_underfill_guard test_dgb_underfill_guard \
                    core_test sharechain_test share_test btc_share_test \
                    test_threading test_weights \
                    test_header_chain test_mempool test_template_builder \
                    test_doge_chain test_compact_blocks test_dash_x11_kat test_dash_header_chain test_dash_block_replay test_dash_conformance test_dash_subsidy test_dash_mempool test_dash_simplifiedmns test_dash_quorum test_dash_quorum_root test_dash_mn_state test_dash_embedded_gbt test_dash_underfill_guard test_dash_smldiff test_dash_p2p_messages test_dash_p2p_connection test_dash_p2p_node test_dash_node_interface test_dash_config test_dash_broadcaster test_dash_broadcaster_full test_dash_share_hash_link test_dash_block_relay test_dash_rpc_request test_dash_rpc_conf test_dash_block_producer test_dash_embedded_relay_e2e test_dash_block_relay_plan test_dash_version_activation_latch test_dash_embedded_startup_invariant test_dash_block_relay_binding test_dash_block_relay_dual_arm test_dash_coinbase_parity test_dash_coinbase_muldiv test_dash_donation_combined test_dash_g3_assembled test_dash_work_target test_dash_work_job_targets test_dash_stratum_binding test_dash_job_notify_roundtrip test_dash_cb_payee test_dash_stratum_notify_roundtrip test_dash_poolnode_messages test_dash_peer test_dash_share_tracker test_dash_node test_dash_share_messages test_dash_stratum_extranonce_split test_dash_stratum_submit_reassembly test_dash_difficulty_parity test_dash_auto_ratchet test_dash_min_protocol_gate test_dash_serve_gate_journal test_dash_work_source test_dash_node_coin_state test_dash_bestcl_gate test_dash_coin_state_maintainer test_dash_node_embedded_wire test_dash_node_reception_wire test_dash_get_work test_dash_stratum_work_source test_dash_superblock test_dash_oracle_byte_parity test_dash_chainlock_verify test_dash_isdlock test_dash_dashd_cut_arm test_dash_dstx test_dash_featured_node test_dash_sml_simd_sha256 dash_hdr_backfill_window_kat dial_lifetime_guard_kat test_reward_safe_file test_settings_cli_scan test_config_endpoint bip110_blake2b_kat bip110_m2_workshape_kat bip110_m3_serving_kat bip110_broadcaster_kat bip110_peer_info_snapshot_kat bip110_peer_discovery_kat bip110_dial_lifetime_realnode_kat bip110_broadcaster_slot_lifetime_kat bip110_coin_subver_brand_kat bip110_inbound_listener_kat bip110_coin_reachability_kat bip110_pool_identity_kat bip110_download_retry_kat bip110_pool_sharechain_compile bip110_pool_node_compile bip110_pool_mint_kat bip110_extend_mint_kat bip110_pool_hashrate_kat bip110_multiminer_pplns_kat bip110_current_payouts_kat bip110_sharechain_window_kat bip110_serve_xcheck_kat bip110_local_mint_verify_kat bip110_persistence_roundtrip_kat bip110_dial_lifetime_guard_kat bip110_explorer_getblock_kat bip110_explorer_retention_kat bip110_share_detail_kat \
                    c2pool-dash c2pool-ltc c2pool-btc c2pool-dgb c2pool-bch c2pool-bip110 \
                    test_multiaddress_pplns test_pplns_stress \
                    test_hash_link test_decay_pplns \
                    test_pplns_consensus \
                    test_v36_script_sorting test_v36_cross_impl_refhash \
                    test_phase4_embedded \
                    test_mweb_builder ltc_g3a_populated_test \
                    test_address_resolution test_compute_share_target test_web_honesty_regression test_ltc_work_target \
                    test_utxo test_dgb_subsidy test_dgb_coinbase_value dgb_share_test dgb_redistribute_test dgb_block_assembly_test dgb_witness_commitment_test dgb_header_sample_build_test dgb_header_ingest_test dgb_mempool_ingest_test \
                    dgb_gentx_coinbase_test dgb_connection_coinbase_test dgb_won_block_serialize_test dgb_pplns_payout_split_test nmc_auxpow_merkle_test nmc_template_builder_test nmc_underfill_guard_test nmc_auxpow_wire_test nmc_reconstruct_won_block_test nmc_mempool_name_test nmc_block_broadcast_test nmc_host_dualpath_test nmc_fallback_path_conformance_test nmc_header_sync_golden_test dgb_gentx_share_path_test dgb_conn_pplns_producer_test dgb_other_tx_resolver_test \
                    dgb_other_tx_assembler_test dgb_reconstruct_won_block_test dgb_reconstruct_closure_test dgb_gentx_unpack_test dgb_work_source_test dgb_template_builder_test dgb_embedded_coin_node_test dgb_live_node_status_test dgb_embedded_tx_select_test dgb_template_other_txs_test dgb_coinbase_value_parity_test dgb_submit_classify_test dgb_aux_parent_coinbase_parity_test dgb_template_capture_test dgb_aux_doge_db_commitment_bind_test dgb_aux_doge_mm_commitment_test dgb_aux_doge_dc_proof_test dgb_aux_doge_bind_parsers_test dgb_compact_blocks_bip152_parity_test dgb_aux_dual_target_select_test dgb_aux_broadcast_path_election_test dgb_aux_doge_submit_test dgb_aux_doge_embed_livewire_test dgb_aux_doge_dc_layout_verifier_test dgb_aux_doge_coinbase_commit_test dgb_aux_doge_residency_test \
                    rpc_request_test softfork_check_test genesis_check_test algo_select_test digishield_walk_test multishield_v4_kat_test header_chain_test \
                    dgb_coin_node_seam_test dgb_block_broadcast_test dgb_won_block_dispatch_test dgb_forced_won_share_dualpath_test dgb_scrypt_pow_test dgb_nonce_grinder_test dgb_regrind_block_test dgb_won_block_finalize_test dgb_share_target_genesis_test dgb_share_target_retarget_test dgb_share_bits_oracle_pin_test dgb_pool_msg_wire_test dgb_get_shares_walk_test dgb_download_stops_test dgb_think_p1_walk_bounds_test dgb_think_p1_desired_emit_test dgb_think_p6_desired_cutoff_test dgb_think_p4_head_keys_test dgb_think_p3_best_head_test dgb_g1_oracle_byte_parity_test dgb_think_p2_walk_bounds_test dgb_expected_time_to_block_test dgb_tail_score_endpoints_test dgb_pool_attempts_per_second_test dgb_pool_efficiency_test dgb_think_p5_best_share_punish_test dgb_auto_ratchet_tail_guard_test dgb_auto_ratchet_sim_test dgb_binomial_conf_interval_test dgb_desired_version_tally_test dgb_min_protocol_ratchet_test dgb_get_height_and_last_endpoints_test dgb_chain_walk_window_test dgb_redistribute_delegate_ghal_test dgb_share_weight_decay_test dgb_naughty_propagation_test dgb_hash_format_parity_test dgb_emergency_decay_saturation_test dgb_arith256_muldiv_kat_test dgb_share_tx_relay_refs_test dgb_coin_peer_rearm_test v37_test v37_executor_test v37_scaffold_test v37_w2_ingestion_test v37_w4_prereq_test v37_w4_settlement_test v37_w5_coinbase_test v37_w3_relay_test v37_subthreshold_estimator_test v37_w6_persistence_test c2pool-v37-w6-leveldb-compile-check v37_w4_estimator_wiring_test v37_xmr_node_smoke \
                    v37_descriptor_xmr_test \
                    v37_xmr_canon_p1_kat \
                    xmr_primitives_selfcheck xmr_x2_node_kat xmr_receipt_kat xmr_torsion_kat xmr_wire_dos_check xmr_stratum_selftest xmr_provenance_gate \
                    xmr_crypto_kats xmr_ed25519_derivation_kat xmr_difficulty_kat xmr_coinbase_kat xmr_goldens_kat xmr_e2e_kat xmr_miner_block_path_smoke c2pool-v37-xmr \
                    xmr_randomx_verify_kat \
            -j8 2>&1 | tee "${GITHUB_WORKSPACE}/ci-logs/build-tests.log"

      - name: Run tests
        working-directory: build_ci
        shell: bash          # pipefail: a failing ctest must fail the step
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-logs"
          # --no-tests=error: ctest itself fails a zero-test run (belt).
          # --output-junit: emit the per-case report the floor guard reads.
          ctest --output-on-failure --no-tests=error --output-junit "${GITHUB_WORKSPACE}/ci-logs/ctest-linux.xml" -j8 --exclude-regex "LiveTest\." 2>&1 | tee "${GITHUB_WORKSPACE}/ci-logs/run-tests.log"
          # Suspenders: reject a hollow green where the report has < floor cases.
          bash "${GITHUB_WORKSPACE}/scripts/ci/test_floor_guard.sh" linux "${GITHUB_WORKSPACE}/ci-logs/ctest-linux.xml"

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="c2pool-${VERSION}-linux-x86_64"
          mkdir -p "${PKG}/lib" "${PKG}/config" "${PKG}/web-static" "${PKG}/explorer"
          cp build_ci/src/c2pool/c2pool "${PKG}/"
          strip "${PKG}/c2pool"
          for lib in libleveldb.so.1 libsecp256k1.so.2 libsnappy.so.1; do
            found=$(find /usr/lib -name "${lib}*" -type f 2>/dev/null | head -1)
            [ -n "$found" ] && cp "$found" "${PKG}/lib/"
          done
          cp start.sh "${PKG}/" && chmod +x "${PKG}/start.sh"
          cp config/c2pool_mainnet.yaml "${PKG}/config/c2pool_mainnet.yaml.example" || true
          cp config/c2pool_testnet.yaml "${PKG}/config/" || true
          cp -r web-static/* "${PKG}/web-static/"
          cp explorer/explorer.py "${PKG}/explorer/"
          tar czf "${PKG}.tar.gz" "${PKG}/"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: c2pool-*-linux-x86_64.tar.gz*

      # tee-captured build/test stdout — survives the case where GitHubs own
      # per-job log capture returns 0 bytes (905-7 job 92744044447, Build tests).
      - name: Upload build/test logs
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: ci-logs-linux, path: ci-logs/, retention-days: 7, if-no-files-found: ignore }

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with: { name: test-results-linux, path: build_ci/Testing/, retention-days: 7 }

      # Steady-state disk hygiene on the VM905 self-hosted runners: drop the
      # checkout payload and _temp, keep _actions/_tool/_update. Always runs.
      - name: Prune runner workspace
        if: always()
        uses: ./.github/actions/prune-runner-workspace

  # ════════════════════════════════════════════════════════════════════════════
  # Linux AddressSanitizer + UBSan (informational, not gating yet)
  #
  # Builds c2pool + the full test suite with -fsanitize=address,undefined and
  # runs ctest under ASAN/UBSAN_OPTIONS. Catches use-after-free, heap overflow,
  # uninitialized read, integer overflow, etc. at PR time instead of via 12-h
  # soaks. Conan deps stay un-sanitized (static libs); libasan still intercepts
  # all allocations including those from deps, so UAFs that touch our code are
  # caught.
  #
  # Currently `continue-on-error: true` so reports are visible without blocking
  # merges while we work through the audit (Phase 1 of the socket-lifecycle
  # fundamental fix; see frstrtr/the/docs/c2pool-socket-lifecycle-fundamental-fix.md).
  # Will flip to required once known UAFs are fixed (Phase 7).
  # ════════════════════════════════════════════════════════════════════════════
  linux-asan:
    # Reap-guard (#1027/#1031 class): host co-residency of two RAM-heavy legs
    # (this ASan/UBSan build + CodeQL c-cpp analyze) is what produced the
    # steps=0 reaps on 198 and 145. Exclusion is enforced HOST-SIDE via an
    # exclusive flock on /tmp (the "Acquire per-host heavy-leg lock" step
    # below): runner processes on one physical host (905/905-2..905-8,
    # 198-2/198-3) share /tmp, so the flock is exactly per-host mutual
    # exclusion -- a second heavy leg on the same host WAITS (nothing is
    # ever cancelled) while heavy legs on different hosts run in parallel.
    # A workflow-level concurrency group is deliberately NOT used: GitHub
    # keeps at most 1 running + 1 pending run per group and CANCELS older
    # pending entries, so a shared repo-global group self-cancels sibling
    # jobs of the same run and serializes/starves all heavy legs repo-wide.
    name: Linux x86_64 (AsAN+UBSan)
    # dash bring-up slices may opt out of sanitizers via dash-skip-sanitizers; KEEP for consensus/payout slices (default = on)
    if: ${{ !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'dash-skip-sanitizers')) }}
    # RUNS ON c2pool-heavy — and CodeQL analyze deliberately does NOT.
    # This job and CodeQL analyze are the ONLY two holders of the per-host
    # reap-guard flock (#1105), so they must sit on DIFFERENT hosts or they
    # serialize (measured: one held the lock while the second sat blocked in
    # `flock -x -w 3600`). Which one moves is decided by where each is PROVEN:
    #   * this leg builds with `conan profile detect --force` (HOST DEFAULT
    #     compiler). The heavy host now defaults to gcc-13 and a from-scratch
    #     ASan+UBSan build there — purged conan cache, every dep rebuilt —
    #     links clean ([100%], 0 link errors). Earlier, under a gcc-15 default,
    #     it could not link at all (undefined reference to
    #     `std::ostream::_Disable_exceptions', a libstdc++/dep ABI mismatch);
    #     that is history, not a live constraint.
    #   * CodeQL stays on c2pool-build: staging its ~823 MB CLI bundle failed
    #     on the heavy host 4/4 ("'/usr/bin/tar' failed with exit code 2") —
    #     a THROUGHPUT problem (that host's egress swings ~258 KB/s..1 MB/s, so
    #     fixed timeouts cut large transfers short), not corruption and not
    #     PMTU. See the note in codeql-analysis.yml; it is revisitable, but
    #     flock separation would still keep these two on different hosts.
    # Do not consolidate these two onto one label.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","c2pool-heavy"]') || 'ubuntu-24.04' }}
    continue-on-error: true
    steps:
      # Reap-guard: host-scoped exclusivity vs the other RAM-heavy leg
      # (CodeQL c-cpp analyze). The lock is held by a disowned holder
      # process so it spans every step of this job (the CodeQL sibling's
      # heavy phase is an action step that cannot be wrapped in a shell
      # flock, hence the cross-step holder shape on both sides). Released
      # by the always() step at the end of the job; the holder also has a
      # 4 h TTL so a host-reaped job can never wedge the lock, and the
      # runner's end-of-job orphan cleanup is a second net.
      - name: Acquire per-host heavy-leg lock (reap-guard)
        if: runner.environment != 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          # Per-host heavy-leg semaphore (VM905: up to 8 runners on a 32-core/62 GB box).
          # History: a single slot (1 heavy leg per host) became the #1 CI failure mode --
          # 8 runners serialized behind one flock while ~2/3 of the box sat idle, and
          # waiters hard-failed at the -w budget (integrator measurement 2026-08-05). This
          # guard now offers HEAVY_LEG_SLOTS concurrent slots with first-free acquisition:
          # a leg takes the first free slot, so up to SLOTS heavy legs (ASan/UBSan build +
          # CodeQL c-cpp analyze) run concurrently on one host and the (SLOTS+1)th WAITS --
          # nothing is ever cancelled. 2 ASan/CodeQL legs fit 32c/62G comfortably; do NOT
          # raise SLOTS past 3 without first measuring an ASan leg's peak RSS.
          # Two holder invariants preserved from #1112:
          #  (1) the holder dies WITH the job -- it waits on the runner-worker PID and
          #      frees its slot the instant that worker dies; TTL is only a ceiling.
          #  (2) a stale holder from an already-dead job is REAPED at acquire, not blocked
          #      on: a recorded holder whose worker is gone, or a markerless PPID-1 legacy
          #      orphan, is by definition dead.
          # HEAVY_LEG_* env overrides exist ONLY for the honesty-gate test
          # (.github/actions/heavy-leg-lock/test.sh); production uses the defaults.
          LOCK="${HEAVY_LEG_LOCK:-/tmp/c2pool-heavy-leg.lock}"
          HOLDERFILE="${HEAVY_LEG_HOLDERFILE:-/tmp/c2pool-heavy-leg.holder}"
          WAIT="${HEAVY_LEG_WAIT:-5400}"
          TTL="${HEAVY_LEG_TTL:-14400}"
          SWEEP="${HEAVY_LEG_SWEEP:-1}"
          SLOTS="${HEAVY_LEG_SLOTS:-2}"
          ACQ="$(mktemp -u /tmp/c2pool-heavy-acq.XXXXXX)"

          # Slot files are ${LOCK}.1 .. ${LOCK}.SLOTS; each slot's live holder records a
          # ${HOLDERFILE}.<slot> marker ("holderpid workerpid"). Both are per-slot so two
          # concurrent holders never clobber each other's marker.

          # --- stale-holder sweep: reap the dead on each slot instead of blocking ---
          if [ "$SWEEP" = 1 ]; then
            _s=1
            while [ "$_s" -le "$SLOTS" ]; do
              _mf="${HOLDERFILE}.${_s}"
              if [ -f "$_mf" ]; then
                read -r MH MW _ < "$_mf" 2>/dev/null || true
                if [ -n "${MW:-}" ] && [ "${MW:-0}" != 0 ] && ! kill -0 "$MW" 2>/dev/null; then
                  echo "heavy-leg sweep: reaping holder pid ${MH:-?} on slot $_s (worker $MW dead)"
                  [ -n "${MH:-}" ] && kill "$MH" 2>/dev/null || true
                  rm -f "$_mf"
                fi
              fi
              # Markerless PPID-1 orphan on this slot = a pre-guard `sleep` holder: our live
              # holders always keep a marker, and a still-waiting new holder has a live
              # parent, so PPID==1 + no marker is unambiguously dead.
              if [ ! -f "$_mf" ] && command -v fuser >/dev/null 2>&1; then
                for _q in $(fuser "${LOCK}.${_s}" 2>/dev/null | tr -d ' '); do
                  _qp="$(ps -o ppid= -p "$_q" 2>/dev/null | tr -d ' ' || true)"
                  if [ "${_qp:-0}" = 1 ]; then
                    echo "heavy-leg sweep: reaping markerless PPID-1 orphan pid $_q on slot $_s"
                    kill "$_q" 2>/dev/null || true
                  fi
                done
              fi
              _s=$((_s+1))
            done
          fi

          # --- find the runner-worker so the holder can die with the job ---
          WORKER=""
          _p=$$
          while [ "${_p:-1}" -gt 1 ]; do
            case "$(ps -o comm= -p "$_p" 2>/dev/null || true)" in
              Runner.Worker*) WORKER="$_p"; break ;;
            esac
            _p="$(ps -o ppid= -p "$_p" 2>/dev/null | tr -d ' ' || true)"
            [ -z "${_p:-}" ] && break
          done

          # --- spawn the holder: first-free across SLOTS, holds its fd for the job's life ---
          # Each slot opens on fd (8+slot); slot 1 -> fd 9 (as before). The held fd is
          # closed (N>&-) in the sleep child so a kill of this bash frees the slot at once.
          # The holder exits when the runner-worker dies, or at TTL, whichever is first; if
          # the worker could not be found it falls back to a pure TTL ceiling.
          env LOCK="$LOCK" HOLDERFILE="$HOLDERFILE" ACQ="$ACQ" WAIT="$WAIT" TTL="$TTL" SLOTS="$SLOTS" WORKER="$WORKER" \
          bash -c '
            _s=1
            while [ "$_s" -le "$SLOTS" ]; do
              _fd=$((8+_s))
              eval "exec ${_fd}>\"\${LOCK}.\${_s}\"" || exit 1
              _s=$((_s+1))
            done
            _held_fd=""
            _deadline=$(( SECONDS + WAIT ))
            while [ "$SECONDS" -lt "$_deadline" ]; do
              _s=1
              while [ "$_s" -le "$SLOTS" ]; do
                _fd=$((8+_s))
                if flock -n "$_fd"; then _held_fd="$_fd"; break; fi
                _s=$((_s+1))
              done
              [ -n "$_held_fd" ] && break
              sleep 3
            done
            [ -z "$_held_fd" ] && exit 1
            _held_slot=$(( _held_fd - 8 ))
            printf "%s %s\n" "$$" "${WORKER:-0}" > "${HOLDERFILE}.${_held_slot}"
            echo "$_held_slot" > "$ACQ"
            _end=$(( SECONDS + TTL ))
            while [ "$SECONDS" -lt "$_end" ]; do
              if [ -n "$WORKER" ] && ! kill -0 "$WORKER" 2>/dev/null; then break; fi
              eval "sleep 15 ${_held_fd}>&-"
            done
            rm -f "${HOLDERFILE}.${_held_slot}"
          ' </dev/null >/dev/null 2>&1 &
          HOLDER=$!
          disown "$HOLDER" 2>/dev/null || true
          echo "HEAVY_LEG_LOCK_HOLDER=$HOLDER" >> "${GITHUB_ENV:-/dev/null}"

          # --- wait for the acquire handshake ---
          while kill -0 "$HOLDER" 2>/dev/null && [ ! -s "$ACQ" ]; do
            sleep 2
          done
          if [ ! -s "$ACQ" ]; then
            echo "::error::per-host heavy-leg lock: all $SLOTS slots busy for $((WAIT/60)) min on ${RUNNER_NAME:-?} -- blocked by live long holders, not this diff"
            _s=1
            while [ "$_s" -le "$SLOTS" ]; do
              echo "  slot $_s (${LOCK}.${_s}):"
              if command -v fuser >/dev/null 2>&1; then
                for _q in $(fuser "${LOCK}.${_s}" 2>/dev/null | tr -d ' '); do
                  # pid ppid age(etimes,s) comm -- names the live holder blocking this slot
                  echo "    holder [pid ppid age_s comm]: $(ps -o pid=,ppid=,etimes=,comm= -p "$_q" 2>/dev/null | tr -s ' ')"
                done
              fi
              if [ -f "${HOLDERFILE}.${_s}" ]; then
                echo "    marker (holderpid workerpid): $(cat "${HOLDERFILE}.${_s}" 2>/dev/null)"
              else
                echo "    marker: (none)"
              fi
              _s=$((_s+1))
            done
            exit 1
          fi
          _got="$(cat "$ACQ" 2>/dev/null)"
          rm -f "$ACQ"
          echo "heavy-leg lock acquired on ${RUNNER_NAME:-?} slot ${_got:-?}/$SLOTS (holder pid $HOLDER, worker ${WORKER:-none})"
      - uses: actions/checkout@v6

      # Per-job Conan home under $RUNNER_TEMP so concurrent jobs on the shared
      # self-hosted host never tear each other's cache (root of the boost
      # torn-cache reds). Export via $GITHUB_ENV -- a job-level `env: runner.temp`
      # fails to parse.
      - name: Set per-job Conan home
        run: |
          # github-hosted: ephemeral per-job home, warmed by actions/cache below.
          # self-hosted:   PERSISTENT home keyed on the runner instance. A runner
          # executes one job at a time, so this home is never contended (no
          # sqlite "failed to acquire database lock in 20s") while still keeping
          # the per-job isolation of #704/#710 -- no two concurrent jobs share it.
          # Being persistent, it also takes the GH cache-service restore off the
          # hot path: that restore times out on VM905 ("Failed to restore: The
          # operation cannot be completed in timeout") and its miss cascaded into
          # a cold from-source Boost rebuild on all 8 runners at once.
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            echo "CONAN_HOME=$RUNNER_TEMP/conan2" >> "$GITHUB_ENV"
          else
            echo "CONAN_HOME=$HOME/.conan2-ci/$RUNNER_NAME" >> "$GITHUB_ENV"
          fi

      - name: Install system dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ ccache cmake make libleveldb-dev libsecp256k1-dev

      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }

      - name: Install Conan 2
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            pip install "conan>=2.0,<3.0"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            conan --version   # pre-provisioned at /usr/local/bin on self-hosted
          fi

      # Prefer the LAN Conan mirror when it answers the probe; conancenter stays
      # as the fallback and is never removed, so an unreachable mirror is a
      # no-op. Cuts a fresh runner's cold bootstrap from a measured 1554 s
      # (170.7 MB Boost tarball over the WAN + from-source build) to ~2 s.
      - name: Prefer LAN Conan remote
        run: bash ci/conan/lan-remote.sh

      - name: Detect Conan profile
        run: |
          conan profile detect --force
          sed -i 's/compiler.cppstd=.*/compiler.cppstd=20/' "$(conan profile path default)"

      - name: Restore Conan cache (github-hosted only)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/conan2
          key: conan2-ubuntu24-gcc13-asan-${{ hashFiles('conanfile.txt') }}

      # Self-hosted runners reuse the workspace across runs; a stale build_asan/
      # leaves gtest_discover_tests POST_BUILD artifacts that ctest then
      # includes as empty/placeholder files ("Unknown CMake command
      # gtest_discover_tests_impl", ctest exit 8). Wipe it for a clean
      # configure+discovery. ccache (in ~/.cache/ccache) keeps recompiles fast.
      - name: Clean stale build dir (self-hosted workspace is reused)
        if: runner.environment != 'github-hosted'
        run: rm -rf build_asan

      # Conan prime: the ONLY step here that reaches out to conancenter; bounded
      # retry+backoff warms the cache, the install below runs --no-remote.
      - name: Conan prime (only conancenter egress)
        run: |
          for attempt in 1 2 3; do
            if conan install . --build=missing --output-folder=build_asan --settings=build_type=Release; then exit 0; fi
            echo "conan prime failed (attempt $attempt/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "conan prime failed after 3 attempts" >&2
          exit 1

      - name: Conan install (offline; --no-remote)
        run: conan install . --build=missing --output-folder=build_asan --settings=build_type=Release -nr

      - name: Configure (Release + AsAN + UBSan)
        # NOTE 1: must match the build_type passed to `conan install` (Release).
        # Conan generates `*-Target-release.cmake` with INTERFACE_INCLUDE_DIRECTORIES
        # wrapped in $<$<CONFIG:Release>:...>, so a mismatched cmake build type
        # (e.g. RelWithDebInfo) silently drops every conan dep's include path.
        # We get full optimization + debug symbols via -g in CXX_FLAGS.
        #
        # NOTE 2: -fno-sanitize=vptr disables the UBSan vptr check, which would
        # require leveldb (and other foreign polymorphic types) to expose their
        # typeinfo. leveldb is built without that, causing "undefined reference
        # to typeinfo for leveldb::DB" link errors. All other UBSan checks
        # remain on.
        run: |
          cmake -S . -B build_asan \
            -DCMAKE_TOOLCHAIN_FILE=build_asan/conan_toolchain.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCOIN_DGB=ON \
            -DC2POOL_GOLDEN_RESOLVED_CONFIG_GATE=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer -fno-sanitize-recover=undefined -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr"

      - name: Heavy-leg disk headroom guard (+ bounded prune)
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/heavy-disk-guard

      - name: Build c2pool + tests
        run: |
          cmake --build build_asan \
            --target c2pool \
                    coin_peer_rearm_kat \
                    boost_sentinel \
                    test_hardening test_share_messages \
                    test_redistribute_address test_redistribute test_auto_ratchet \
                    test_stratum_extensions test_stratum_hotel_interim test_btc_underfill_guard test_dgb_underfill_guard \
                    core_test sharechain_test share_test btc_share_test \
                    test_threading test_weights \
                    test_header_chain test_mempool test_template_builder \
                    test_doge_chain test_compact_blocks test_dash_x11_kat \
                    test_dash_header_chain test_dash_block_replay test_dash_conformance test_dash_subsidy test_dash_mempool test_dash_simplifiedmns test_dash_quorum test_dash_quorum_root test_dash_mn_state test_dash_embedded_gbt test_dash_underfill_guard test_dash_smldiff test_dash_p2p_messages test_dash_p2p_connection test_dash_p2p_node test_dash_node_interface test_dash_config test_dash_broadcaster test_dash_broadcaster_full test_dash_share_hash_link test_dash_block_relay test_dash_rpc_request test_dash_rpc_conf test_dash_block_producer test_dash_embedded_relay_e2e test_dash_block_relay_plan test_dash_version_activation_latch test_dash_embedded_startup_invariant test_dash_block_relay_binding test_dash_block_relay_dual_arm test_dash_coinbase_parity test_dash_coinbase_muldiv test_dash_donation_combined test_dash_g3_assembled test_dash_work_target test_dash_work_job_targets test_dash_stratum_binding test_dash_job_notify_roundtrip test_dash_cb_payee test_dash_stratum_notify_roundtrip test_dash_poolnode_messages test_dash_peer test_dash_share_tracker test_dash_node test_dash_share_messages test_dash_stratum_extranonce_split test_dash_stratum_submit_reassembly test_dash_difficulty_parity test_dash_auto_ratchet test_dash_min_protocol_gate test_dash_serve_gate_journal test_dash_work_source test_dash_node_coin_state test_dash_bestcl_gate test_dash_coin_state_maintainer test_dash_node_embedded_wire test_dash_node_reception_wire test_dash_get_work test_dash_stratum_work_source test_dash_superblock test_dash_oracle_byte_parity test_dash_chainlock_verify test_dash_isdlock test_dash_dashd_cut_arm test_dash_dstx test_dash_featured_node test_dash_sml_simd_sha256 dash_hdr_backfill_window_kat dial_lifetime_guard_kat test_reward_safe_file test_settings_cli_scan test_config_endpoint bip110_blake2b_kat bip110_m2_workshape_kat bip110_m3_serving_kat bip110_broadcaster_kat bip110_peer_info_snapshot_kat bip110_peer_discovery_kat bip110_dial_lifetime_realnode_kat bip110_broadcaster_slot_lifetime_kat bip110_coin_subver_brand_kat bip110_inbound_listener_kat bip110_coin_reachability_kat bip110_pool_identity_kat bip110_download_retry_kat bip110_pool_sharechain_compile bip110_pool_node_compile bip110_pool_mint_kat bip110_extend_mint_kat bip110_pool_hashrate_kat bip110_multiminer_pplns_kat bip110_current_payouts_kat bip110_sharechain_window_kat bip110_serve_xcheck_kat bip110_local_mint_verify_kat bip110_persistence_roundtrip_kat bip110_dial_lifetime_guard_kat bip110_explorer_getblock_kat bip110_explorer_retention_kat bip110_share_detail_kat \
                    test_hash_link test_decay_pplns \
                    test_pplns_consensus \
                    test_v36_script_sorting test_v36_cross_impl_refhash \
                    test_phase4_embedded \
                    test_mweb_builder ltc_g3a_populated_test \
                    test_address_resolution test_compute_share_target test_web_honesty_regression test_ltc_work_target \
                    test_utxo test_dgb_subsidy test_dgb_coinbase_value dgb_share_test dgb_redistribute_test dgb_block_assembly_test dgb_witness_commitment_test dgb_header_sample_build_test dgb_header_ingest_test dgb_mempool_ingest_test \
                    dgb_gentx_coinbase_test dgb_connection_coinbase_test dgb_won_block_serialize_test dgb_pplns_payout_split_test nmc_auxpow_merkle_test nmc_template_builder_test nmc_underfill_guard_test nmc_auxpow_wire_test nmc_reconstruct_won_block_test nmc_mempool_name_test nmc_block_broadcast_test nmc_host_dualpath_test nmc_fallback_path_conformance_test nmc_header_sync_golden_test dgb_gentx_share_path_test dgb_conn_pplns_producer_test dgb_other_tx_resolver_test \
                    dgb_other_tx_assembler_test dgb_reconstruct_won_block_test dgb_reconstruct_closure_test dgb_gentx_unpack_test dgb_work_source_test dgb_template_builder_test dgb_embedded_coin_node_test dgb_live_node_status_test dgb_embedded_tx_select_test dgb_template_other_txs_test dgb_coinbase_value_parity_test dgb_submit_classify_test dgb_aux_parent_coinbase_parity_test dgb_template_capture_test dgb_aux_doge_db_commitment_bind_test dgb_aux_doge_mm_commitment_test dgb_aux_doge_dc_proof_test dgb_aux_doge_bind_parsers_test dgb_compact_blocks_bip152_parity_test dgb_aux_dual_target_select_test dgb_aux_broadcast_path_election_test dgb_aux_doge_submit_test dgb_aux_doge_embed_livewire_test dgb_aux_doge_dc_layout_verifier_test dgb_aux_doge_coinbase_commit_test dgb_aux_doge_residency_test \
                    rpc_request_test softfork_check_test genesis_check_test algo_select_test digishield_walk_test multishield_v4_kat_test header_chain_test \
                    dgb_coin_node_seam_test dgb_block_broadcast_test dgb_won_block_dispatch_test dgb_forced_won_share_dualpath_test dgb_scrypt_pow_test dgb_nonce_grinder_test dgb_regrind_block_test dgb_won_block_finalize_test dgb_share_target_genesis_test dgb_share_target_retarget_test dgb_share_bits_oracle_pin_test dgb_pool_msg_wire_test dgb_get_shares_walk_test dgb_download_stops_test dgb_think_p1_walk_bounds_test dgb_think_p1_desired_emit_test dgb_think_p6_desired_cutoff_test dgb_think_p4_head_keys_test dgb_think_p3_best_head_test dgb_g1_oracle_byte_parity_test dgb_think_p2_walk_bounds_test dgb_expected_time_to_block_test dgb_tail_score_endpoints_test dgb_pool_attempts_per_second_test dgb_pool_efficiency_test dgb_think_p5_best_share_punish_test dgb_auto_ratchet_tail_guard_test dgb_auto_ratchet_sim_test dgb_binomial_conf_interval_test dgb_desired_version_tally_test dgb_min_protocol_ratchet_test dgb_get_height_and_last_endpoints_test dgb_chain_walk_window_test dgb_redistribute_delegate_ghal_test dgb_share_weight_decay_test dgb_naughty_propagation_test dgb_hash_format_parity_test dgb_emergency_decay_saturation_test dgb_arith256_muldiv_kat_test dgb_share_tx_relay_refs_test dgb_coin_peer_rearm_test test_coin_broadcaster test_multiaddress_pplns test_pplns_stress \
                    v37_test v37_executor_test v37_scaffold_test v37_w2_ingestion_test v37_w4_prereq_test v37_w4_settlement_test v37_w5_coinbase_test v37_w3_relay_test v37_subthreshold_estimator_test v37_w6_persistence_test c2pool-v37-w6-leveldb-compile-check v37_w4_estimator_wiring_test v37_xmr_node_smoke \
                    v37_descriptor_xmr_test \
                    v37_xmr_canon_p1_kat \
                    xmr_primitives_selfcheck xmr_x2_node_kat xmr_receipt_kat xmr_torsion_kat xmr_wire_dos_check xmr_stratum_selftest xmr_provenance_gate \
                    xmr_crypto_kats xmr_ed25519_derivation_kat xmr_difficulty_kat xmr_coinbase_kat xmr_goldens_kat xmr_e2e_kat xmr_miner_block_path_smoke \
            -j4  # ASan+UBSan: cc1plus RSS ~2-3GB each; -j8 wedged runner cgroup memory.high (throttle-hang). -j4 caps peak <12G.
                 # xmr_provenance_gate: previously omitted here because
                 # -fsanitize=undefined rejected its constexpr pointer comparison
                 # (kManifest[i].upstream == &kP2pool). Fixed by replacing the
                 # Upstream* identity compare with a value-typed UpstreamId enum tag
                 # in xmr_provenance.hpp; the gate now builds and runs clean under
                 # ASan+UBSan too, in addition to the non-sanitized "Build tests" leg.

      - name: Run tests under sanitizers
        working-directory: build_asan
        env:
          ASAN_OPTIONS: detect_leaks=0:check_initialization_order=1:strict_string_checks=1:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        # --no-tests=error: per-binary zero-test floor. If the exclude ever
        # swallows every case (or the tests fail to register), ctest REDs
        # instead of greening over an empty run.
        run: ctest --output-on-failure --no-tests=error -j8 --exclude-regex "LiveTest\."

      - name: Upload sanitizer test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with: { name: test-results-linux-asan, path: build_asan/Testing/, retention-days: 7 }

      # Steady-state disk hygiene on the VM905 self-hosted runners: drop the
      # checkout payload and _temp, keep _actions/_tool/_update. Always runs.
      - name: Prune runner workspace
        if: always()
        uses: ./.github/actions/prune-runner-workspace

      - name: Release per-host heavy-leg lock
        if: always() && runner.environment != 'github-hosted'
        shell: bash
        run: |
          H="${HEAVY_LEG_LOCK_HOLDER:-}"
          if [ -n "$H" ]; then
            kill "$H" 2>/dev/null || true
            # drop whichever per-slot marker this holder owns
            for MF in "${HEAVY_LEG_HOLDERFILE:-/tmp/c2pool-heavy-leg.holder}".*; do
              [ -f "$MF" ] || continue
              read -r _mh _ < "$MF" 2>/dev/null || true
              [ "${_mh:-}" = "$H" ] && rm -f "$MF" || true
            done
          fi
  # ════════════════════════════════════════════════════════════════════════════
  # COIN_BCH leg — Bitcoin Cash (SHA256d standalone parent, V36)
  #
  # Dedicated per-coin leg (integrator 2026-06-19 decision). build.yml previously
  # configured ONLY -DCOIN_DGB=ON, so the 15 bch_ M5 targets never compiled and a
  # gh rollup reported GREEN while exercising ZERO BCH — a false-green merge gate
  # (the DGB #137 NOT_BUILT shape, but 15 targets, not one). Coin flags are
  # additive independent if() guards (no mutual-exclusion), so -DCOIN_BCH=ON
  # composes with COIN_DGB in one configure — but BCH ships its own c2pool-bch
  # binary + its own 15 test targets, so a separate configure/leg is the clean
  # per-coin signal: a BCH break reads as "COIN_BCH leg red," not buried in DGB.
  # Mirrors the DGB linux/linux-asan coverage. Does NOT relax the per-coin
  # source-presence guards (PR #47). ctest scoped to ^bch_ (network-free; the
  # live VM300 IBD path lives in the c2pool-bch --ibd harness, not in ctest).
  # ════════════════════════════════════════════════════════════════════════════
  coin-bch:
    name: COIN_BCH Linux x86_64
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","c2pool-build"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6

      # Per-job Conan home under $RUNNER_TEMP so concurrent jobs on the shared
      # self-hosted host never tear each other's cache (root of the boost
      # torn-cache reds). Export via $GITHUB_ENV -- a job-level `env: runner.temp`
      # fails to parse.
      - name: Set per-job Conan home
        run: |
          # github-hosted: ephemeral per-job home, warmed by actions/cache below.
          # self-hosted:   PERSISTENT home keyed on the runner instance. A runner
          # executes one job at a time, so this home is never contended (no
          # sqlite "failed to acquire database lock in 20s") while still keeping
          # the per-job isolation of #704/#710 -- no two concurrent jobs share it.
          # Being persistent, it also takes the GH cache-service restore off the
          # hot path: that restore times out on VM905 ("Failed to restore: The
          # operation cannot be completed in timeout") and its miss cascaded into
          # a cold from-source Boost rebuild on all 8 runners at once.
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            echo "CONAN_HOME=$RUNNER_TEMP/conan2" >> "$GITHUB_ENV"
          else
            echo "CONAN_HOME=$HOME/.conan2-ci/$RUNNER_NAME" >> "$GITHUB_ENV"
          fi

      - name: Install system dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ ccache cmake make libleveldb-dev libsecp256k1-dev

      - uses: actions/setup-python@v6
        with: { python-version: 3.12 }

      - name: Install Conan 2
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            pip install "conan>=2.0,<3.0"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            conan --version   # pre-provisioned at /usr/local/bin on self-hosted
          fi

      # Prefer the LAN Conan mirror when it answers the probe; conancenter stays
      # as the fallback and is never removed, so an unreachable mirror is a
      # no-op. Cuts a fresh runner's cold bootstrap from a measured 1554 s
      # (170.7 MB Boost tarball over the WAN + from-source build) to ~2 s.
      - name: Prefer LAN Conan remote
        run: bash ci/conan/lan-remote.sh

      - name: Detect Conan profile
        run: |
          conan profile detect --force
          sed -i 's/compiler.cppstd=.*/compiler.cppstd=20/' "$(conan profile path default)"

      - name: Restore Conan cache (github-hosted only)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/conan2
          key: conan2-ubuntu24-gcc13-bch-${{ hashFiles('conanfile.txt') }}

      # Self-hosted runners reuse the workspace across runs; a stale build_bch/
      # leaves gtest_discover_tests POST_BUILD artifacts that ctest then
      # includes as empty/placeholder files ("Unknown CMake command
      # gtest_discover_tests_impl", ctest exit 8). Wipe it for a clean
      # configure+discovery. ccache (in ~/.cache/ccache) keeps recompiles fast.
      - name: Clean stale build dir (self-hosted workspace is reused)
        if: runner.environment != 'github-hosted'
        run: rm -rf build_bch

      # Conan prime: the ONLY step here that reaches out to conancenter; bounded
      # retry+backoff warms the cache, the install below runs --no-remote.
      - name: Conan prime (only conancenter egress)
        run: |
          for attempt in 1 2 3; do
            if conan install . --build=missing --output-folder=build_bch --settings=build_type=Release; then exit 0; fi
            echo "conan prime failed (attempt $attempt/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "conan prime failed after 3 attempts" >&2
          exit 1

      - name: Conan install (offline; --no-remote)
        run: conan install . --build=missing --output-folder=build_bch --settings=build_type=Release -nr

      - name: Configure (-DCOIN_BCH=ON)
        run: cmake -S . -B build_bch -DCMAKE_TOOLCHAIN_FILE=build_bch/conan_toolchain.cmake -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DCOIN_BCH=ON

      - name: Build c2pool-bch binary
        run: cmake --build build_bch --target c2pool-bch -j8

      - name: Build BCH test targets
        run: |
          cmake --build build_bch \
            --target bch_abla_floor_invariant_test bch_abla_block_feed_test \
                    bch_abla_block_feed_gap_test bch_header_sync_test \
                    bch_header_sync_progress_test bch_block_download_test \
                    bch_idle_watchdog_kat_test \
                    bch_seed_tier_kat_test \
                    bch_sharechain_bootstrap_test \
                    bch_graph_db_shutdown_persist_test \
                    bch_known_txs_evict_wiring_test \
                    bch_found_block_verify_test \
                    bch_seed_tier_recovery_gate_test \
                    bch_genesis_conformance_test bch_abla_growth_soak_test \
                    bch_coinbase_kat_segwit_predicate_test \
                    bch_coinbase_kat_bytevector_test \
                    bch_coinbase_author_kat_test \
                    bch_donation_flip_kat_test \
                    bch_cashtokens_transparency_test \
                    bch_cashaddr_kat_test \
                    bch_share_tx_refs_kat_test \
                    bch_share_remove_owns_data_test \
                    bch_restart_reorg_supersede_test \
                    bch_block_connector_test bch_block_ordering_test \
                    bch_utxo_connect_test bch_reorg_connect_test bch_reorg_rerequest_test \
                    bch_compact_block_connector_test \
                    bch_embedded_daemon_assembly_test \
                    bch_embedded_getwork_test bch_embedded_seam_workview_test \
                    bch_embedded_block_broadcast_test bch_coin_node_seam_test \
                    bch_asert_kat_test \
                    bch_muldiv_kat_test \
                    bch_g1_oracle_byte_parity_test bch_g1_share_serialization_parity_test bch_g0_canonical_pin_test bch_g2_ratchet_gate_kat_test test_bch_underfill_guard \
                    bch_g2_block_assembly_roundtrip_test \
                    bch_dashboard_pplns_current_test \
            -j8

      - name: Run BCH tests
        working-directory: build_bch
        # --no-tests=error: per-binary zero-test floor. A `-R "^bch_"` that
        # selects nothing (targets renamed / failed to register) must RED,
        # not green over an empty selection.
        run: ctest --output-on-failure --no-tests=error -j8 -R "^bch_"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with: { name: test-results-coin-bch, path: build_bch/Testing/, retention-days: 7 }

      # Steady-state disk hygiene on the VM905 self-hosted runners: drop the
      # checkout payload and _temp, keep _actions/_tool/_update. Always runs.
      - name: Prune runner workspace
        if: always()
        uses: ./.github/actions/prune-runner-workspace

  # ════════════════════════════════════════════════════════════════════════════
