name: Release matrix

# V36 ship packaging (integrator dispatch 2026-06-10): one workflow builds
# every coin binary on every platform at tag time and emits a single
# SHA256SUMS, matching the v0.1.x-alpha release shape
# (c2pool-<coin>-<version>-<platform>.{tar.gz,zip} + SHA256SUMS).
#
# Coins: btc, ltc (carries doge merged-mining aux — no separate doge
# binary), dgb, dash, bch, bip110 (Bitcoin Knots BLAKE2b hard fork —
# standalone lane, no BLS/aux, no per-coin configure flag). Each
# coin×platform cell gates on source presence (same entrypoint gate as
# coin-matrix.yml: the real entrypoint src/c2pool/main_<coin>.cpp, not
# src/impl/<coin>/main — see PR #66) and every matrix is fail-fast:false,
# so one red coin never blocks the other coins' packages. This implements
# the ship decouple: a red btc cell still lets ltc/dash/doge/dgb/bch package.
#
# macOS: ships UNIVERSAL (arm64+x86_64) at tag time (operator decision
# 2026-06-11). Both slices build on the Apple Silicon build host (operator
# decision 2026-11-13: the Intel build runner is retired). arm64 is a native
# build; x86_64 is cross-compiled there (Conan host profile arch=x86_64, build
# profile armv8) and started under Rosetta 2 before it ships. Both slices link
# the same pinned libraries (conanfile.txt + conan.lock, plus
# scripts/ci/build_macos_deps.sh); no Homebrew library is linked. The
# macos-universal job lipo-merges the per-arch binary and every bundled dylib
# into the single universal package that ships. See docs/ci-macos.md.
#
# Triggers: tags only, plus workflow_dispatch for a full-matrix dry run
# from any ref. PR-time per-coin coverage stays in coin-matrix.yml; this
# workflow is intentionally NOT wired to pull_request (15 cells).
#
# Publishing: the checksums job assembles all packages and, on tags,
# creates a DRAFT GitHub release. Publishing the draft is a manual
# operator action — CI never publishes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for package names (e.g. 0.2.0). Blank = derive from ref."
        required: false
        default: ""
      coins:
        description: "JSON array of coins to build (e.g. [\"ltc\"]). Blank = all six."
        required: false
        default: ""
      force-github-hosted:
        description: "Route every lane to GitHub-hosted runners (fresh default-boost per run). Set true for release builds that must dodge the self-hosted cppstd=20 spirit::x3 boost issue."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Fail-fast on a stalled git HTTP transfer instead of hanging to the job
  # timeout. Our WAN uplink stalls ~12% of codeload fetches (they neither
  # finish nor error out); aborting a sub-1000 B/s transfer after 20s lets
  # actions/checkout built-in 3-attempt fetch retry recover in ~1 min.
  GIT_HTTP_LOW_SPEED_LIMIT: '1000'
  GIT_HTTP_LOW_SPEED_TIME: '20'

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Linux x86_64 (Ubuntu 24.04, GCC 13, Conan) — one cell per coin
  # ════════════════════════════════════════════════════════════════════════════
  linux:
    name: ${{ matrix.coin }} package (Linux x86_64)
    runs-on: ${{ inputs.force-github-hosted != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","c2pool-build"]') || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        coin: ${{ fromJSON(github.event.inputs.coins || '["btc","ltc","dgb","dash","bch","bip110"]') }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check source presence
        id: presence
        run: |
          if [ -f "src/c2pool/main_${{ matrix.coin }}.cpp" ] && [ -d "src/impl/${{ matrix.coin }}" ]; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            echo "::notice::c2pool-${{ matrix.coin }} source present — packaging."
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
            echo "::warning::c2pool-${{ matrix.coin }} source not on this ref — no ${{ matrix.coin }} Linux package will be produced."
          fi

      # Per-coin-cell Conan home; RUNNER_TEMP is step-scope only, so export via
      # $GITHUB_ENV (job-level `env: runner.temp` fails to parse). See build.yml.
      - name: Set per-job Conan home
        run: echo "CONAN_HOME=$RUNNER_TEMP/conan2" >> "$GITHUB_ENV"

      - name: Install system dependencies
        # github-hosted ONLY: the c2pool-build self-hosted host has these libs
        # (and conan, cmake, g++) baked in / persisted from prior runs, exactly
        # like conan at /usr/local/bin below. Running sudo apt there is both
        # redundant AND fatal when the runner has no passwordless sudo ("sudo: a
        # terminal is required to authenticate", run 33596952781) -- so skip apt
        # on self-hosted entirely and only provision fresh github-hosted VMs.
        if: steps.presence.outputs.exists == '1' && runner.environment == 'github-hosted'
        # Serialize apt across the concurrent coin package jobs sharing the one
        # host. Without this, the Linux matrix cells race on
        # /var/lib/apt/lists/lock (and corrupt srcpkgcache.bin), and the loser
        # fails before the build starts (e.g. LTC on v0.2.0, run 29148852306).
        # flock on a host-wide lock makes apt atomic; on github-hosted runners
        # the lock is per-VM and uncontended, so no-op.
        run: |
          exec {lockfd}>/tmp/c2pool-apt.lock
          flock "$lockfd"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make libleveldb-dev libsecp256k1-dev

      - uses: actions/setup-python@v6
        if: steps.presence.outputs.exists == '1'
        with: { python-version: '3.12' }

      - name: Install Conan 2
        if: steps.presence.outputs.exists == '1'
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            pip install "conan>=2.0,<3.0"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            conan --version   # pre-provisioned at /usr/local/bin on self-hosted
          fi

      - name: Show committed Conan profile
        if: steps.presence.outputs.exists == '1'
        run: conan profile show -pr:a=ci/conan/linux-gcc13.profile

      - name: Restore Conan cache
        if: steps.presence.outputs.exists == '1'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/conan2
          key: conan2-ubuntu24-gcc13-${{ matrix.coin }}-${{ hashFiles('conanfile.txt', 'ci/conan/linux-gcc13.profile', 'conan.lock') }}
          restore-keys: |
            conan2-ubuntu24-gcc13-${{ matrix.coin }}-
            conan2-ubuntu24-gcc13-

      - name: Conan install
        if: steps.presence.outputs.exists == '1'
        run: |
          conan install . \
            -pr:a=ci/conan/linux-gcc13.profile \
            --lockfile=conan.lock \
            --build=missing \
            --output-folder=build_${{ matrix.coin }}

      # DASH cell only: build/reuse the pinned dashbls prefix and export
      # DASHBLS_ROOT, so the configure below links the REAL BLS12-381 verifier.
      # Without this the packaged c2pool-dash carries the fail-closed stub and
      # can never serve a real type-6 quorum commitment in the field.
      - name: Provision dashbls (DASH only)
        if: steps.presence.outputs.exists == '1' && matrix.coin == 'dash'
        uses: ./.github/actions/provision-dashbls

      - name: Configure
        if: steps.presence.outputs.exists == '1'
        run: |
          # Per-coin extra flags. A case, not `[ ... ] && VAR=`, because the
          # step runs under `bash -e` and a false test on the last line would
          # fail the step.
          #
          # DGB ships the -DAUX_DOGE=ON build: DGB parent + embedded DOGE aux as ONE
          # binary, the direct parallel to c2pool-ltc carrying DOGE. Merged-mining
          # path per #603/#614/#589/#395.
          #
          # DASH ships -DC2POOL_DASH_BLS=ON: the E1 Phase-L quorum-commitment
          # verifier linked against dash's own dashbls at the pinned tag. The
          # option is a HARD requirement -- cmake FATAL_ERRORs when the library
          # is missing -- so this cell cannot quietly package a BLS-dark binary.
          EXTRA=""
          case "${{ matrix.coin }}" in
            dgb)  EXTRA="-DAUX_DOGE=ON" ;;
            dash) EXTRA="-DC2POOL_DASH_BLS=ON -DDASHBLS_ROOT=$DASHBLS_ROOT" ;;
          esac
          cmake -S . -B build_${{ matrix.coin }} \
            -DCMAKE_TOOLCHAIN_FILE=build_${{ matrix.coin }}/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            $EXTRA

      # Boost header-integrity + version gate: a torn/mixed Boost tree or an
      # apt-Boost fallback fails HERE (fast, one TU), not deep in the coin
      # packaging build. Same gate build.yml runs. See ci-boost-stream.md.
      - name: Boost sentinel
        if: steps.presence.outputs.exists == '1'
        run: |
          cmake --build build_${{ matrix.coin }} --target boost_sentinel -j"${BUILD_J:-4}"
          ctest --test-dir build_${{ matrix.coin }} -R '^boost_sentinel$' --output-on-failure

      - name: Build c2pool-${{ matrix.coin }}
        if: steps.presence.outputs.exists == '1'
        run: cmake --build build_${{ matrix.coin }} --target c2pool-${{ matrix.coin }} -j"${BUILD_J:-4}"

      - name: Smoke test (--help)
        if: steps.presence.outputs.exists == '1'
        run: |
          BIN=build_${{ matrix.coin }}/src/c2pool/c2pool-${{ matrix.coin }}
          file "$BIN"
          "$BIN" --help 2>&1 | head -5 || true

      # Positive assertion on the ARTEFACT, not on the flags: the freshly built
      # (unstripped) c2pool-dash must actually carry the dashbls backend.
      - name: BLS link guard (pre-strip)
        if: steps.presence.outputs.exists == '1' && matrix.coin == 'dash'
        run: bash scripts/ci/dash_bls_linked_guard.sh build_dash/src/c2pool/c2pool-dash

      - name: Package
        if: steps.presence.outputs.exists == '1'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          COIN="${{ matrix.coin }}"
          PKG="c2pool-${COIN}-${VERSION}-linux-x86_64"
          mkdir -p "${PKG}/lib" "${PKG}/config" "${PKG}/web-static" "${PKG}/explorer"
          cp "build_${COIN}/src/c2pool/c2pool-${COIN}" "${PKG}/"
          strip "${PKG}/c2pool-${COIN}"
          # Bundle the real runtime shared-library closure resolved from the freshly
          # built binary via ldd (SONAME-agnostic). v0.2.3 shipped every Linux tarball
          # DOA: this step hardcoded libsecp256k1.so.2 while the runner's
          # libsecp256k1-dev provides .so.1 — find matched nothing and the binary's
          # only dynamic non-glibc dependency went unbundled. Resolve, don't guess.
          ldd "${PKG}/c2pool-${COIN}" | awk '/=> \//{print $3}' | while read -r so; do
            case "$(basename "$so")" in
              libc.so*|libm.so*|libdl.so*|librt.so*|libpthread.so*|ld-linux*|libstdc++.so*|libgcc_s.so*|libresolv.so*) continue ;;
            esac
            cp -Lv "$so" "${PKG}/lib/"
          done
          cp start.sh "${PKG}/" && chmod +x "${PKG}/start.sh"
          cp "config/${COIN}/c2pool_mainnet.yaml" "${PKG}/config/c2pool_mainnet.yaml.example"
          cp "config/${COIN}/c2pool_testnet.yaml" "${PKG}/config/c2pool_testnet.yaml"
          # Fail-fast packaging tripwires (BUG A / BUG B regression guards):
          ls "${PKG}/lib/" | grep -q '^libsecp256k1\.so' || { echo "PKG-ASSERT FAIL: libsecp256k1 not bundled in ${PKG}/lib"; exit 1; }
          head -1 "${PKG}/config/c2pool_mainnet.yaml.example" | grep -qi "${COIN}" || { echo "PKG-ASSERT FAIL: ${PKG} config header does not identify ${COIN}"; exit 1; }
          cp -r web-static/* "${PKG}/web-static/"
          cp explorer/explorer.py "${PKG}/explorer/"
          tar czf "${PKG}.tar.gz" "${PKG}/"

      # ...and again on the STRIPPED binary that is actually inside the tarball
      # users download. The rodata leg of the guard survives strip, so this is a
      # true end-of-pipeline check rather than a restatement of the one above:
      # it would catch a packaging step that copied the wrong build tree.
      - name: BLS link guard (packaged artefact)
        if: steps.presence.outputs.exists == '1' && matrix.coin == 'dash'
        run: |
          PKG="c2pool-dash-${{ steps.ver.outputs.version }}-linux-x86_64"
          bash scripts/ci/dash_bls_linked_guard.sh "${PKG}/c2pool-dash"
          # libdashbls.a is static, but relic's ARITH backend is gmp, which
          # resolves to the SHARED libgmp.so.10 -- a runtime dependency the
          # BLS-off build did not have. The generic ldd bundling loop above
          # picks it up; assert it, in the same shape as the libsecp256k1
          # tripwire, so a dash tarball can never ship DOA on a host without
          # libgmp.
          case "$(ls "${PKG}/lib/")" in
            *libgmp.so*) echo "  ok   libgmp bundled" ;;
            *) echo "PKG-ASSERT FAIL: libgmp not bundled in ${PKG}/lib (BLS build needs it)"; exit 1 ;;
          esac

      - name: Upload package
        if: steps.presence.outputs.exists == '1'
        uses: actions/upload-artifact@v7
        with:
          name: pkg-linux-${{ matrix.coin }}
          path: c2pool-*-linux-x86_64.tar.gz

      # Steady-state disk hygiene on the VM905 self-hosted runners: drop the
      # checkout payload and _temp, keep _actions/_tool/_update. Always runs.
      - name: Prune runner workspace
        if: always()
        uses: ./.github/actions/prune-runner-workspace

  # ════════════════════════════════════════════════════════════════════════════
  # macOS universal (arm64 + x86_64) — operator decision 2026-06-11.
  # Both arches build on the Apple Silicon build host (c2pool-mac-arm; the
  # GitHub-hosted fallback is macos-14, also Apple Silicon). The Intel build
  # runner is retired (operator decision 2026-11-13). arm64 builds natively;
  # x86_64 is a cross build (Conan -s:h arch=x86_64, clang -arch x86_64) whose
  # binary is started under Rosetta 2 here and again in macos-universal.
  # Libraries: .github/actions/provision-macos-deps (Conan pins + static
  # secp256k1/gmp) for BOTH arches, so the slices never differ in versions.
  # The per-arch packages here are INTERMEDIATE artifacts (intermediate-macos-*,
  # deliberately not pkg-* so the checksums job skips them); the
  # macos-universal job lipo-merges them into the shipped package.
  # ════════════════════════════════════════════════════════════════════════════
  macos:
    name: ${{ matrix.coin }} ${{ matrix.arch }} (macOS build)
    runs-on: ${{ inputs.force-github-hosted != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","c2pool-mac-arm"]') || 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        coin: ${{ fromJSON(github.event.inputs.coins || '["btc","ltc","dgb","dash","bch","bip110"]') }}
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check source presence
        id: presence
        run: |
          if [ -f "src/c2pool/main_${{ matrix.coin }}.cpp" ] && [ -d "src/impl/${{ matrix.coin }}" ]; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
            echo "::warning::c2pool-${{ matrix.coin }} source not on this ref — no ${{ matrix.coin }} macOS ${{ matrix.arch }} package will be produced."
          fi

      - name: Set up Homebrew PATH
        # Homebrew supplies build TOOLS only (cmake, conan, autotools); the
        # runner service is started from launchd, whose PATH omits
        # /opt/homebrew/bin (#100: brew exit 127), so add it explicitly.
        run: |
          if [ -x /opt/homebrew/bin/brew ]; then
            echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          else
            echo "::error::Homebrew not found at /opt/homebrew on ${RUNNER_NAME:-runner} (an Apple Silicon host is required)" >&2
            exit 1
          fi

      # Every library both slices link, built for THIS arch from the same pins:
      # Conan (conanfile.txt + conan.lock; gtest included, for the DASH KATs)
      # and static secp256k1 + gmp. Exports CONAN_HOME, C2POOL_MACOS_DEPS and
      # C2POOL_CONAN_TOOLCHAIN for the configure below.
      - name: Provision macOS dependencies (${{ matrix.arch }})
        if: steps.presence.outputs.exists == '1'
        uses: ./.github/actions/provision-macos-deps
        with:
          arch: ${{ matrix.arch }}
          output-folder: build

      # DASH cell only: build/reuse dash's own src/dashbls at the pinned tag for
      # THIS arch (x86_64 is an autotools cross build; relic backend GMP on
      # arm64 and EASY on x86_64, the same split dashd's own macOS builds get)
      # and export
      # DASHBLS_ROOT, so the package links the REAL BLS12-381 verifier like the
      # Linux one.
      - name: Provision dashbls (DASH only)
        if: steps.presence.outputs.exists == '1' && matrix.coin == 'dash'
        uses: ./.github/actions/provision-dashbls
        with:
          arch: ${{ matrix.arch }}

      - name: Configure
        if: steps.presence.outputs.exists == '1'
        run: |
          # DGB: -DAUX_DOGE=ON -> DGB parent + embedded DOGE (mirrors c2pool-ltc).
          # DASH: -DC2POOL_DASH_BLS=ON is a HARD requirement (cmake FATAL_ERRORs
          # without the library), so this cell cannot package a BLS-dark binary.
          # CMAKE_IGNORE_PREFIX_PATH keeps find_library/find_package away from
          # Homebrew's arm64-only libraries (they would mis-link the x86_64
          # slice and make the two slices differ).
          EXTRA=""
          case "${{ matrix.coin }}" in
            dgb)  EXTRA="-DAUX_DOGE=ON" ;;
            dash) EXTRA="-DC2POOL_DASH_BLS=ON -DDASHBLS_ROOT=$DASHBLS_ROOT" ;;
          esac
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$C2POOL_CONAN_TOOLCHAIN" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_PREFIX_PATH="$C2POOL_MACOS_DEPS" \
            -DCMAKE_IGNORE_PREFIX_PATH="/opt/homebrew;/usr/local" \
            $EXTRA

      - name: Build c2pool-${{ matrix.coin }}
        if: steps.presence.outputs.exists == '1'
        run: cmake --build build --target c2pool-${{ matrix.coin }} -j"${BUILD_J:-4}"

      # The slice must be exactly this arch, and it must start: natively for
      # arm64, under Rosetta 2 for the cross-built x86_64 (a host without
      # Rosetta fails here rather than shipping an x86_64 slice nobody ran).
      - name: Arch check + smoke test (--help)
        if: steps.presence.outputs.exists == '1'
        run: |
          BIN=build/src/c2pool/c2pool-${{ matrix.coin }}
          file "$BIN"
          archs="$(lipo -archs "$BIN")"
          echo "lipo -archs $BIN: $archs"
          [ "$archs" = "${{ matrix.arch }}" ] || { echo "::error::$BIN is '$archs', expected ${{ matrix.arch }}"; exit 1; }
          bash scripts/ci/macos_slice_smoke.sh ${{ matrix.arch }} "$BIN"

      # Same three legs as the Linux DASH cell and build.yml's linux-dash-bls:
      # the artefact carries dashbls (rodata + symbols, pre-strip), the binary
      # names a REAL backend at startup, and the BLS-crypto KATs run green on
      # this arch's relic + gmp build.
      - name: BLS link guard + backend line (DASH, pre-strip)
        if: steps.presence.outputs.exists == '1' && matrix.coin == 'dash'
        run: |
          BIN=build/src/c2pool/c2pool-dash
          bash scripts/ci/dash_bls_linked_guard.sh "$BIN"
          arch -${{ matrix.arch }} "$BIN" --help > help.log 2>&1 || true
          line="$(grep -m1 'DASH BLS backend:' help.log || true)"
          echo "${{ matrix.arch }}: $line"
          case "$line" in
            *"DASH BLS backend: REAL"*) ;;
            *) echo "::error::c2pool-dash (${{ matrix.arch }}) does not report a REAL BLS backend"; exit 1 ;;
          esac

      - name: BLS KATs (DASH only)
        if: steps.presence.outputs.exists == '1' && matrix.coin == 'dash'
        run: |
          cmake --build build --target test_dash_bls_verify -j"${BUILD_J:-4}"
          # x86_64: the cross-built KAT binary runs under Rosetta 2.
          arch -${{ matrix.arch }} ./build/test/test_dash_bls_verify > bls_kat.log 2>&1 || { cat bls_kat.log; exit 1; }
          cat bls_kat.log
          log="$(cat bls_kat.log)"
          missing=0
          for t in \
            DashBlsVerify.SelfReportIsTruthful \
            DashBlsVerify.RealQuorumSigAcceptsAndTamperRejects \
            DashBlsVerify.BlsSmokeSignVerify \
            DashBlsVerify.VerifyFinalCommitmentSyntheticRoundTrip \
            DashBlsVerify.OpkeyPointEqIsSchemeFaithful
          do
            case "$log" in
              *"OK ] $t"*) echo "  ok   $t" ;;
              *) echo "  MISS $t did not report as run"; missing=1 ;;
            esac
          done
          [ "$missing" -eq 0 ] || { echo "::error::BLS KATs did not all run on ${{ matrix.arch }}"; exit 1; }

      - name: Stage per-arch package
        if: steps.presence.outputs.exists == '1'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          COIN="${{ matrix.coin }}"
          ARCH="${{ matrix.arch }}"
          PKG="c2pool-${COIN}-${VERSION}-macos-${ARCH}"
          mkdir -p "${PKG}/lib" "${PKG}/config" "${PKG}/web-static" "${PKG}/explorer"
          cp "build/src/c2pool/c2pool-${COIN}" "${PKG}/"
          # DASH: when this arch's relic uses the GMP backend (arm64; x86_64 uses
          # EASY, as dashd does, see provision-dashbls), gmp comes from the
          # static archive and must be inside the executable (unstripped build).
          if [ "$COIN" = dash ]; then
            arith="$(awk '$1=="#define" && $2=="ARITH" {print $3}' "$DASHBLS_ROOT/include/relic_conf.h")"
            echo "  relic ARITH backend ($ARCH): ${arith:-unknown}"
            if [ "$arith" = "GMP" ]; then
              # (no grep -q: under pipefail its early exit would SIGPIPE nm)
              if nm "build/src/c2pool/c2pool-${COIN}" | grep ' ___gmpn_' > /dev/null; then
                echo "  ok   gmp linked statically"
              else
                echo "PKG-ASSERT FAIL: relic uses GMP but c2pool-dash has no gmp symbols"; exit 1
              fi
            fi
          fi
          strip "${PKG}/c2pool-${COIN}"
          # Third-party libraries are static (provision-macos-deps), so the only
          # dylibs a slice may load from outside /usr/lib and /System are the
          # in-tree ones linked via @rpath (DASH: libdash_scriptcheck, the
          # hidden-visibility script interpreter, src/impl/dash/CMakeLists.txt).
          # Any other absolute reference is bundled the same way, so a stray
          # dependency can never stay pointed at the build host.
          ext_refs() { otool -L "$1" | tail -n +2 | awk '{print $1}' | grep -E '^/' | grep -vE '^(/usr/lib/|/System/)' || true; }
          for dylib in $(ext_refs "${PKG}/c2pool-${COIN}"); do
            base=$(basename "$dylib")
            cp "$dylib" "${PKG}/lib/${base}" && chmod u+w "${PKG}/lib/${base}"
            install_name_tool -change "$dylib" "@executable_path/lib/${base}" "${PKG}/c2pool-${COIN}"
          done
          for ref in $(otool -L "${PKG}/c2pool-${COIN}" | awk '/@rpath\//{print $1}'); do
            base=$(basename "$ref")
            src=$(find build -name "$base" -type f | head -1)
            [ -n "$src" ] || { echo "PKG-ASSERT FAIL: $ref not found under build/"; exit 1; }
            cp "$src" "${PKG}/lib/${base}" && chmod u+w "${PKG}/lib/${base}"
            install_name_tool -change "$ref" "@executable_path/lib/${base}" "${PKG}/c2pool-${COIN}"
          done
          # Bundle what the bundled dylibs need in turn, repeating until no
          # outside reference is left.
          changed=1
          while [ "$changed" -eq 1 ]; do
            changed=0
            for lib in "${PKG}"/lib/*.dylib; do
              [ -f "$lib" ] || continue
              for ref in $(ext_refs "$lib"); do
                base=$(basename "$ref")
                if [ ! -f "${PKG}/lib/${base}" ]; then
                  cp "$ref" "${PKG}/lib/${base}" && chmod u+w "${PKG}/lib/${base}"
                  changed=1
                fi
                install_name_tool -change "$ref" "@executable_path/lib/${base}" "$lib"
              done
            done
          done
          for lib in "${PKG}"/lib/*.dylib; do
            [ -f "$lib" ] || continue
            install_name_tool -id "@executable_path/lib/$(basename $lib)" "$lib"
          done
          echo "== load commands"
          otool -L "${PKG}/c2pool-${COIN}" "${PKG}"/lib/*.dylib 2>/dev/null || true
          if otool -L "${PKG}/c2pool-${COIN}" "${PKG}"/lib/*.dylib 2>/dev/null | grep -vE "^${PKG}/" | grep -E "@rpath/|/actions-runner/|/opt/homebrew/|/usr/local/|/Users/|/private/"; then
            echo "PKG-ASSERT FAIL: a dylib reference points outside the package"; exit 1
          fi
          for f in "${PKG}/c2pool-${COIN}" "${PKG}"/lib/*.dylib; do
            [ -f "$f" ] || continue
            a="$(lipo -archs "$f")"
            [ "$a" = "$ARCH" ] || { echo "PKG-ASSERT FAIL: $f is '$a', expected $ARCH"; exit 1; }
          done
          cp start.sh "${PKG}/" && chmod +x "${PKG}/start.sh"
          cp "config/${COIN}/c2pool_mainnet.yaml" "${PKG}/config/c2pool_mainnet.yaml.example"
          cp "config/${COIN}/c2pool_testnet.yaml" "${PKG}/config/c2pool_testnet.yaml"
          cp -r web-static/* "${PKG}/web-static/"
          cp explorer/explorer.py "${PKG}/explorer/"

      - name: Upload per-arch package (intermediate)
        if: steps.presence.outputs.exists == '1'
        uses: actions/upload-artifact@v7
        with:
          name: intermediate-macos-${{ matrix.coin }}-${{ matrix.arch }}
          path: c2pool-${{ matrix.coin }}-*-macos-${{ matrix.arch }}
          include-hidden-files: true

  # ════════════════════════════════════════════════════════════════════════════
  # macOS universal merge: lipo the per-arch binary and every bundled dylib
  # into one universal package. if: always() so a red cell on one coin never
  # blocks another coin's universal package (same decouple as the rest of the
  # matrix). Source-absent coins skip cleanly (no intermediate to merge).
  # ════════════════════════════════════════════════════════════════════════════
  macos-universal:
    name: ${{ matrix.coin }} package (macOS universal)
    needs: macos
    if: always()
    runs-on: ${{ inputs.force-github-hosted != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","c2pool-mac-arm"]') || 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        coin: ${{ fromJSON(github.event.inputs.coins || '["btc","ltc","dgb","dash","bch","bip110"]') }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check source presence
        id: presence
        run: |
          if [ -f "src/c2pool/main_${{ matrix.coin }}.cpp" ] && [ -d "src/impl/${{ matrix.coin }}" ]; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
            echo "::warning::c2pool-${{ matrix.coin }} source not on this ref — no universal package."
          fi

      - name: Download arm64 package
        if: steps.presence.outputs.exists == '1'
        uses: actions/download-artifact@v7
        with:
          name: intermediate-macos-${{ matrix.coin }}-arm64
          path: arm64

      - name: Download x86_64 package
        if: steps.presence.outputs.exists == '1'
        uses: actions/download-artifact@v7
        with:
          name: intermediate-macos-${{ matrix.coin }}-x86_64
          path: x86_64

      - name: lipo-merge universal package
        if: steps.presence.outputs.exists == '1'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          COIN="${{ matrix.coin }}"
          PKG="c2pool-${COIN}-${VERSION}-macos-universal"
          # The per-arch upload preserved its staged top-level dir, so each
          # download-artifact unpacks ONE level deep: arm64/<pkgdir>/c2pool-<coin>
          # (not arm64/c2pool-<coin>). Resolve that nested tree per arch.
          ARM_SRC="arm64/c2pool-${COIN}-${VERSION}-macos-arm64"
          X86_SRC="x86_64/c2pool-${COIN}-${VERSION}-macos-x86_64"
          # config/web-static/explorer/start.sh are arch-independent; seed the
          # universal package from the arm64 tree, then overwrite the binary
          # and every dylib with their lipo-merged universal counterparts.
          # Both slices link the same pinned libraries, so each bundled dylib
          # must exist in BOTH trees; one present in a single tree would ship
          # thin and fail to load on the other arch, so that is an error.
          cp -R "${ARM_SRC}" "${PKG}"
          mkdir -p "${PKG}/lib"
          rm -f "${PKG}/c2pool-${COIN}"
          lipo -create "${ARM_SRC}/c2pool-${COIN}" "${X86_SRC}/c2pool-${COIN}" -output "${PKG}/c2pool-${COIN}"
          chmod +x "${PKG}/c2pool-${COIN}"
          for base in $( (ls "${ARM_SRC}/lib" "${X86_SRC}/lib" 2>/dev/null || true) | grep '\.dylib$' | sort -u); do
            a="${ARM_SRC}/lib/${base}"; x="${X86_SRC}/lib/${base}"
            if [ ! -f "$a" ] || [ ! -f "$x" ]; then
              echo "::error::lib/${base} is bundled for only one arch (arm64: $([ -f "$a" ] && echo yes || echo no), x86_64: $([ -f "$x" ] && echo yes || echo no))"
              exit 1
            fi
            rm -f "${PKG}/lib/${base}"
            lipo -create "$a" "$x" -output "${PKG}/lib/${base}"
          done
          chmod +x "${PKG}/start.sh" 2>/dev/null || true
          # Ad-hoc re-sign. The per-arch step's strip and install_name_tool
          # invalidate the ad-hoc signatures the linker and Homebrew put on the
          # binary and the bundled dylibs ("changes being made to the file will
          # invalidate the code signature"), and Apple Silicon kills a process
          # that maps code with an invalid signature. Report what arrived
          # broken, then sign every Mach-O in the package ad hoc (each slice of
          # a universal file is signed). This is not a Developer ID signature.
          bad=0
          for f in "${PKG}"/lib/*.dylib "${PKG}/c2pool-${COIN}"; do
            [ -f "$f" ] || continue
            codesign --verify "$f" 2>/dev/null || bad=$((bad + 1))
          done
          echo "Mach-O files with an invalid signature before re-signing: $bad"
          for f in "${PKG}"/lib/*.dylib "${PKG}/c2pool-${COIN}"; do
            [ -f "$f" ] || continue
            codesign --force --sign - "$f"
          done
          for f in "${PKG}"/lib/*.dylib "${PKG}/c2pool-${COIN}"; do
            [ -f "$f" ] || continue
            codesign --verify --strict "$f" || { echo "::error::$f still fails codesign --verify"; exit 1; }
          done
          file "${PKG}/c2pool-${COIN}"

      # What ships must be universal end to end: the binary and every bundled
      # dylib carry exactly the arm64 and x86_64 slices, and both slices of the
      # signed package start (arm64 natively, x86_64 under Rosetta 2). The
      # x86_64 slice is cross-built, so this is where it is run as shipped.
      - name: Verify universal package (lipo -archs + both slices start)
        if: steps.presence.outputs.exists == '1'
        run: |
          PKG="c2pool-${{ matrix.coin }}-${{ steps.ver.outputs.version }}-macos-universal"
          BIN="${PKG}/c2pool-${{ matrix.coin }}"
          fail=0
          for f in "$BIN" "${PKG}"/lib/*.dylib; do
            [ -f "$f" ] || continue
            archs="$(lipo -archs "$f")"
            echo "lipo -archs ${f#${PKG}/}: $archs"
            case " $archs " in
              *" arm64 "*) ;;
              *) echo "::error::${f#${PKG}/} has no arm64 slice"; fail=1 ;;
            esac
            case " $archs " in
              *" x86_64 "*) ;;
              *) echo "::error::${f#${PKG}/} has no x86_64 slice"; fail=1 ;;
            esac
            [ "$(echo $archs | wc -w)" -eq 2 ] || { echo "::error::${f#${PKG}/} has unexpected slices: $archs"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
          for a in arm64 x86_64; do
            minos="$(otool -arch "$a" -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')"
            echo "$a slice minimum macOS: ${minos:-unknown}"
          done
          bash scripts/ci/macos_slice_smoke.sh arm64 "$BIN" smoke-universal-arm64.log
          bash scripts/ci/macos_slice_smoke.sh x86_64 "$BIN" smoke-universal-x86_64.log

      - name: Zip universal package
        if: steps.presence.outputs.exists == '1'
        run: |
          PKG="c2pool-${{ matrix.coin }}-${{ steps.ver.outputs.version }}-macos-universal"
          zip -r "${PKG}.zip" "${PKG}/"

      # On the binary users download: each slice of the stripped universal
      # c2pool-dash carries dashbls (rodata leg; stripped Mach-O keeps a token
      # symbol table, hence --rodata-only), gmp is either linked in statically
      # (the provision-macos-deps build) or bundled as a universal dylib, and
      # the package starts and names a REAL backend on both slices (arm64
      # natively, x86_64 under Rosetta 2; no Rosetta is an error).
      - name: BLS link guard + backend line (DASH, universal package)
        if: steps.presence.outputs.exists == '1' && matrix.coin == 'dash'
        run: |
          PKG="c2pool-dash-${{ steps.ver.outputs.version }}-macos-universal"
          BIN="${PKG}/c2pool-dash"
          for a in arm64 x86_64; do
            lipo -thin "$a" "$BIN" -output "bls-guard-$a"
            echo "== slice $a"
            bash scripts/ci/dash_bls_linked_guard.sh --rodata-only "bls-guard-$a"
            rm -f "bls-guard-$a"
          done
          # gmp: a slice that loads a libgmp dylib must find it in lib/ with
          # both slices; otherwise it is linked statically (no load command).
          for a in arm64 x86_64; do
            refs="$(otool -arch "$a" -L "$BIN" | awk 'NR>1 && /libgmp/{print $1}')"
            if [ -z "$refs" ]; then
              echo "  ok   $a: gmp linked statically (no libgmp load command)"
              continue
            fi
            for r in $refs; do
              lib="${PKG}/lib/$(basename "$r")"
              [ -f "$lib" ] || { echo "::error::$a slice loads $r, which is not bundled"; exit 1; }
              lipo "$lib" -verify_arch arm64 x86_64 || { echo "::error::$lib is not universal"; exit 1; }
              echo "  ok   $a: $r bundled and universal"
            done
          done
          # Prints the backend line; on a miss, the exit status and the output.
          run_line() {
            rc=0
            "$@" --help > help.log 2>&1 || rc=$?
            if ! grep -m1 'DASH BLS backend:' help.log; then
              echo "(no backend line; exit status $rc; output follows)"
              tail -n 20 help.log
            fi
          }
          line="$(run_line arch -arm64 "$BIN")"
          echo "arm64 (native): $line"
          case "$line" in *"DASH BLS backend: REAL"*) ;; *) echo "::error::universal c2pool-dash (arm64) does not report a REAL BLS backend"; exit 1 ;; esac
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::error::Rosetta 2 is not available on this host; the cross-built x86_64 slice cannot be checked"
            exit 1
          fi
          line="$(run_line arch -x86_64 "$BIN")"
          echo "x86_64 (Rosetta 2): $line"
          case "$line" in *"DASH BLS backend: REAL"*) ;; *) echo "::error::universal c2pool-dash (x86_64) does not report a REAL BLS backend"; exit 1 ;; esac

      - name: Upload universal package
        if: steps.presence.outputs.exists == '1'
        uses: actions/upload-artifact@v7
        with:
          name: pkg-macos-${{ matrix.coin }}
          path: c2pool-*-macos-universal.zip

      - name: Build DMG installer
        if: steps.presence.outputs.exists == '1'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          COIN="${{ matrix.coin }}"
          bash installer/macos/create-dmg.sh \
            --staged "c2pool-${COIN}-${VERSION}-macos-universal" \
            --name "c2pool-${COIN}" \
            --version "${VERSION}" \
            --arch universal

      - name: Upload DMG installer
        if: steps.presence.outputs.exists == '1'
        uses: actions/upload-artifact@v7
        with:
          name: pkg-macos-dmg-${{ matrix.coin }}
          path: c2pool-*-macos-universal.dmg

  # ════════════════════════════════════════════════════════════════════════════
  # Windows x86_64 (MSVC 2022, Conan)
  # ════════════════════════════════════════════════════════════════════════════
  windows:
    name: ${{ matrix.coin }} package (Windows x86_64)
    runs-on: ${{ inputs.force-github-hosted != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Windows","X64","c2pool-build"]') || 'windows-2022' }}
    defaults:
      run:
        # VM217 Windows PowerShell runs at ExecutionPolicy=Restricted and has no
        # Git-bash on the runner-service PATH (shell:bash -> "bash: command not
        # found"). Use the ExecutionPolicy-Bypass PowerShell shell proven green
        # by build.yml's Windows lane (probe 28679257030). cmd steps override.
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
    strategy:
      fail-fast: false
      matrix:
        coin: ${{ fromJSON(github.event.inputs.coins || '["btc","ltc","dgb","dash","bch","bip110"]') }}
    steps:
      - uses: actions/checkout@v6

      # Per-coin-cell Conan home; RUNNER_TEMP is step-scope only, so export via
      # $GITHUB_ENV (job-level `env: runner.temp` fails to parse). PowerShell form.
      - name: Set per-job Conan home
        run: echo "CONAN_HOME=$env:RUNNER_TEMP/conan2" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve version
        id: ver
        run: |
          if ("${{ github.event.inputs.version }}") {
            "version=${{ github.event.inputs.version }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } elseif ("${env:GITHUB_REF}" -like "refs/tags/v*") {
            "version=$("${env:GITHUB_REF_NAME}".TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "version=0.0.0-$("${env:GITHUB_SHA}".Substring(0,8))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Check source presence
        id: presence
        run: |
          if ((Test-Path "src/c2pool/main_${{ matrix.coin }}.cpp") -and (Test-Path "src/impl/${{ matrix.coin }}")) {
            "exists=1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "exists=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::warning::c2pool-${{ matrix.coin }} source not on this ref -- no ${{ matrix.coin }} Windows package will be produced."
          }

      - uses: actions/setup-python@v6
        if: steps.presence.outputs.exists == '1' && runner.environment == 'github-hosted'
        with: { python-version: '3.12' }

      - name: Install Conan 2
        if: steps.presence.outputs.exists == '1'
        run: |
          # VM217 exposes neither conan nor a bare python on the runner-service
          # PATH (setup-python is gated off self-hosted); resolve an interpreter
          # via the Windows py launcher (py -> python3 -> python), pip-install
          # conan, and export its Scripts dir(s) through GITHUB_PATH. On the
          # github-hosted fork fallback py/python resolve normally.
          $py = $null
          foreach ($cand in @('py','python3','python')) {
            if (Get-Command $cand -ErrorAction SilentlyContinue) { $py = $cand; break }
          }
          if (-not $py) {
            Write-Host "No Python interpreter on PATH. Diagnostics:"
            & where.exe python 2>&1; & where.exe py 2>&1; & where.exe python3 2>&1
            Write-Host "PATH=$env:PATH"
            throw "VM217 has no Python interpreter on the runner-service PATH"
          }
          Write-Host "Using interpreter: $py"
          & $py -m pip install "conan>=2.0,<3.0"
          $scripts = & $py -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $userScripts = & $py -c "import sysconfig; print(sysconfig.get_path('scripts','nt_user'))"
          $env:PATH = "$scripts;$userScripts;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $scripts
          Add-Content -Path $env:GITHUB_PATH -Value $userScripts
          conan --version

      - name: Show committed Conan profile
        if: steps.presence.outputs.exists == '1'
        run: conan profile show -pr:a=ci/conan/windows-msvc.profile

      - name: Restore Conan cache
        if: steps.presence.outputs.exists == '1'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/conan2
          key: conan2-windows-msvc194-${{ hashFiles('conanfile.txt', 'ci/conan/windows-msvc.profile', 'conan.lock') }}

      - name: Conan install
        if: steps.presence.outputs.exists == '1'
        run: conan install . -pr:a=ci/conan/windows-msvc.profile --lockfile=conan.lock --build=missing --output-folder=build_ci

      - name: Build secp256k1
        if: steps.presence.outputs.exists == '1'
        run: |
          # Bounded retry + shallow: survive a stalled fetch on the lossy
          # WAN uplink (GIT_HTTP_LOW_SPEED_* aborts the stall in ~20s).
          for ($i = 1; $i -le 3; $i++) {
            git clone --depth 1 https://github.com/bitcoin-core/secp256k1 secp256k1-src
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { Write-Host "::error::secp256k1 clone failed after 3 attempts"; exit 1 }
            Write-Host "::warning::secp256k1 clone attempt $i/3 stalled; retrying"
            Remove-Item -Recurse -Force secp256k1-src -ErrorAction SilentlyContinue
            Start-Sleep -Seconds ($i * 5)
          }
          # -DSECP256K1_ENABLE_MODULE_RECOVERY=ON: upstream defaults this module
          # OFF, and with it off the recovery header (secp256k1_recovery.h) is
          # NOT installed and the recovery symbols are NOT compiled. Linux gets
          # it from libsecp256k1-dev, macOS from scripts/ci/build_macos_deps.sh;
          # this source build must enable it explicitly so spork.hpp's
          # <secp256k1_recovery.h> resolves and secp256k1_ecdsa_recover* link.
          cmake -B secp256k1-src/build -S secp256k1-src -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${env:GITHUB_WORKSPACE}/secp256k1" -DSECP256K1_ENABLE_MODULE_RECOVERY=ON -DSECP256K1_BUILD_TESTS=OFF -DSECP256K1_BUILD_EXHAUSTIVE_TESTS=OFF -DSECP256K1_BUILD_BENCHMARK=OFF -DSECP256K1_BUILD_EXAMPLES=OFF
          cmake --build secp256k1-src/build --config Release
          cmake --install secp256k1-src/build --config Release

      # DASH cell only: c2pool_dashbls.dll -- dash's own src/dashbls at the
      # pinned tag, built as dashd's Windows release builds it (mingw-w64 via
      # MSYS2, ARITH=GMP) behind a C ABI the MSVC exe can link. Once per runner
      # per key; exports DASHBLS_ROOT.
      - name: Provision dashbls (DASH only)
        if: steps.presence.outputs.exists == '1' && matrix.coin == 'dash'
        uses: ./.github/actions/provision-dashbls-win64

      - name: Configure
        if: steps.presence.outputs.exists == '1'
        shell: cmd
        # DGB: -DAUX_DOGE=ON -> DGB parent + embedded DOGE (mirrors c2pool-ltc).
        # DASH: -DC2POOL_DASH_BLS=ON is a HARD requirement (FATAL_ERROR without the DLL).
        run: cmake -S . -B build_ci -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=build_ci/conan_toolchain.cmake -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%/secp256k1" -DCMAKE_CXX_FLAGS="/D_WIN32_WINNT=0x0A00" ${{ matrix.coin == 'dgb' && '-DAUX_DOGE=ON' || '' }} ${{ matrix.coin == 'dash' && '-DC2POOL_DASH_BLS=ON -DDASHBLS_ROOT="%DASHBLS_ROOT%"' || '' }}

      # Boost header-integrity + version gate (VS multi-config -> --config/-C Release).
      # A torn/mixed Boost tree fails HERE, before the coin packaging build.
      - name: Boost sentinel
        if: steps.presence.outputs.exists == '1'
        shell: cmd
        run: |
          cmake --build build_ci --target boost_sentinel --config Release -j %NUMBER_OF_PROCESSORS%
          ctest --test-dir build_ci -R "^boost_sentinel$" -C Release --output-on-failure

      - name: Build c2pool-${{ matrix.coin }}
        if: steps.presence.outputs.exists == '1'
        shell: cmd
        # VM217 has a fixed 2GB pagefile; a 16-way MSVC parallel build of the
        # heavy btc+NMC (and dgb+DOGE) TU set drives commit charge past the
        # 32GB+2GB wall. The failure surfaces as an orphaned MSBuild with NO
        # C####/LNK diagnostic. Cap MSBuild /maxcpucount (cmake -j -> /maxcpucount
        # on the VS generator) to bound concurrent cl.exe and keep committed
        # memory under the wall. Conservative 8; tune up only if headroom allows.
        run: cmake --build build_ci --target c2pool-${{ matrix.coin }} --config Release -j 8

      - name: Smoke test (--help)
        if: steps.presence.outputs.exists == '1'
        run: |
          # SONAME-agnostic glob: upstream bumps libsecp256k1-N.dll (6->7 etc). Do NOT re-pin a number.
          Copy-Item "${env:GITHUB_WORKSPACE}/secp256k1/bin/libsecp256k1-*.dll" build_ci/src/c2pool/Release/
          if ("${{ matrix.coin }}" -eq "dash") { Copy-Item "${env:DASHBLS_ROOT}/bin/c2pool_dashbls.dll" build_ci/src/c2pool/Release/ }
          $ErrorActionPreference = 'SilentlyContinue'
          # --help writes usage to stderr; buffer first so Select-Object truncation
          # cannot break the pipe and surface a NativeCommandError (false red).
          $out = & build_ci/src/c2pool/Release/c2pool-${{ matrix.coin }}.exe --help 2>&1
          $out | Select-Object -First 5 | Write-Host
          exit 0

      # The BLS-crypto KATs run through the very DLL that ships (real testnet
      # quorum signature, tamper rejection, aggregate VerifySecure round-trip,
      # scheme-faithful key compare) -- the same KATs build.yml's
      # linux-dash-bls leg runs. The startup line is checked on the packaged
      # exe below, where every DLL it needs sits next to it.
      - name: BLS KATs (DASH only)
        if: steps.presence.outputs.exists == '1' && matrix.coin == 'dash'
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build build_ci --target test_dash_bls_verify --config Release -j 8
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::test_dash_bls_verify failed to build"; exit 1 }
          $tdir = "build_ci/test/Release"
          Copy-Item "${env:GITHUB_WORKSPACE}/secp256k1/bin/libsecp256k1-*.dll" $tdir
          Copy-Item "${env:DASHBLS_ROOT}/bin/c2pool_dashbls.dll" $tdir
          $kat = (& "$tdir/test_dash_bls_verify.exe" 2>&1 | Out-String)
          $rc = $LASTEXITCODE
          Write-Host $kat
          if ($rc -ne 0) { Write-Host "::error::BLS KATs failed (exit $rc)"; exit 1 }
          $missing = $false
          foreach ($t in @('DashBlsVerify.SelfReportIsTruthful',
                           'DashBlsVerify.RealQuorumSigAcceptsAndTamperRejects',
                           'DashBlsVerify.BlsSmokeSignVerify',
                           'DashBlsVerify.VerifyFinalCommitmentSyntheticRoundTrip',
                           'DashBlsVerify.OpkeyPointEqIsSchemeFaithful')) {
            if ($kat.Contains("OK ] $t")) { Write-Host "  ok   $t" } else { Write-Host "  MISS $t did not report as run"; $missing = $true }
          }
          if ($missing) { Write-Host "::error::BLS KATs did not all run on Windows"; exit 1 }
          exit 0

      - name: Package
        if: steps.presence.outputs.exists == '1'
        run: |
          $VERSION = "${{ steps.ver.outputs.version }}"
          $COIN = "${{ matrix.coin }}"
          $PKG = "c2pool-${COIN}-${VERSION}-windows-x86_64"
          New-Item -ItemType Directory -Path "${PKG}/lib","${PKG}/config","${PKG}/web-static","${PKG}/explorer" -Force
          Copy-Item "build_ci/src/c2pool/Release/c2pool-${COIN}.exe" "${PKG}/"
          # DLL must be next to exe for Windows DLL search path (portable ZIP)
          # Also copy to lib/ for Inno Setup installer compatibility
          # SONAME-agnostic glob: upstream bumps libsecp256k1-N.dll (6->7 etc). Do NOT re-pin a number.
          Copy-Item "${env:GITHUB_WORKSPACE}/secp256k1/bin/libsecp256k1-*.dll" "${PKG}/"
          Copy-Item "${env:GITHUB_WORKSPACE}/secp256k1/bin/libsecp256k1-*.dll" "${PKG}/lib/"
          # In-tree shared libraries the exe links (DASH: the dash_scriptcheck script
          # interpreter, a SHARED target in src/impl/dash/CMakeLists.txt) sit in the
          # build tree, not in the secp256k1 prefix; bundle them next to the exe (portable zip) and in lib/ (the installer packs lib\*).
          Get-ChildItem -Recurse -Path build_ci -Filter "*scriptcheck*.dll" | ForEach-Object { Copy-Item $_.FullName "${PKG}/"; Copy-Item $_.FullName "${PKG}/lib/" }
          if ($COIN -eq "dash" -and -not (Get-ChildItem -Path "${PKG}" -Filter "*scriptcheck*.dll")) {
            Write-Error "PKG-ASSERT FAIL: dash_scriptcheck DLL not bundled in ${PKG}"; exit 1
          }
          # DASH: the BLS backend (dashbls + static gmp/libstdc++ in one DLL).
          # c2pool-dash.exe imports it, so without it the exe does not start.
          if ($COIN -eq "dash") {
            Copy-Item "${env:DASHBLS_ROOT}/bin/c2pool_dashbls.dll" "${PKG}/"
            Copy-Item "${env:DASHBLS_ROOT}/bin/c2pool_dashbls.dll" "${PKG}/lib/"
          }
          Copy-Item start.bat "${PKG}/"
          Copy-Item -Recurse web-static/* "${PKG}/web-static/"
          Copy-Item explorer/explorer.py "${PKG}/explorer/"
          Copy-Item "config/${COIN}/c2pool_mainnet.yaml" "${PKG}/config/c2pool_mainnet.yaml.example"
          Copy-Item "config/${COIN}/c2pool_testnet.yaml" "${PKG}/config/c2pool_testnet.yaml"
          Compress-Archive -Path "${PKG}" -DestinationPath "${PKG}.zip"

      # On the packaged files: the exe imports the BLS verify entry points from
      # c2pool_dashbls.dll by name, the DLL next to it carries the ciphersuite,
      # loads, and reports the pinned tag with ARITH=GMP; then the packaged exe
      # itself starts and names a REAL backend.
      - name: BLS link guard + backend line (DASH, packaged artefact)
        if: steps.presence.outputs.exists == '1' && matrix.coin == 'dash'
        run: |
          $PKG = "c2pool-dash-${{ steps.ver.outputs.version }}-windows-x86_64"
          $pin = ($env:DASHBLS_WIN_KEY -split ' ')[0]
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/dash_bls_linked_guard.ps1 -Exe "${PKG}/c2pool-dash.exe" -Pin $pin
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem "${PKG}" -Filter *.dll | ForEach-Object { Write-Host ("  bundled {0} ({1:N0} bytes)" -f $_.Name, $_.Length) }
          # The packaged exe starts and names a REAL backend. [string] + Contains,
          # not -match: an empty pipeline result is AutomationNull, and
          # "AutomationNull -notmatch x" is an empty (false) array, which once let
          # a missing line through.
          $ErrorActionPreference = 'Continue'
          $out = [string](& "${PKG}/c2pool-dash.exe" --help 2>&1 | Out-String)
          $rc = $LASTEXITCODE
          $line = [string]($out -split "`r?`n" | Where-Object { $_.Contains('DASH BLS backend:') } | Select-Object -First 1)
          Write-Host ("windows x86_64 (packaged, exit 0x{0:X8}): {1}" -f $rc, $line)
          if (-not $line.Contains('DASH BLS backend: REAL')) {
            Write-Host "--- output ---"; Write-Host $out
            Write-Host "::error::packaged c2pool-dash.exe does not report a REAL BLS backend"
            exit 1
          }
          exit 0

      - name: Upload package
        if: steps.presence.outputs.exists == '1'
        uses: actions/upload-artifact@v7
        with:
          name: pkg-windows-${{ matrix.coin }}
          path: c2pool-*-windows-x86_64.zip

      # Ensure Inno Setup 6 is present. choco is broken on VM217 (cannot write
      # C:\ProgramData\chocolatey\lib-bad), so install directly from jrsoftware
      # via the official silent installer. The self-hosted runner persists it
      # across jobs, so after the first run this is a fast no-op.
      - name: Ensure Inno Setup 6 (for setup.exe installer)
        if: steps.presence.outputs.exists == '1'
        continue-on-error: true  # Inno is a nice-to-have; never block the .zip release
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) { Write-Host "Inno Setup already installed: $iscc"; exit 0 }
          Write-Host "Inno Setup not found; installing from jrsoftware.org ..."
          $out = Join-Path $env:RUNNER_TEMP "innosetup-6.exe"
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $out -UseBasicParsing
          Start-Process -FilePath $out -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/NOICONS' -Wait -NoNewWindow
          if (-not (Test-Path $iscc)) { throw "Inno Setup install failed: ISCC.exe not found at $iscc" }
          Write-Host "Inno Setup installed: $iscc"

      # The portable .zip (uploaded above) is the must-have; the installer is
      # built on top of it. With Inno Setup guaranteed by the step above, this
      # now produces setup.exe on every run. continue-on-error is kept so an
      # unexpected ISCC failure still ships the .zip rather than failing the cell.
      - name: Build setup.exe installer (Inno Setup)
        if: steps.presence.outputs.exists == '1'
        shell: cmd
        continue-on-error: true
        run: |
          set "ISCC=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if not exist "%ISCC%" (
            echo ::warning::Inno Setup unexpectedly absent after install step; skipping setup.exe. Portable .zip already uploaded.
            exit /b 0
          )
          set "PKG=c2pool-${{ matrix.coin }}-${{ steps.ver.outputs.version }}-windows-x86_64"
          for /f "delims=" %%i in ('powershell -NoProfile -Command "(Get-ChildItem -Path 'C:\Program Files\Microsoft Visual Studio\2022' -Recurse -Filter vc_redist.x64.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName"') do set "VCREDIST=%%i"
          "%ISCC%" installer\windows\c2pool-setup.iss ^
            /DPACKAGE_DIR="%CD%\%PKG%" ^
            /DVCREDIST_PATH="%VCREDIST%" ^
            /DMyAppName=c2pool-${{ matrix.coin }} ^
            /DMyAppVersion=${{ steps.ver.outputs.version }} ^
            /DMyAppExeName=c2pool-${{ matrix.coin }}.exe ^
            /DOutputBase=%PKG%-setup
          copy "installer\windows\Output\%PKG%-setup.exe" .

      - name: Upload setup.exe installer
        if: steps.presence.outputs.exists == '1'
        uses: actions/upload-artifact@v7
        with:
          name: pkg-windows-setup-${{ matrix.coin }}
          path: c2pool-*-windows-x86_64-setup.exe
          # warn (not ignore): if ISCC ran but produced no .exe, surface it as a
          # run annotation instead of silently shipping a draft with no installer.
          # Still non-fatal — the portable .zip remains the must-have deliverable.
          if-no-files-found: warn

  # ════════════════════════════════════════════════════════════════════════════
  # Aggregate: single SHA256SUMS over every produced package; on tags,
  # attach everything to a DRAFT release (operator publishes manually).
  # if: always() — runs even when some coin cells are red or skipped, so a
  # red btc never blocks the other coins' packages from shipping.
  # ════════════════════════════════════════════════════════════════════════════
  checksums:
    name: SHA256SUMS + draft release
    runs-on: ${{ inputs.force-github-hosted != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","c2pool-build"]') || 'ubuntu-24.04' }}
    needs: [linux, macos-universal, windows]
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v7
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS

      # Idempotent draft assembly: a v-tag draft may already exist from a prior
      # re-run of this job. gh release create is NOT idempotent -- it spawns a
      # SECOND draft with the same tag_name, so repeated runs pile up duplicate
      # "vX.Y.Z" drafts. Refresh ONE canonical draft instead: upload --clobber
      # if the release exists, else create it fresh.
      - name: Assemble draft release (idempotent)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Draft $TAG already exists -- refreshing assets in place (--clobber)."
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            echo "No release for $TAG -- creating fresh draft."
            gh release create "$TAG" \
              --repo "$REPO" \
              --draft \
              --title "c2pool $TAG" \
              --notes "Draft assembled by release.yml -- operator reviews and publishes manually." \
              dist/*
          fi

      # Steady-state disk hygiene on the VM905 self-hosted runners: drop the
      # checkout payload and _temp, keep _actions/_tool/_update. Always runs.
      - name: Prune runner workspace
        if: always()
        uses: ./.github/actions/prune-runner-workspace
