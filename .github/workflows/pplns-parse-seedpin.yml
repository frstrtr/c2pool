name: PPLNS parse seed-pin guard

# Permanent regression guard for the PPLNS parse property suite.
#
# The random-seeded web-static job (build.yml) can pass even when a specific
# fast-check sequence still reproduces a bug, because it never replays that
# sequence. This job pins seed -1679627146 — the counterexample that found
# the non-finite legacy bare-number regression (input [Infinity] ->
# totalPrimary Infinity, fixed in PR #51) — so the exact failing path is
# re-exercised deterministically on every change to the parser or its tests.

on:
  push:
    branches: [master]
    paths:
      - "web-static/sharechain-explorer/**"
      - ".github/workflows/pplns-parse-seedpin.yml"
  pull_request:
    branches: [master]
    paths:
      - "web-static/sharechain-explorer/**"
      - ".github/workflows/pplns-parse-seedpin.yml"

env:
  # Fail-fast on a stalled git HTTP transfer instead of hanging to the job
  # timeout. Our WAN uplink stalls ~12% of codeload fetches (they neither
  # finish nor error out); aborting a sub-1000 B/s transfer after 20s lets
  # actions/checkout built-in 3-attempt fetch retry recover in ~1 min.
  GIT_HTTP_LOW_SPEED_LIMIT: '1000'
  GIT_HTTP_LOW_SPEED_TIME: '20'

jobs:
  seedpin:
    name: PPLNS parse seed-pin replay
    # Route to self-hosted for trusted events; fork PRs fall back to
    # GitHub-hosted ubuntu-24.04 (never run untrusted fork code self-hosted).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","c2pool-build"]') || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: web-static/sharechain-explorer
    steps:
      - uses: actions/checkout@v6

      - name: Materialize tree + guard cache path (fail closed)
        working-directory: ${{ github.workspace }}
        run: |
          # Reused self-hosted workspace: prune-runner-workspace strips the
          # checkout to .git/.github at the prior job's end. actions/checkout
          # then runs `checkout -f <sha>`, which only rewrites files that
          # DIFFER between the previously-checked-out commit and this head, so
          # a lockfile unchanged across the two commits is left physically
          # absent even though HEAD is correct. setup-node's
          # cache-dependency-path glob then resolves nothing and dies with an
          # opaque "Some specified paths were not resolved". reset --hard
          # writes the ENTIRE target tree to disk, closing that gap
          # deterministically. (Mirrors build.yml's Web-static verify guard.)
          git reset --hard HEAD
          # Regression guard (standing rule: assertion ships in the fixing PR):
          # the cache-dependency-path MUST exist on disk before setup-node, or
          # a genuinely moved/removed lockfile turns into the same opaque red.
          lock="web-static/sharechain-explorer/package-lock.json"
          if [ ! -f "$lock" ]; then
            echo "::error title=cache-dependency-path unresolved::${lock} absent on disk after checkout. The lockfile moved/was removed, or the tree failed to materialize — fix the path or the checkout, NOT the cache step." >&2
            exit 1
          fi
          echo "checkout verified: ${lock} present on disk"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-static/sharechain-explorer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Replay pinned seed -1679627146 against PPLNS parse property suite
        run: |
          node --import tsx --import ./.ci-seed-pin.mjs \
            --test "tests/unit/pplns-parse-properties.test.ts"

      # Steady-state disk hygiene on the VM905 self-hosted runners: drop the
      # checkout payload and _temp, keep _actions/_tool/_update. Always runs.
      - name: Prune runner workspace
        if: always()
        uses: ./.github/actions/prune-runner-workspace
